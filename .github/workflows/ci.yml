# SPDX-License-Identifier: GPL-3.0-only
#
# 门禁在 CI 上跑一遍。
#
# 为什么值得有：README 里那七条任务此前只有"人记得跑"这一种执行方式，
# 而"记得跑"不是门禁，是纪律。截图门禁尤其如此 —— 它挡的是"改了界面没重录参考图"，
# 恰恰是最容易被本地增量缓存掩盖的一类回归。
#
# 跑的就是 AGENTS.md §1 的两份清单（测试七条 + 门禁十条），一个字都不多。
#
# **三份清单必须同步**：AGENTS.md §1 / README「质量门禁与验证」/ 本文件。
# 它们曾经发散过：README 写「五个模块」漏掉 :app:jvmTest 与 :cli:test（还声称"与
# AGENTS.md §1 同一口径"），CI 又照 README 抄了一遍，于是 :cli（领域层零 Compose 的
# 可执行验收物）和 :domainComposeFreeGate（守那条边界的门禁）长期不在 CI 里跑。
# 对账命令：grep -n 'Gate\|jvmTest\|cli:test' AGENTS.md README.md .github/workflows/ci.yml
#
# 依赖 luciola 原生库的用例（:core:jvmTest 里 8 个类）在 CI 上**真跑**：
# luciola 钉的是 `0.11.0-local.1`（未发布到 Maven Central，按「稳定后再发布」的自节奏），
# 依赖解析只在 mavenLocal ⇒ CI 在跑门禁前先从公共仓（github.com/kexuejin/luciola，
# main 与本仓钉值同源）checkout 源码、现场构建并按需 publish 到 runner 的 ~/.m2
# （LUCIOLA_LOCAL=1 放行 settings 开关；只发 android/jvm/root —— iOS klib 的
# cinterop 需要 Apple 工具链，linux 出不了，CI 也不解析 iOS 变体），再用同一份
# 源码交叉构建 linux .so 交给 TENON_LUCIOLA_NATIVE。同一份源 ⇒ UniFFI checksums
# 与 bindings 必然对上。本机不受影响：照旧 luciola 仓 publish-maven-local.sh +
# LUCIOLA_LOCAL=1（本机脚本连 iOS klib 全量发）。
#
# 截图门禁（:androidApp:validateDebugScreenshotTest）**不在 CI 里跑**：参考图按 .gitignore 里
# 「截图测试基准图」那一段
# 由本机生成、不入库，全新检出上没有参考图，跑了只会报「234 张都是新增」。它是本地门禁，
# 命令与判据见 AGENTS.md §1。
# 逐屏对比度（check-contrast）同理**不在 CI 里跑**：量的是 Chrome 渲染的实际像素色，
# 读数随 Chrome 版本/平台的抗锯齿合成移动 —— 首轮 CI 跑到底实锤：本机 0 处低于 AA，
# runner 上同一份稿子量出 397 处（4.17:1 的色对本机是过线的）。渲染像素类检查是
# 本地门禁；CI 保留 css-vars / 图集 manifest / 渲染体检这三条文本层检查。
# 外加三条注释门禁，都来自 `docs/relay-comment-audit.md` §4 的政策 ——
# 它们挡的不是代码错，是"注释会悄悄腐坏"这一类：
#   :cjkLiteralGate            硬编码中文字面量（与 :constructionTraceGate 同构）
#   :staleCommentRefGate       注释里的 `X.kt:NN` 行号引用（随重构腐坏，且毫无编译错误）
#   :constructionTraceGate     注释里的日期 / 真机型号 / 内网地址 / 本机路径 / 决议号 /
#                              指向 docs/plans/ 与 ARCHITECTURE.md 的死指针
# 每条都有配套的 `…Baseline` 任务做棘轮重生成，只在有意为之且经评审时上调。
# 外加一条不在 Gradle 里的：逐屏调色板对账（tools/check-design-palette.py）。
# 截图门禁只保证"参考图和当前渲染一致"，不保证"参考图里是一屏对颜色"，这条补后者。
#
# 设计契约三条也挂在同一条 Gradle 链上（:designSpecDrift / :designTokenUsageGate /
# :designStateSlotGate）。它们挡的是"颜色有门禁所以精致、间距没有门禁所以随手写字面量"
# 那类不对称：spec 与代码逐键漂移、token 采用率回退、状态槽覆盖缩小，三者任一都报红。
#
# 代码侧的门禁管不到**设计源自己**：prototype/relay.html 有四个自检工具
# （check-render / check-contrast / check-refs / shoot-relay --verify-only），
# 2026-10-15 起接在本文件末尾。它们挡的是"稿子改了但验收图没重拍"这一整类。
#
# 不需要设备或模拟器：截图测试在宿主 JVM 上渲染 Compose 预览（见 README「质量门禁与验证」）。
# 也不需要 -PrelayMirror=aliyun —— 那个开关是给连不上 dl.google.com 的开发机用的，
# GitHub 的 runner 连得上官方源。
#
# 诚实说明：这份 workflow 是在开发机上写的，本地没有 runner，
# 所以它"在 GitHub 上真的跑绿过"这件事还没有证据。第一次推上去要盯着看。

name: gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消上一次：门禁是幂等的，没必要排队跑过期的提交。
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ── luciola 产物链（依赖解析 + 原生库，见文件头注释）──────────────────
      # 为什么不是「发 Central 就好了」：版本按「稳定后再发布」的自节奏钉在
      # -local.1 上（settings.gradle.kts 的守卫会把这一决定变成可读的报错）。
      # CI 的答案是**源码自足**：公共仓 main 上就有这个版本的源码（build.gradle.kts
      # 里的 version 与本仓 toml 钉值逐字一致），现场构建不依赖作者本机。
      - name: Checkout luciola（公共仓源码，与本仓钉的 -local 版本同源）
        uses: actions/checkout@v4
        with:
          repository: kexuejin/luciola
          ref: main
          path: luciola-src

      # JDK 21 与 README「构建」一节同源（本地是 /opt/homebrew/opt/openjdk@21）。
      # luciola 的 publish 脚本里要跑 Gradle，所以它必须在 luciola 产物链之前。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Android SDK 平台件。版本对齐 gradle/libs.versions.toml：compileSdk 36、
      # buildToolsVersion 36.1.0。luciola 的 androidLibrary compileSdk 也是 36 ——
      # publish 步骤同样吃这一步，所以它必须在 luciola 产物链之前。
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.1.0"

      # gradle 缓存提前到 luciola publish 之前：脚本里的 Gradle 构建
      # （examples/android-demo → :luciola:publishToMavenLocal）与后面的门禁
      # 共享同一份 ~/.gradle 缓存。
      - uses: gradle/actions/setup-gradle@v4

      # cargo registry/bin（含 cargo-ndk）与构建产物缓存。key 里的 v1 是手动
      # 失效阀（换 NDK/工具链版本时 bump）。target 目录可以安全地跨源复用：
      # cargo 按指纹重建，陈旧产物只会慢、不会错。
      - name: Cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            luciola-src/target
          key: luciola-cargo-${{ runner.os }}-v1
          restore-keys: luciola-cargo-${{ runner.os }}-

      # ubuntu-latest 镜像自带 rustup/cargo，但目标三元组不全。
      #   aarch64-linux-android —— cargo-ndk 出 AAR 内嵌的 arm64 .so；
      #   host linux .so（后面另建）给 :core:jvmTest 的 8 个真引擎用例。
      #   iOS 三元组**不装**：CI 不解析 iOS 变体，而带 C 依赖的 crate（ring）在
      #     linux 上交叉编译 iOS 目标需要 xcrun/Apple SDK —— 首轮 CI 实锤
      #     （cc-rs: failed to find tool "xcrun"），iOS 产物留给 macOS 本机出。
      - name: Rust 目标三元组
        run: rustup target add aarch64-linux-android

      # cargo-ndk：镜像不预装。有缓存时跳过（--locked 固定行为）。
      - name: 装 cargo-ndk
        run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked

      # AAR 内嵌 .so 的构建需要 NDK（只有 cargo-ndk 用它；AGP 只打包不编译）。
      # 版本对齐 luciola 仓脚本要求的 ndk 工作流；sdkmanager 幂等。
      - name: 装 Android NDK（cargo-ndk 出 arm64 .so 要用）
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null

      # publish 到 runner 的 ~/.m2：**只发 android/jvm/root 三个 publication**，
      # 版本 = 0.11.0-local.1，与本仓 toml 钉值逐字一致（不一致会在解析时红，不是静默）。
      # 为什么不走 publish-maven-local.sh 全量：全量会连 iOS klib 一起发，而 iOS klib
      # 的 cinterop 需要苹果侧静态库 —— linux 上出不了（见上一步注释）。CI 的任务图
      # 只解析 android/jvm 变体，iOS 变体留给 macOS 本机发。AAR 内嵌引擎的 sha256
      # 自校验（脚本第 3 步同款判据）在这里内联保留 —— publish 出来的东西没带
      # 引擎会被它拦下，不靠自觉。
      - name: 构建 luciola 并按需 publish 到 runner mavenLocal
        run: |
          cd luciola-src
          RUSTFLAGS="${RUSTFLAGS:-} --cfg aes_armv8 -C target-feature=+aes,+sha2" \
            cargo ndk -t arm64-v8a -o bindings/luciola-kmp/src/androidMain/jniLibs build --release -p luciola-uniffi
          cd examples/android-demo
          ./gradlew :luciola:publishAndroidPublicationToMavenLocal \
            :luciola:publishJvmPublicationToMavenLocal \
            :luciola:publishKotlinMultiplatformPublicationToMavenLocal --no-daemon -q
          cd "$GITHUB_WORKSPACE"
          VERSION=$(grep -m1 '^version = ' luciola-src/bindings/luciola-kmp/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "luciola 版本: $VERSION"
          test -n "$VERSION" || { echo "没解析到版本号"; exit 1; }
          AAR="$HOME/.m2/repository/io/github/kexuejin/luciola-android/$VERSION/luciola-android-$VERSION.aar"
          test -f "$AAR" || { echo "publish 未产出 $AAR"; exit 1; }
          unzip -l "$AAR" | grep -q "jni/arm64-v8a/libluciola_uniffi.so" || { echo "AAR 未内嵌引擎 .so：$AAR"; exit 1; }
          echo "OK: AAR 含引擎（$VERSION）"

      # 同一份源码出 host linux .so：TENON_LUCIOLA_NATIVE 指过去，
      # :core:jvmTest 的 8 个真引擎用例在 CI 上真跑（不是跳过）。
      # resolver（core/build.gradle.kts）对目录本身查 libluciola_uniffi.so ——
      # cargo 的 release 产物就在这个目录，不用再中转。
      - name: 构建 linux 引擎库（:core 真引擎用例用）
        run: cargo build --release -p luciola-uniffi
        working-directory: luciola-src

      # 截图门禁在 Linux 上渲染预览，界面里全是中文。
      # 没有 CJK 字体时 Layoutlib 画出来的是豆腐块，参考图必然对不上 ——
      # 那不是"界面改错了"，是环境缺字体，得在这里补上，别让它变成一条假红。
      - name: 装 CJK 字体（截图门禁要渲染中文）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      # 逐屏调色板对账读的是仓库里的参考图，不需要编译，所以它不是 Gradle 任务。
      # 依赖只有 ImageMagick 的 magick；ubuntu-latest 一般自带，显式装一次免得靠运气。
      - name: 装 ImageMagick（调色板对账要用 magick）
        run: sudo apt-get install -y imagemagick

      # compileSdk 37 的平台件：runner 镜像的预装清单更新滞后于 SDK 发布，
      # 缺了它 :androidApp:checkDebugAarMetadata / 编译就是一条环境假红。
      # 幂等：已装则 no-op。markdown-renderer 0.42+ 的 AAR 硬要求 minCompileSdk=37。
      - name: 装 Android SDK Platform 37（compileSdk 37 编译要用）
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: 门禁任务链（七条 + 设计契约三条）
        env:
          # 放行 settings.gradle.kts 的 -local 守卫 + 把 mavenLocal 提到最前
          #（上面已 publish 出 0.11.0-local.1 的全套产物）。
          LUCIOLA_LOCAL: "1"
          # :core:jvmTest 的 8 个真引擎用例用这颗 linux .so（同源构建，
          # UniFFI checksums 与 bindings 必然一致；LuciolaNativeGuard 显式
          # 配了却没有库时会响亮失败，不会伪装成跳过）。
          TENON_LUCIOLA_NATIVE: ${{ github.workspace }}/luciola-src/target/release
        run: |
          chmod +x ./gradlew
          # --no-build-cache：判"干净"就不能吃缓存（README「质量门禁与验证」有说明）。
          # 这里不写 --rerun-tasks：CI 每次都是全新检出，本来就没有增量状态，
          # 加它只是让同样的活重跑一遍。
          # --max-workers=1：八个模块的测试 JVM 并行时，异步用例会互相饿死 —— 实测每轮都有
          # 1-2 条「单跑恒绿、全量必红」的红（旋转在 UdpTransportBroadcast / GroupText /
          # TransferPeerCancel / FileMessageStore 之间），串行跑一次 3m45s 全绿。
          ./gradlew \
            :core:jvmTest \
            :app:jvmTest \
            :cli:test \
            :agent-contract:test \
            :orchestration:test \
            :composeApp:jvmTest \
            :composeApp:testAndroidHostTest \
            :agentNode:test \
            :desktopApp:test \
            :cjkLiteralGate \
            :constructionTraceGate \
            :staleCommentRefGate \
            :domainComposeFreeGate \
            :commonJvmApiGate \
            :envDependentTestGate \
            :designSpecDrift \
            :designTokenUsageGate \
            :designStateSlotGate \
            :designLocaleParityGate \
            :jlinkModulesGate \
            --no-build-cache \
            --max-workers=1 \
            --console=plain \
            --stacktrace

      # 截图门禁只保证"参考图和当前渲染一致"，不保证"参考图里是一屏对颜色"。
      # 这条补上后者：参考图里占比超过 0.5% 的每个色值都得说得出出处。
      - name: 逐屏调色板对账
        run: python3 tools/check-design-palette.py --strict

      # 上面那条只判「画出来的像素是不是这套色板」。CSS 里 `var(--x)` 指向一个
      # 没定义过的变量时，浏览器整条属性作废、页面照常渲染 —— 没画出来的颜色
      # 一个像素都不会进直方图。2026-11-06 实测原型有 4 个死变量共 9 处消费
      # （文件卡背景、输入区芯片边框、工作区横条分隔线、弹窗小字），以及深色
      # 主题漏覆盖的 :root 颜色变量，都只能从 CSS 文本层判。
      - name: 原型稿 · CSS 变量语义（死引用 / 深色漏覆盖）
        run: python3 tools/check-design-palette.py --css-vars

      # Kotlin 编译器不为未使用的 import 报警告（只有 IDE 灰掉），所以搬运/拆分
      # 留下的死 import 没有任何门禁看得见 —— 本仓真积过 711 条。这条补上。
      - name: 未使用的 import
        run: python3 tools/unused-imports.py --check

      # ── 原型稿自己的门禁（2026-10-15 接入）──────────────────────────────
      # 之前这四个工具只有「人记得跑」这一种执行方式。后果实测过：对比度曾在
      # 10-09 收口到 0（prototype/README.md §12.3），10-14 的一次编辑把它带回 20 处，
      # 没有任何东西变红 —— 因为验收图集也停在 10-13，没人再看第二眼。
      # 详见 docs/plans/2026-10-15-relay-prototype-review.md。
      - name: 原型稿 · 静态渲染体检（72 屏渲染函数 / symbol 与 class 引用完整性）
        run: node prototype/check-render.mjs

      - name: 原型稿 · 验收图集不许落后于稿子（manifest 过期检查）
        # 挡的是 P0-3 那一类：改了 relay.html 却没重拍，于是「逐张人眼验收」
        # 描述的是过去某一版稿子。纯文本+哈希，不需要浏览器。
        run: python3 prototype/shoot-relay.py --verify-only

      - name: 原型稿 · 锚点核对（稿子里的 Foo.kt:NNN 还指得准吗）
        # 这些锚点是「设计决策 → 代码证据」的链条，漂了就等于证据链断掉。
        # continue-on-error 是**临时的**：现存 53 处漂移是代码侧在途改动欠的账
        # （不是本步引入），逐条修完后删掉这一行，让它变成硬门禁。
        continue-on-error: true
        run: python3 prototype/check-refs.py

      - name: 失败时留下报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            */build/reports/tests/**
            */build/test-results/**
            androidApp/build/reports/screenshotTest/**
            build/reports/problems/**
