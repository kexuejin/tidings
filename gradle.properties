org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true

# Compose Preview Screenshot Testing. The source set is behind this flag, and
# the rendered references are committed: `./gradlew :androidApp:validateDebugScreenshotTest`
# renders the @PreviewTest composables on the host JVM - no device, no emulator -
# and compares them with `androidApp/src/screenshotTestDebug/reference/`.
android.experimental.enableScreenshotTest=true
android.compose.screenshot.maxHeapSize=4g
compose.desktop.packaging.checkJdkVendor=false
relayMirror=aliyun
android.sync.suppressAgpWarnings=GENERIC,UNSUPPORTED_PROJECT_OPTION_USE
