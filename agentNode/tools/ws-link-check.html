<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>捎话跨网链路自检</title>
<style>
  :root {
    --bg: #12100e; --card: #1c1a17; --line: #302b26; --fg: #ece6dd; --dim: #a1968a;
    --ok: #6fbf73; --bad: #e2685f; --wait: #d9a441;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f3ee; --card:#fffdf9; --line:#e2dbd1; --fg:#211d18; --dim:#6d6357; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 48px; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
  }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--dim); margin: 10px 0 4px; }
  input {
    width: 100%; padding: 10px 11px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); font: 14px/1.4 ui-monospace, Menlo, monospace;
  }
  button {
    width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 10px;
    background: #b4643c; color: #fff; font-size: 16px; font-weight: 600;
  }
  button:disabled { opacity: .55; }
  .step { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .step:first-of-type { border-top: 0; }
  .ico { flex: 0 0 18px; text-align: center; font-weight: 700; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .wait { color: var(--wait); }
  .body { color: var(--dim); font-size: 12.5px; margin-top: 3px; word-break: break-all; }
  .frames { margin: 0; padding: 0; list-style: none; font: 12px/1.5 ui-monospace, Menlo, monospace; }
  .frames li { padding: 5px 0; border-top: 1px dashed var(--line); }
  .frames li:first-child { border-top: 0; }
  .verdict { font-size: 15px; font-weight: 600; margin: 10px 0 0; }
  .hint { color: var(--dim); font-size: 12.5px; margin-top: 8px; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
</style>
</head>
<body>
<h1>捎话跨网链路自检</h1>
<div class="sub">在手机关掉 Wi‑Fi（用 4G/5G）打开本页，逐段判定「手机 → 公网 → 隧道 → agentNode → 桌面端」断在哪一段。</div>

<div class="card">
  <label for="httpBase">控制面地址（HTTP，用来验证隧道与鉴权）</label>
  <input id="httpBase" placeholder="https://你的隧道域名/relay" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label for="wsUrl">数据报通路（WebSocket，日常聊天走它）</label>
  <input id="wsUrl" placeholder="wss://你的隧道域名/relay-ws/v1/dgram" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label for="token">agentNode token（可留空；留空只能验到「隧道通了」，填了才能验到桌面应答）</label>
  <input id="token" type="password" placeholder="留空即可先跑一遍" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="go">开始自检</button>
</div>

<div class="card">
  <div id="steps"></div>
</div>

<div class="card" id="framesCard" hidden>
  <div style="font-size:13px;color:var(--dim);margin-bottom:6px">收到的帧</div>
  <ul class="frames" id="frames"></ul>
</div>

<div class="card" id="verdictCard" hidden>
  <p class="verdict" id="verdict"></p>
  <p class="hint" id="hint"></p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const stepsEl = $("steps");
const lines = [];
function step(state, title, detail) {
  const mark = { ok: "✓", bad: "✕", wait: "…" }[state];
  const cls = state === "ok" ? "ok" : state === "bad" ? "bad" : "wait";
  const div = document.createElement("div");
  div.className = "step";
  div.innerHTML = `<span class="ico ${cls}">${mark}</span><span>${title}` +
    (detail ? `<div class="body">${String(detail).replace(/</g, "&lt;")}</div>` : "") + `</span>`;
  stepsEl.appendChild(div);
  stepsEl.scrollIntoView({ block: "nearest" });
}
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (crypto.getRandomValues(new Uint8Array(1))[0] & 15) >> (c === "x" ? 0 : 4);
    return (c === "x" ? r : ((r & 3) | 8)).toString(16);
  });
}
function headers() {
  const t = $("token").value.trim();
  return t ? { Authorization: "Bearer " + t } : {};
}
function verdict(cls, text, hint) {
  $("verdictCard").hidden = false;
  $("verdict").className = "verdict " + cls;
  $("verdict").textContent = text;
  $("hint").textContent = hint || "";
  $("verdictCard").scrollIntoView({ block: "nearest", behavior: "smooth" });
}

// 第 1 段：HTTP 控制面。401 + 「缺少或错误的 token」是 agentNode 自己回的，
// 说明 DNS / TLS / 边缘代理 / 隧道 路由全通，只差凭据。
async function checkHttp() {
  const base = $("httpBase").value.trim().replace(/\/+$/, "");
  step("wait", "① HTTP 控制面 …");
  let res, text;
  try {
    res = await fetch(base + "/v1/peers", { headers: headers(), cache: "no-store" });
    text = await res.text();
  } catch (e) {
    step("bad", "① HTTP 控制面", "连不上：" + e.message +
      (window.location.protocol.startsWith("http")
        ? "。本页不是从控制面同源加载的，浏览器会先用 CORS 挡掉跨源 fetch —— " +
          "这一条不算断链，看第 ② 步"
        : ""));
    return false;
  }
  if (res.ok) {
    let n = -1;
    try { n = (JSON.parse(text).peers || []).length; } catch (_) {}
    step("ok", "① HTTP 控制面", `HTTP ${res.status}，已鉴权，注册表里 ${n} 个节点`);
    return true;
  }
  if (res.status === 401) {
    step("ok", "① HTTP 控制面", `HTTP 401「${text.slice(0, 40).replace(/<[^>]*>/g, "")}」—— 这正是 agentNode 的回话，说明隧道全程已通，只差凭据`);
    return true;
  }
  step("bad", "① HTTP 控制面", `HTTP ${res.status}` + (text ? "：" + text.slice(0, 200) : ""));
  return false;
}

// 第 2 段：WebSocket 数据报通路。注意 WebSocket API 读不到升级响应，
// 所以状态只能靠 onopen/onerror 判断 —— 第 1 段已经把「隧道是否通」区分掉了。
function checkWs() {
  return new Promise((done) => {
    const url = $("wsUrl").value.trim();
    const token = $("token").value.trim();
    step("wait", "② WebSocket 升级 …");
    let ws;
    try {
      ws = new WebSocket(url, token ? ["bearer", token] : []);
    } catch (e) {
      step("bad", "② WebSocket 升级", e.message);
      done(false);
      return;
    }
    ws.binaryType = "arraybuffer";
    const timer = setTimeout(() => { try { ws.close(); } catch (_) {} }, 20000);
    ws.onerror = () => {
      clearTimeout(timer);
      step("bad", "② WebSocket 升级", "被拒绝或连不上（没填 token 时这是正常的：网关要凭据，见下方结论）");
      if (token) {
        verdict("bad", "隧道通了，但 WebSocket 被网关拒绝",
          "拒绝说明 agentNode 收到了这条连接 —— 隧道没问题。网页只能把 token 放进子协议" +
          "（WebSocket API 没有自定义请求头可用），请确认 token 本身没贴错。");
      } else {
        verdict("ok", "隧道通了，能验到的都验完了",
          "WebSocket 网关要凭据，所以没填 token 时只能验到这一段。" +
          "把 agentNode token 粘进上面再跑一次，才能验到桌面有没有应答。");
      }
      done(false);
    };
    ws.onclose = (ev) => {
      if (ev.code !== 1000) step("wait", "② 连接已关闭", "code " + ev.code);
    };
    ws.onopen = () => {
      step("ok", "② WebSocket 升级", "101 Switching Protocols，数据报通路已建立");
      const nodeId = uuid();
      step("wait", "③ 发 entry 并等桌面应答", "临时 nodeId " + nodeId.slice(0, 8));
      // UDP 报文是裸 UTF-8 JSON，没有长度前缀。tcpPort 必须在 1..65535，
      // 否则 Codec.validateProfile 不过，对端会在第一行静默丢弃、不回任何东西。
      // platform 同理：Codec 只认 Platforms.ALL = {win, mac, linux}，
      // 协议里没有"手机"这个值，手机端自己也是伪装成 linux 上报的（见 CodecTest 的断言）。
      const entry = {
        v: 1, type: "entry", id: uuid(), from: nodeId, ts: Date.now(),
        payload: { profile: {
          nodeId, nick: "链路自检", company: "", dept: "", team: "",
          avatar: -1, profileRev: 1, host: navigator.userAgent.slice(0, 40),
          platform: "linux", tcpPort: 17879, ver: "0.0.0-check", caps: []
        } }
      };
      const bytes = new TextEncoder().encode(JSON.stringify(entry));
      ws.send(bytes);
      step("ok", "③ 已发出 entry", bytes.length + " 字节（裸 JSON，无长度前缀）");

      let got = 0, up = 0;
      const seen = {};
      ws.onmessage = (ev) => {
        const b = new Uint8Array(ev.data);
        up += b.length; got++;
        let desc = b.length + " 字节";
        try {
          const f = JSON.parse(new TextDecoder().decode(b));
          const p = f.payload || {};
          const who = (p.profile && p.profile.nick) || (p.peers && p.peers.length + " 个节点") || "";
          desc = `${f.type} ${f.from ? f.from.slice(0, 8) : ""} ${who}`;
          seen[f.type] = (seen[f.type] || 0) + 1;
        } catch (_) { desc += "（非 JSON）"; }
        const li = document.createElement("li");
        li.textContent = desc;
        $("frames").appendChild(li);
        $("framesCard").hidden = false;
      };
      // entry 的回复在 0..8 秒内随机抖动，等满 14 秒再下结论，
      // 否则会把「还没到」读成「不会来」。
      setTimeout(() => {
        clearTimeout(timer);
        try { ws.close(); } catch (_) {}
        const kinds = Object.keys(seen);
        if (kinds.length) {
          step("ok", "④ 桌面有回音", `收到 ${got} 条 / ${up} 字节：` + kinds.join("、"));
          verdict("ok", "全链路通：手机 → 公网 → 隧道 → agentNode → 桌面端",
            kinds.includes("alive") || kinds.includes("peers")
              ? "这条 4G 网络能直接够到你的桌面节点，日常聊天与文件传输都走这条路径。"
              : "收到了回音但不是节点应答，如果本机没跑桌面端属正常。");
        } else {
          step("bad", "④ 桌面没有回音", "14 秒内 0 字节下行");
          verdict("bad", "隧道通了，但桥到桌面那一段没通",
            "隧道已通（第 ① 步），请在跑 agentNode 的那台电脑上确认桌面端在运行、" +
            "且 UDP 17878 没被别的进程占着：lsof -nP -iUDP:17878");
        }
        done(got > 0);
      }, 14000);
    };
  });
}

$("go").addEventListener("click", async () => {
  $("go").disabled = true;
  stepsEl.innerHTML = "";
  $("frames").innerHTML = "";
  $("framesCard").hidden = true;
  $("verdictCard").hidden = true;
  const t0 = performance.now();
  const httpOk = await checkHttp();
  // HTTP 预检失败也要继续跑 WebSocket：控制面和网关是两个独立的入口，
  // 前者挂了后者照样可能通，停在第一步就下结论会误杀。
  const wsGot = await checkWs();
  const hintEl = $("hint");
  const baseHint = hintEl.textContent;
  if (wsGot) {
    hintEl.textContent = baseHint;
  } else if (httpOk) {
    hintEl.textContent = baseHint;
  } else {
    verdict("bad", "更早的那一段就断了",
      "连 HTTP 控制面都到不了，先别怀疑 WebSocket：查 DNS、4G 是否允许长连接、" +
      "以及隧道那侧的路由是否还在。");
  }
  const s = Math.round((performance.now() - t0) / 100) / 10;
  hintEl.textContent += `（本次耗时 ${s} 秒）`;
  $("go").disabled = false;
});
</script>
</body>
</html>
