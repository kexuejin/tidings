.phead .pn{font-size:16px;font-weight:700;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead .pm{font-size:12px;color:var(--on-2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead .pchips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
/* 头像编辑器：照源码 AvatarPicker（AvatarPalette.kt:110-212）同构。
   图标头像 = 20 动物 × 10 底色（编码 底色 × 20 + 图标 = 0–199）；昵称首字 = avatar −1，
   底色由昵称哈希分配、不可选。尺寸没动（色点 24、图标网格 10 列），
   动的是**顺序与对齐**：档位在最前（源码 `:115-135` 第一件事就是画档位），
   底色在动物之前（`:139-178` 先于 `:181-209`）；整块也不再居中 ——
   居中会让它跟上下全宽的输入框对不齐，看着像一块浮在中间。 */
.avedit-pick{width:100%;max-width:460px;margin:12px 0 0}
.avedit-lb{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--on-2);margin-bottom:7px}
.avedit-lb b{color:var(--on);font-weight:600}
.avedit-lb .nb{margin-left:auto;font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
/* 10 列固定，但每格封顶 44px —— 否则桌面那条 500px 宽的列里，色点 24 而图标 50，
   两组的重量差得离谱。手机上（361px）封顶值够不着，仍然是撑满的 10 列。 */
.avedit-grid{display:grid;grid-template-columns:repeat(10,minmax(0,44px));gap:6px;margin-bottom:12px;
  container-type:inline-size}
.avedit-ch{aspect-ratio:1;border:0;border-radius:50%;background:var(--c);padding:0;
  display:grid;place-items:center;font-size:clamp(14px,5cqw,22px);line-height:1;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.72);transition:transform .12s,box-shadow .12s}
.avedit-ch:hover{transform:scale(1.12)}
.avedit-ch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--primary),inset 0 0 0 1px rgba(255,255,255,.8)}
.avedit-cs{display:flex;flex-wrap:wrap;gap:8px}
.avedit-c{position:relative;width:24px;height:24px;border:2px solid var(--surface);padding:0;
  border-radius:50%;background:var(--c);cursor:pointer;
  box-shadow:0 0 0 1px var(--hair);transition:transform .12s,box-shadow .12s}
.avedit-c:hover{transform:scale(1.12)}
.avedit-c[aria-pressed="true"]{box-shadow:0 0 0 2px var(--primary)}
/* 选中点里的那个小圆点，颜色必须跟着**底色**走，不能写死白：
   10 个底色里有浅有深，白点压在杏黄 #C88A2D 上只有 2.74:1 —— 糊成一团。
   用渲染时写进来的 `--ink`（同 `avInk()`，与头像上的字色同一个函数）：
   浅底给深点、深底给白点，最差一档也过 3:1。这是对比度检查器查不到的 ——
   它只算文字，`::after` 这种纯图形不在射程内，所以手算了一遍才看见。 */
.avedit-c[aria-pressed="true"]::after{content:"";position:absolute;inset:0;margin:auto;
  width:8px;height:8px;border-radius:50%;background:var(--ink,#fff)}
/* 「昵称首字」这一档的自解释条。原来这一档下面什么都不画（`avPicker` 直接返回空串），
   整块留白，只剩一句 12px 的说明 —— 三档里它看着最像坏了。现在三档都有内容：
   图标档给两组选择器、上传档给上传区、首字档给这一条「它会是什么样 + 为什么不能选」。 */
.avmode{display:flex;align-items:center;gap:12px;padding:11px 12px;
  background:var(--surface-2);border-radius:12px;margin-top:12px}
.avmode-pv{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-weight:600;line-height:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.avmode-bd{flex:1;min-width:0}
.avmode-bd .t1{font-size:14px;font-weight:600}
.avmode-bd .t2{font-size:11px;color:var(--on-2);margin-top:3px;line-height:1.45}
.avmode-bd .t2 b{color:var(--on);font-weight:600}
/* ── 自定义头像（上传本地图片）这一档：
      上传本地图片并裁剪，图片只会在局域网内按需同步。本稿的头像区没有真图可放，
      预览位用一个渐变色块 + 山形 SVG 顶替「已选的那张图」——
      要看的是它背后的**约束与落盘**，不是这张图长什么样。 ── */
.av-ph{border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(140deg,#9DB4C9 0%,#5E86AC 48%,#3D8B6B 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.av-ph svg{stroke:#fff;fill:none;stroke-width:1.7;stroke-linejoin:round}
.avup{width:100%;max-width:460px;margin:12px 0 0;display:flex;flex-direction:column;
  gap:9px}
/* 允许换行：文件名 + 两条约束 + 两颗按钮在 361px 手机上横不下 ——
   `.avup-bd` 给一个 150px 的下限（否则 flex 会先把它压成一条线、按钮永不换行），
   横向真的放不下时两颗粒按钮整组落到第二行、靠右，而不是把文件名截成「team-photo…」。 */
.avup-pick{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;
  background:var(--surface-2);border:1px dashed var(--outline);border-radius:12px;flex-wrap:wrap}
.avup-pv{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;
  overflow:hidden;
  background:linear-gradient(140deg,#9DB4C9 0%,#5E86AC 48%,#3D8B6B 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.avup-pv svg{stroke:#fff;fill:none;stroke-width:1.7;stroke-linejoin:round}
.avup-bd{flex:1 1 150px;min-width:150px}
.avup-bd .t1{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avup-bd .t2{font-size:11px;color:var(--on-2);margin-top:2px;line-height:1.45}
.avup-acts{flex:none;display:flex;gap:6px;margin-left:auto}
.avup-acts .btn{flex:none;padding:6px 9px;font-size:11px}
.avup-acts .btn svg{width:14px;height:14px}
.avup-rule{font-size:11px;line-height:1.6;color:var(--on-2)}
.avup-rule b{color:var(--on);font-weight:600}
/* 「上传头像」那四条步骤。序号圆点 + 图标是**一条线上的四段**读法：
   有 1 2 3 4 就能顺着往下读，换四个并列的卡片一眼会读成四个同权重的功能。 */
.avstep{display:flex;align-items:flex-start;gap:11px;padding:11px 2px 12px}
.avstep+.avstep{border-top:1px solid var(--hair)}
.asn{width:19px;height:19px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--primary-c);color:var(--on-primary-c);font-size:11px;font-weight:700;margin-top:2px}
.asi{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--surface-2);margin-top:1px}
.asi svg{width:16px;height:16px;color:var(--on-2)}
.asb{flex:1;min-width:0}
.asb .t1{font-size:14px;font-weight:600}
.asb .t2{font-size:11px;color:var(--on-2);line-height:1.5;margin-top:3px}
/* 「去哪儿」的行：整行可点，右侧一个 chevron，不是一个动作按钮 */
.navrow{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);
  border-radius:var(--r-card);box-shadow:var(--shadow);cursor:pointer;margin-bottom:12px}
/* 设置首页那条资料入口。源码给它的是 surfaceVariant 底（SettingsScreen.kt:264-269），
   跟下面几组白底 setlist 分开 —— 它是「我是谁」，不是「一组配置」。 */
.navrow.tint{background:var(--surface-2);box-shadow:none}
.navrow .val.pri{color:var(--primary);font-weight:600}
.navrow .ni2{width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:var(--primary-c);color:var(--on-primary-c)}
.navrow .ni2 svg{width:18px;height:18px}
.navrow .bv{flex:1;min-width:0}
.navrow .bv .t1{font-size:14px;font-weight:600}
.navrow .bv .t2{font-size:12px;color:var(--on-2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navrow .chev{flex:none;color:var(--on-2);opacity:.55}
.navrow .chev svg{width:18px;height:18px}
/* 右侧的**当前值**。设置首页靠它把"点进去之前就能看到现在是什么"这件事做到位，
   只有一个「>」的菜单页做不到 —— 那只是把首页当目录，用户还是得挨个点。 */
.navrow .val{flex:none;font-size:12px;color:var(--on-2);max-width:146px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 设置首页的分组列表：整组一张卡，行与行之间一条发丝线，末行不画。 */
.setlist{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:12px}
.setlist .navrow{margin:0;border-radius:0;box-shadow:none;background:none;
  border-bottom:1px solid var(--hair)}
.setlist .navrow:last-child{border-bottom:0}
/* 资料行用真头像，不用 .ni2 那个图标方块：这一行的主角是"我是谁"。 */
.navrow .navav{width:44px;height:44px;font-size:16px;border-radius:12px;flex:none;position:relative;
  display:grid;place-items:center;color:#fff;font-weight:600}

/* 副标题太长、右侧还要放控件时，把控件换到下一行右对齐（续传残片那种行） */
.row.blk{flex-wrap:wrap;cursor:default}
.row.blk .bd{flex:1 1 100%}
.row.blk .t2{white-space:normal;overflow:visible}
.row.blk .ract{flex:1 1 100%;display:flex;gap:8px;align-items:center;
  justify-content:flex-end;margin-top:8px}

/* ====================== 9. 覆盖层（sheet / 对话框 / 长按菜单） ====================== */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(8,12,10,.42)}
.sheet{position:absolute;inset:auto 0 0 0;z-index:21;background:var(--surface);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.28);
  padding:8px 0 calc(var(--inset-b) + 10px);max-height:88%;display:flex;flex-direction:column}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--outline);margin:0 auto 6px}
.sheet .sh-head{padding:6px 16px 10px;display:flex;align-items:center;gap:10px}
.sheet .sh-head h2{font-size:16px;font-weight:700;flex:1}
.sheet .sh-body{overflow-y:auto;min-height:0;padding:0 16px}
/* 会话切换（sessionPickerHTML，逐字对齐 AgentSessionPickerDialog，AgentConsoleScreen.kt:621-705）。
   三件照源码、不照好看的事：
   ① 它是 **AlertDialog**（居中对话框），不是贴底 sheet —— 源码 `:629 AlertDialog(...)`，
      `confirmButton` 只有一颗 `common_close`「关闭」（`:662-664`）。所以这里复用
      `.dialog/.dlg` 那套骨架（与 GroupCreateDialog 同一形状），遮罩直接画在 .dialog 上：
      它是「铺满并居中」的容器，不像 .scrim 需要一个兄弟节点配 z-index。
   ② 勾在**行首**（`:649-656`，`Row` 的第一个孩子就是 Check 图标，且**只有当前会话画**——
      源码没有给非当前项留位，所以未选中项会左对齐、选中项缩进 8+18dp。这是照着画的，不是漏了）。
   ③ 每一行**只有两样东西：会话名 + 右侧状态**。「看一个 workspace 下挂了哪些线程」
      只需要名字够定位、状态够判断要不要切过去 —— 多一个字都是噪音。所以源码
      `AgentSessionOption`（`:670-705`）里的 `title` 与「N 条事件」**不进这一屏**
      （`title` 留在数据里、以 `title=""` 悬停提示兜住）；唯一的例外是
      `announced=false`（只收到事件、没收到会话宣告）—— 那是**坏状态**不是冗余信息，
      仍然补一行红字。状态是 `SessionStateLabel` 那种**按状态取色的小字**，不是 chip（`:551-562`）。
   默认隐藏（.pickz），openSessionPicker 加 .on 显出。 */
.dialog.pickz{display:none;background:rgba(8,12,10,.42)}
.dialog.pickz.on{display:grid}
/* 勾在**行首**、只标当前项（`:649-656`）。与源码的唯一偏离：源码只给当前项画勾、
   未选中项因此左移 8+18dp；这一版每行都占住那 18px（空的画不出来），让**名字左对齐** ——
   列表形态下名字不齐比多一格缩进更刺眼，而「哪条是当前项」已经由背景高亮 + 勾双重标示。
   这条偏离写进 README §10.10 五。 */
/* 一条 = pickrow + 可选的坏状态红字（红字属于这一条，不该被 .dbody 的 gap 甩开）。 */
.pickwrap{display:flex;flex-direction:column;gap:1px}
.pickrow{display:flex;gap:8px;align-items:center;padding:8px 4px;border-radius:12px;cursor:pointer}
.pickrow:hover{background:var(--surface-2)}
.pickrow[aria-current="true"]{background:var(--surface-2)}
.pickrow .ck{flex:none;width:18px;color:var(--primary);display:grid;place-items:center}
.pickrow .ck svg{width:18px;height:18px}
/* 名字占满、状态被推到行尾（「右侧的状态」）：名字长了走省略号，不换行、不撑高。 */
.pickrow .al{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1;min-width:0}
/* 红字起点对齐名字（4px padding + 18px 勾位 + 8px gap = 30px）。 */
.pickwrap .ms{font-size:11px;color:var(--on-error-c);padding:0 4px 0 30px}
/* SessionStateLabel：小字 + 按状态取色，不是 chip。 */
.stl{font-size:12px;flex:none}
/* 建群对话框（GroupCreateDialog）：名字 + 成员勾选 */
.dialog{position:absolute;inset:0;z-index:22;display:grid;place-items:center;padding:24px}
.dlg{width:100%;max-width:345px;background:var(--surface);border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);padding:16px 16px 12px;display:flex;flex-direction:column;
  max-height:90%}
.dlg h2{font-size:16px;font-weight:700;margin-bottom:14px}
/* 对话框的内边距**只有 .dlg 这一层**（20px）。
   `.dbody` 是个**通用**类，默认带的是桌面窗口体那一套 `padding:14px 16px 16px`（`:716`，
   本意是给 `.win .dbody` 的）—— 落在对话框里就成了第二层内边距，与 .dlg 叠成 **38px** 死区：
   340px 宽的框里只剩 264px 放内容，两边各吃掉 11%。实测（393×852）：
   `.field` / `.mem` 的左边缘在框内 38px 处，`.mem .cb` 更是到 42px。
   这里清掉，内容内缩回到 20px —— 与 M3 `AlertDialog` 的 24dp 内容内边距同档。 */
.dlg .dbody{overflow-y:auto;min-height:0;padding:0}
/* 建群对话框（`.dlg.gc`）里 `.dbody` 那 13px 的 flex gap 也一并清掉：源码那个
   `Column`（`GroupCreateDialog.kt:82`）**没有 gap** —— 间距全写在子元素自己的
   `Modifier.padding` 上：`GroupCreateDialog.kt:94`（top = 12.dp, bottom = 4.dp）与
   `GroupCreateDialog.kt:112`（vertical = 4.dp）。原型这边对应的是 `.field` 的
   margin-bottom:12px 与 `.avedit-lb` 的 margin-bottom:4px —— 再留着 gap 就是**两份都算**，
   框到「选成员」那一行的间距成了 12 + 13 = 25px，比源码宽一倍。
   只给建群挂 `.gc`：会话选择器（`.pickz`）是**拿 gap 当行间距**的，那里不能动。 */
.dlg.gc .dbody{gap:0}
.dlg .acts{display:flex;justify-content:flex-end;gap:6px;padding-top:10px}
.dlg .mem{display:flex;align-items:center;gap:10px;padding:8px 4px;cursor:pointer;
  border-radius:12px}
.dlg .mem:hover{background:var(--surface-2)}
.dlg .mem .cb{width:20px;height:20px;border-radius:5px;border:2px solid var(--outline);flex:none;
  display:grid;place-items:center;color:transparent}
.dlg .mem[aria-checked="true"] .cb{background:var(--primary);border-color:var(--primary);color:#fff}
.dlg .mem .cb svg{width:13px;height:13px;stroke-width:3}
.dlg .mem .bd{flex:1;min-width:0}
.dlg .mem .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg .mem .st2{font-size:11px;color:var(--on-2);margin-top:1px}
/* 长按消息菜单（撤回 / 戳一碰）。协议只定义了这两条消息级动作，所以菜单里只有真有的项。 */
.menu{position:absolute;z-index:24;min-width:150px;background:var(--surface);border-radius:12px;
  box-shadow:var(--shadow-pop),0 0 0 1px var(--hair);padding:5px}
.menu .mi2{display:flex;gap:9px;align-items:center;padding:9px 11px;border-radius:8px;
  font-size:14px;cursor:pointer;white-space:nowrap}
.menu .mi2:hover{background:var(--surface-2)}
.menu .mi2 svg{width:16px;height:16px;color:var(--on-2)}
.menu .mi2.danger{color:var(--on-error-c)}
/* 菜单项右侧的撤回倒计时（recall.ts:6-13：剩余 ≤10 秒转红）。 */
.menu .mi2 .rl{margin-left:auto;font-size:11px;color:var(--on-2);font-variant-numeric:tabular-nums}
.menu .mi2.warn .rl{color:var(--on-error-c);font-weight:600}
.menu .mi2.danger svg{color:var(--on-error-c)}
.menu .mi2.dis{color:var(--on-2);opacity:.55;cursor:default}
.menu .mi2.dis:hover{background:transparent}
.menu .thr{height:1px;background:var(--hair);margin:4px 8px}

/* ====================== 10. 画廊与大字模式 ====================== */
.gallery{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;justify-content:center;max-width:2200px}
.gcell{display:grid;gap:8px;justify-items:center}
.gcell .lbl{font-size:12px;color:var(--on-2);letter-spacing:.03em;text-align:center}
body.font-lg .device{--status:52px;--nav-h:66px}
body.font-lg .device .topbar h1{font-size:31px}
body.font-lg .device .row .t1{font-size:16px}
body.font-lg .device .row .t2{font-size:16px}
body.font-lg .device .row .t3{font-size:14px}
body.font-lg .device .bub{font-size:16px}
body.font-lg .device .kv{font-size:16px}
body.font-lg .device .card>h3{font-size:14px}
body.font-lg .device .grphead{font-size:14px}
body.font-lg .device .inp,body.font-lg .device .btn{font-size:16px}
body.font-lg .device .banner{font-size:14px}
body.font-lg .device .hint{font-size:14px}
body.font-lg .device .nav .ni,body.font-lg .device .railnav .ri{font-size:14px}
body.font-lg .device .seg button{font-size:14px}
body.font-lg .device .field label{font-size:14px}
body.font-lg .device .row .tm{font-size:14px}
body.font-lg .device .composer textarea{font-size:16px}
body.font-lg .device .evt{font-size:14px}
body.font-lg .device .filecard .fn{font-size:14px}
body.font-lg .device .filecard .fs{font-size:14px}

/* 文件详情头部与工具栏。DesktopFilesPane 里头部是**一行**（36dp 图标 + 名 + 副标题 +
   右侧状态 chip），工具栏紧跟在它下面 —— 都不是卡片。原 KDoc 写明了不画「校验」卡
   （FileCardUi 没有摘要字段），所以这里不能出现 SHA-256 / 摘要 / 另存为。 */
.fdh{display:flex;align-items:center;gap:12px;padding:0 0 12px}
.fdh .fico{width:36px;height:36px;border-radius:12px;flex:none;display:flex;
  align-items:center;justify-content:center;background:var(--primary-c);color:var(--on-primary-c)}
.fdh .fico svg{width:18px;height:18px}
.fdh .fmeta{flex:1;min-width:0}
.fdh .fmeta .fn{font-size:14px;font-weight:600;color:var(--on);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.fdh .fmeta .fs{font-size:11px;color:var(--on-2);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.fdh .chip{flex:none}
.fbar{display:flex;gap:8px;padding:0 0 13px;flex-wrap:wrap}
/* 传输记录（桌面设置窗）。这一页**没有列头** —— 行就是「图标 + 两行 + 一个打开按钮」，
   所以这里连 thead 都不画，用 ul 平铺。 */
.tlist{list-style:none;padding:0;margin:0}
.tlist li{display:flex;gap:10px;align-items:center;padding:9px 11px;min-height:52px}
.tlist li+.li,.tlist li+li{border-top:1px solid var(--hair)}
.tlist .fi2{width:30px;height:30px;border-radius:8px;background:var(--surface-3);color:var(--on-2);
  display:grid;place-items:center;flex:none}
.tlist .fi2 svg{width:16px;height:16px}
.tlist .bd{flex:1;min-width:0}
.tlist .t1{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist .t2{font-size:11px;color:var(--on-2);margin-top:1px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.sidehead .act{margin-left:auto}
.sidehead .act+.cnt{margin-left:8px}
/* 原生型注释：纸质稿上「为什么长这样」的话不该混进 UI 里假装是控件，
   所以统一收进块尾这种带竖线的注解块。 */
.annot{border-left:2px solid var(--outline);padding:1px 0 1px 10px;font-size:11px;
  color:var(--on-2);line-height:1.65}
.annot b{color:var(--on);font-weight:600}
.annot .mono{font-size:11px}
/* 注解里的代码引用（文件:行号）。**必须用 <code> 而不是 markdown 反引号** ——
   这些注解整段活在一个模板字符串里，一个裸反引号就会把模板提前闭合，
   整段脚本解析失败、页面只剩外壳（2026-10-07 踩过一次）。 */
.annot code,.hint code,.msg code{font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);
  font-size:11px;padding:1px 4px;border-radius:4px;background:var(--surface-2);color:var(--on);
  /* 长文件引用（ConversationsScreen.kt:219-220）在窄容器里没有断点，
     不强制断行就会把菜单/卡片撑破。 */
  overflow-wrap:anywhere;word-break:break-word}
.panehead{flex:none;display:flex;align-items:center;gap:8px;padding:11px 14px 0}
.panehead .t{font-size:14px;font-weight:600;color:var(--on);letter-spacing:.02em}
/* 设置窗左栏的分组小标题，以及「本稿没画桌面详情」的灰行。
   灰行不是禁用态，是"这一页在 code 里直接复用共享 SettingsScreen"，所以没有第二份可画。 */
.dsg{display:flex;align-items:center;gap:6px;padding:11px 6px 4px;font-size:11px;font-weight:600;
  letter-spacing:.06em;color:var(--on-2)}
.dsg .nt{margin-left:auto;font-weight:500;letter-spacing:0;opacity:.7}
.li.ghost{cursor:default}
.li.ghost .t1{font-weight:500;color:var(--on-2)}
.li .lm{flex:none;font-size:11px;color:var(--on-2);opacity:.7}
/* 设置窗的左栏排得比会话列表密：9 行 + 4 个分组标题要塞进 560px 的窗高，
   否则「这台电脑」那一组会被推到视口外，看的人会以为这组不存在。 */
.winset .li{min-height:40px;padding:5px 8px;gap:8px}
.winset .li .fi2{width:26px;height:26px;border-radius:8px}
.winset .li .fi2 svg{width:15px;height:15px}
.winset .li .t1{font-size:12px}
.winset .dsg{padding:9px 6px 3px}

</style>

<script>
const ic = n => `<svg><use href="#i-${n}"/></svg>`;

/* ============================ 数据 ============================
   与 Compose 的模型一一对应：
     PEERS  → PeerUi        （人类同事与 agent 共用，isAgent 区分）
     GROUPS → GroupMeta     （groupId / name / members / rev / ownerId / adminIds / …）
     CONVS  → ConversationUi（convId：私聊 = nodeId，群聊 = `group:<groupId>`）
     MSGS   → MessageUi     （notice 非空 = 系统提示行，不画气泡）
   一个刻意的修正：**群会话的列表预览就是消息原文**，不加「Huang：」这样的发送者前缀
   —— `RelayUiState.kt:665` 的 `preview = last?.let { it.text.ifBlank { it.file?.name } }`
   就是原文，旧稿那个前缀是自造的。 */
const ME = {nodeId:'a3f9c21e', nick:'我的手机', company:'示例科技', dept:'平台组', team:'交付', profileRev:3};

/* 节点 ID 是 8 位十六进制（agent 节点的 id 派生于本机随机种子，不是主机名）。
   下面这份别名只是让屏函数好写、好读；渲染出来的永远是真实形态的 ID，
   所以截图里的「节点 ID」栏和真机是同一个形状。 */
const NID = {agent:'7c3e91b5', codex:'b07f4c2d', ka:'4b8d02f6', lin:'e19a7c40', huang:'2f6b83da',
             build:'9d40e5b7', old:'c58f1a03', legacy:'a4c07d19'};
/* 节点 ID 在协议里是 16 字节，界面上按 UUID 形态展示。下面由 8 位短 id
   派生出一串稳定的展示用 UUID（同一个 id 永远得到同一串，不会每次刷新都变）。 */
function uuidOf(id){
  let x = 0;
  for (const ch of String(id)) x = (x * 31 + ch.charCodeAt(0)) >>> 0;
  const h = n => (n >>> 0).toString(16).padStart(8, '0');
  const a = h(x), b = h(Math.imul(x, 2654435761)), c = h(x ^ 0x9e3779b9);
  return `${id}-${a.slice(0,4)}-4${b.slice(0,3)}-a${c.slice(0,3)}-${a.slice(4)}${b.slice(4)}${c.slice(4)}`;
}

/* ============================ 节点（= 设备，协议 D6）============================
   2026-10-13 用户裁决（协议 D6）：**节点就是设备** —— 一个 `nodeId` 就是一台设备的
   节点身份。所以设备不再需要自己的键：`deviceId`（D5）整条撤回，本文件里已经删掉，
   「agent node」这个词也一并废弃。

   一个节点上可以有**多个转发的 agent**，agent 的身份键 = `agentId ?? agentKind`：
   `agentId` 是**可选**键（≤64 UTF-8 字节，宿主内唯一），缺了就退回 `agentKind`，
   两者都缺就显示「未上报类型」—— **不猜**，也绝不把 `ag1` / `tw1` 这类 wire 键当产品名。

   `agentKind` 是 agent 宿主/驱动的**类型**（`DSH` / `opencode` / `codex`…），开放取值，
   **不是模型名**。工作区键 = `(nodeId, agentId ?? agentKind, wsId)`；
   会话键 = `(nodeId, sessionId)`，`agentId` / `agentKind` 是它的属性。

   备注 `remark` 与「打开聊天」是 **per-nodeId（= 每台设备/节点）** 的东西 —— 所以它们
   留在**节点行与节点详情**上；**Agent 行不承载备注、也不给「发消息」**。
   设备显示名 = `remark ?? nick`：不再借 Agent 的昵称来当设备名。

   ⚠️ 归组只认 `nodeId` 与 `agentId ?? agentKind`：绝不用 hostName / 平台 / IP 猜同机 ——
   `relay-agent` 这个名字下可以有好几台设备，同一台设备上也可以有好几个 agent。 */

/* 节点视图的全部取数逻辑就在下面几行。节点 = `nodeId`（协议 D6），
   agent 的键 = `agentId ?? agentKind`（缺失即退化，不猜）。 */
const hasAg1 = p => /(^|[\s·])ag1([\s·]|$)/.test(p.cap || '');
/* agent 的身份键。两个键都缺时键是空串，屏上统一换成「未上报类型」。 */
const UNKNOWN_KIND = '未上报类型';
const agentKeyOf = s => s.agentId || s.agentKind || '';
const kindKeyOf = s => agentKeyOf(s) || UNKNOWN_KIND;
/* 一个节点上有哪些 agent：协议里**没有** agent 档案帧，只能从它上报的工作区与
   **未归属会话**里派生（`agent-workspace` / `agent-session` 带的 agentId/agentKind），
   去重后按上报顺序排。声明了 `ag1` 却一条帧都没有 —— 只画一个「未上报类型」。 */
function agentsOfNode(nodeId){
  const p = peerOf(nodeId);
  const out = [];
  const note = s => {
    const k = kindKeyOf(s);
    if (!out.some(a => a.key === k))
      out.push({nodeId, key:k, agentId:s.agentId || '', agentKind:s.agentKind || ''});
  };
  if (hasAg1(p)){
    for (const w of WORKSPACES) if (w.agentNodeId === nodeId) note(w);
    for (const s of (p.unassigned || [])) note(s);
    if (!out.length) out.push({nodeId, key:UNKNOWN_KIND, agentId:'', agentKind:''});
  }
  return out;
}
/* 节点 = 一台设备 = 一行。没有 `deviceId` 可分组了：`nodeId` 本身就是分组键，
   所以「主 Agent」也不存在了 —— 名字、平台、头像全取自这台设备自己。 */
function nodeGroups(){
  return PEERS.map(p => {
    const agents = agentsOfNode(p.nodeId);
    return {k:p.nodeId, node:p, prim:p, agents,
            name:p.remark || p.nick, plat:p.plat, hostName:p.hostName,
            online:!!p.online, never:!!p.never,
            lastSeen: p.lastSeen === 0 ? '刚刚' : (p.lastSeen || '—'),
            agentCount: agents.length,
            wss: WORKSPACES.filter(w => w.agentNodeId === p.nodeId)};
  });
}
const nodeRank = g => g.never ? 2 : (g.online ? 0 : 1);
const allNodes = () => nodeGroups().sort((a, b) =>
  nodeRank(a) - nodeRank(b) || a.name.localeCompare(b.name));
const nodeGroupOf = id => nodeGroups().find(g => g.k === id) || null;
/* 一个 agent 的工作区（`agent-workspace` 帧宣告的）与**未归属会话**（`agent-session`
   省略 `wsId`）—— 两件事，见设计稿 §2.5。未归属会话合法且一等，挂在 agent 下，
   **不**造一张空工作区卡来兜它。取数键一律是 `(nodeId, agentId ?? agentKind)`。 */
const wssOfAgent = (nodeId, key) => WORKSPACES.filter(w =>
  w.agentNodeId === nodeId && kindKeyOf(w) === key);
const unassignedOf = (nodeId, key) => (peerOf(nodeId).unassigned || []).filter(s =>
  kindKeyOf(s) === key);
const sessionsOfAgent = (nodeId, key) => wssOfAgent(nodeId, key).flatMap(w => w.sessions)
  .concat(unassignedOf(nodeId, key));
/* 能力行：屏上印的是**产品词**，不是 wire 键（`ag1` / `tw1` 这类键永不当产品名，R2）。
   认不出的键不印 —— 宁缺勿假。 */
const CAP_WORDS = {ag1:'Agent', tw1:'传文件', fd1:'发文件夹', aws1:'工作区', ams1:'追加指令',
                   mrec1:'录制', pv1:'屏幕协助'};
function capWords(cap){
  const keys = String(cap || '').split(/[·,\s]+/).filter(k => k && k !== '—');
  const words = [...new Set(keys.map(k => CAP_WORDS[k]).filter(Boolean))];
  return words.length ? words.join(' · ') : '基础连接';
}

   busy/done 用 primary，error 用错误色，其余退次要前景。 */
const STATE_TONE = {idle:'var(--on-2)', busy:'var(--primary)', done:'var(--primary)',
                    error:'var(--on-error-c)'};
function stateLabelHTML(state){
  if (!state) return '';
  return `<span class="stl" style="color:${STATE_TONE[state]||'var(--on-2)'}">${SESSION_STATE[state]||state}</span>`;
}

    <div class="hd"><span class="tm">${e.at}</span><span class="ty">${e.eventType}</span><span class="cr">${e.cursor}</span></div>
    ${e.summary?`<div class="ttl">${e.summary}</div>`:''}

}

/* 审批**一条**（行，不是卡）= 源码 `AgentApprovalCards.kt:57` 的字段：
   `工具: {tool}`（titleSmall Bold / primary）+ 状态胶囊 / `summary`；
   按钮只在 `pending && !过期` 时画（`:118`），顺序 **`拒绝`(描边) → `批准`(实心)**。
   区别只有一处：源码按钮另起一行（`:120-135`），这里并到首行右端 —— 理由见 `.lst` 上面的注释。 */
function apprRowHTML(a){
  const st = a.status === 'approved' ? ['ok','已批准']
           : a.status === 'denied'   ? ['no','已拒绝']
           : a.expired               ? ['no','已过期'] : null;
  return `<div class="appr">
    <div class="bd">
      <div class="tl">工具: ${a.tool || '—'}</div>
      ${a.summary?`<div class="note">${a.summary}</div>`:''}
    </div>
    <div class="rt">${isPending(a)
      ? `<button class="btn sm out">拒绝</button><button class="btn sm pri">批准</button>`
      : (st?`<span class="apst ${st[0]}">${st[1]}</span>`:'')}</div>
  </div>`;
}
/* 整段一张卡、行间发丝线。空数组时**不画这一段**（源码 `if (approvals.isEmpty())` 同款判断）。 */
function apprSectionHTML(w, optSessionId){
  const rows = approvalsOf(w, optSessionId);
  return rows.length ? `<div class="card"><div class="lst">${rows.map(apprRowHTML).join('')}</div></div>` : '';
}

/* 队列**一条** = 源码 `AgentApprovalCards.kt:156-191`：`{op}: {taskId 前 12 位}` +
   行尾排队时刻 / `prompt`。上一版画的「谁排的」在数据里根本没有，已换成真正在字段里的
   op 与 prompt。与审批同款：一张卡、行间发丝线。 */
function queueRowHTML(q){
  return `<div class="qk">
    <div class="bd"><div class="tl">${q.op}: ${q.taskId.slice(0,12)}</div>
      ${q.prompt?`<div class="pm">${q.prompt}</div>`:''}</div>
    <div class="tm">${q.queuedAt}</div>
  </div>`;
}
function queueSectionHTML(){
  return AGENT_QUEUE.length
    ? `<div class="card"><div class="lst">${AGENT_QUEUE.map(queueRowHTML).join('')}</div></div>` : '';
}

/* 待办角标。0 项时**不画** —— 角标的意思是「这里有东西在等你」，不是计数器。 */

/* 工作区状态卡（源码 `AgentStatusCard:568-608`）—— 只有工作区身份与连接：

   （手机 `go('m-chat')`；桌面由壳自己切，按钮不带 onclick）。 */

   `risk` 字段（把 summary 硬当风险说明），是这一轮修掉的硬伤之一。

   正是「工作区 → 会话」分层之后最该一眼看到的东西，所以下面用 `pendingOf()` 把它做成角标。
   注意源码是按**节点**过滤的（AgentConsoleScreen.kt:232 `filter { it.peerId == selected.nodeId }`），
   即一个工作区的审批全都列在一起，不按会话分组 —— 原型照这个粒度画，
   会话归属只体现在角标上（这也是第四节「超出现有源码」的第一条提案）。 */
const AGENT_APPROVALS = [
  {approvalId:'ap-1', sessionId:'s-8842', tool:'Read',
   summary:'读取 /Users/me/Desktop/secrets.env（含密钥）', expiresAt:'2 分钟后', status:'pending'},
  {approvalId:'ap-2', sessionId:'s-8842', tool:'Bash',
   summary:'npm run deploy --prod', expiresAt:'5 分钟后', status:'pending'},
  // 终态：源码 `status` 非 pending 时也照画（`approvals.forEach` 不过滤），只是不画按钮。
  {approvalId:'ap-3', sessionId:'s-8843', tool:'Write',
   summary:'把纪要草稿写进「本周纪要」笔记', status:'approved'},
  {approvalId:'ap-4', sessionId:'s-9001', tool:'Bash',
   summary:'重跑失败的集成测试（2 项待复核）', expiresAt:'9 分钟后', status:'pending'},
  /* 过期：`expiresAt > 0 && now > expiresAt` 时胶囊显示「已过期」、**按钮消失**（:60 / :118）。
     这一档是这次补的 —— 上一版只画了 pending，等于只画了一半回路。 */
  {approvalId:'ap-5', sessionId:'s-9001', tool:'WebFetch',
   summary:'拉取上游 release notes', expiresAt:'已超时', status:'pending', expired:true},
];
/* 一条审批算不算「还在等你」：源码判据是 `status=="pending" && !isExpired`。 */
const isPending = a => a.status === 'pending' && !a.expired;
/* 某个会话 / 某个工作区名下还压着几条待审批 —— 会话条与 chip 的角标都用它。 */
const pendingOf = sid => AGENT_APPROVALS.filter(a => a.sessionId === sid && isPending(a)).length;
const wsPending = w => w.sessions.reduce((n, s) => n + pendingOf(s.sessionId), 0);
/* 当前工作区看得到的审批（照源码按节点过滤的粒度，或指定会话过滤）。 */
const approvalsOf = (w, optSessionId) => AGENT_APPROVALS.filter(a => optSessionId ? a.sessionId === optSessionId : w.sessions.some(s => s.sessionId === a.sessionId));

/* 队列任务字段照源码 `AgentQueueTaskUi`（RelayUiState.kt:272-279）：
     taskId / sessionId / peerId / op / prompt / queuedAt
   卡面（AgentApprovalCards.kt:156-191）是**两行**：
     ① `{op}: {taskId 前 12 位}`（titleSmall、粗）+ 行尾 `formatClock(queuedAt)`（labelSmall、次要色）
     ② `prompt`（bodySmall、次要色）
   上一版画的是「活 + 谁排的（你 · 14:30 / 定时任务）」—— 「谁排的」这个字段在数据里根本没有，
   真正该出场的 `op` 与 `prompt` 反倒没画。 */
const AGENT_QUEUE = [
  {taskId:'q-7f3a91c2d4e8', sessionId:'s-8843', op:'整理', prompt:'整理今天 3 场会议的纪要', queuedAt:'14:30'},
  {taskId:'q-2b81d0a9f6c1', sessionId:'s-8842', op:'生成', prompt:'生成本周进度周报', queuedAt:'13:55'},
  {taskId:'q-9c04e7b3a5d2', sessionId:'s-8844', op:'同步', prompt:'把 design-spec.json 同步到知识库', queuedAt:'13:10'},
];

/* 表情面板（桌面端输入区）。协议里 text 就是普通字符串，表情不需要改包格式，
   但每个表情按 UTF-8 占 2–4 字节，会直接吃 800 B 的单播预算。 */
const EMOJI = ['😀','😄','😅','😂','🙂','😉','😊','😍',
               '🤔','😐','😴','😢','😭','😤','😳','🥺',
               '👍','👎','🙏','👏','🎉','💪','🤝','👌',
               '🔥','✨','💡','📌','✅','❌','⏰','📎',
               '☕','🍜','🌙','☀️','🐛','🚀','🎯'];

/* ---------- 头像模型 ----------
   `avatar` 是协议里的数值预设：
     -1       昵称首字（legacy「初始头像」）—— 底色由昵称哈希分配
     0..199   图标头像 —— 编码 = 颜色索引 * 20 + 图标索引
   （200..209 是早期版本的「初始底色」，本端不产出，也不在此呈现。）
   `Limits.kt` 的 AVATAR_LEGACY_INITIAL_VALUE / AVATAR_ANIMAL_MAX_VALUE 就是这个范围。 */
const AV_ANIMALS = ['🐶','🐱','🐷','🐰','🐼','🐻','🦊','🐯','🦁','🐮',
                    '🐸','🐵','🐨','🐹','🐧','🐥','🦉','🦄','🐳','🐙'];
/* 图标头像的 10 个底色。**每个都要能压住白字**（≥4.5:1）—— 昵称首字是 16~19px 的 600 字重，
   不算 WCAG 的"大字"，所以是正文档不是 3:1 档。
   原值里有 5 个不达标：茶青 4.11、湖蓝 4.41、枫红 4.49、橄榄 4.39、杏黄 2.95。
   前四个只是**把明度压深一档**（色相不动，差值肉眼几乎看不出）；
   杏黄明度差太远，硬压会变成棕色 —— 它反过来配深字（2.95 → 5.82），所以带 `on` 字段。 */
const AV_COLORS = [
  {name:'茶青',bg:'#3A7F62'}, {name:'湖蓝',bg:'#2C7AA0'}, {name:'靛蓝',bg:'#5366B3'},
  {name:'紫藤',bg:'#7B5BA7'}, {name:'莓红',bg:'#B65072'}, {name:'枫红',bg:'#AC5543'},
  {name:'杏黄',bg:'#C88A2D',on:'#2A1B00'}, {name:'橄榄',bg:'#66753A'}, {name:'石墨',bg:'#55616D'},
  {name:'墨青',bg:'#2F6F73'},
];
/** 压在该底色上的字色。默认白字，只有 `on` 显式指定的（杏黄）例外。 */
const avInk = bg => (AV_COLORS.find(c => c.bg === bg) || {}).on || '#fff';
const AV_N = AV_ANIMALS.length;                        // 20
const nickHash   = s => { let h=0; for(const ch of String(s)) h=(h*31+ch.charCodeAt(0))>>>0; return h; };
const avInitial  = n => String(n).trim().slice(0,1) || '茶';
const avColorIdx = (v,n) => (Number.isInteger(v) && v>=0)
  ? Math.floor(v / AV_N) % AV_COLORS.length
  : nickHash(n || '茶') % AV_COLORS.length;
const avEncode   = (ci,ii) => ci*AV_N + ii;

/* 原型里的编辑状态：改一下就重绘，预览与身份头同步跟着变。
   三档模式：动物表情 / 昵称首字 / **自定义头像（上传本地图片）**。
   「自定义头像」是一整条落地链路（选图 → 裁正方形 → 192×192 webp →
   sha256 → `profile.avatarHash` → 对端按需取 `av1`），不是换个图标而已，
   所以它下面有自己的一块上传区，而不是空着（见 `avUploader`）。 */
let avMode = 'icon', avIcon = 0, avColor = 0;
let avCustom = true;                       // 原型默认「已经选了一张」，预览位才不是空的
const AV_NICK = ME.nick;
const avValue = () => avMode==='icon' ? avEncode(avColor, avIcon) : -1;
const avBg    = () => AV_COLORS[avColorIdx(avValue(), AV_NICK)].bg;
/** 自定义头像那一张「照片」。原型里没有真图可放，用一个山形 SVG 顶替它 ——
    要看清的是它背后的**约束与落盘**，不是这张图本身长什么样。 */
const avPhotoSVG = size =>
  `<svg viewBox="0 0 24 24" style="width:${Math.round(size*0.62)}px;height:${Math.round(size*0.62)}px"
     stroke-linecap="round" aria-hidden="true"><circle cx="8.8" cy="9.4" r="1.7"/>
     <path d="M3.2 20l6.4-6.4 4.1 3.5 2.7-2.3 4.4 3.6z"/></svg>`;
/** 头像圆：三档各画各的。图标画 emoji，首字画昵称第一个字，自定义画那张照片。 */
function avCircle(size, cls, badge){
  if (avMode === 'custom') {
    return `<div class="${cls} av-ph" style="width:${size}px;height:${size}px">${
      avPhotoSVG(size)}${badge||''}</div>`;
  }
  const icon = avMode==='icon';
  const txt  = icon ? AV_ANIMALS[avIcon] : avInitial(AV_NICK);
  const fs   = Math.round(size * (icon ? 0.47 : 0.40));
  const bg   = avBg();
  return `<div class="${cls}" style="background:${bg};color:${avInk(bg)};width:${size}px;height:${size}px;font-size:${fs}px">${txt}${badge||''}</div>`;
}
function avSetMode(m){ avMode = m; render(); }
/** 原型开不出系统文件选择器，所以「选一张」落到专屏 `m-set-avatar` 讲完整链路。 */
function avOpenUpload(){ go('m-set-avatar'); }
function avKeepCustom(){ avMode='custom'; avCustom=true; render(); }
function avDropCustom(){ avMode='icon'; avCustom=false; render(); }   // 退回图标档
function avPickIcon(i){ avMode='icon'; avIcon=i; render(); }
function avPickColor(i){ avMode='icon'; avColor=i; render(); }
/** 头像的**只读**画法：给别人画头像时不能借用编辑器的全局状态。 */
function avatarOf(person, size, radius){
  const nick = person.nick || person.title || '';
  const ini  = person.ini || avInitial(nick);
  const av   = Number.isInteger(person.avatar) ? person.avatar : -1;
  if (av >= 0) {
    const icon = AV_ANIMALS[av % AV_N];
    const bg   = AV_COLORS[Math.floor(av / AV_N) % AV_COLORS.length].bg;
    return `<div style="background:${bg};width:${size}px;height:${size}px;font-size:${Math.round(size*0.47)}px;
      border-radius:${radius};display:grid;place-items:center;color:#fff;font-weight:600;flex:none">${icon}</div>`;
  }
  const bg = AV_COLORS[nickHash(nick) % AV_COLORS.length].bg;
  return `<div style="background:${bg};width:${size}px;height:${size}px;font-size:${Math.round(size*0.42)}px;
    border-radius:${radius};display:grid;place-items:center;color:${avInk(bg)};font-weight:600;flex:none">${ini}</div>`;
}

/** 档位开关。**放在最前**是这一屏这轮唯一真正的结构改动：源码 AvatarPicker 干的第一件事
    就是画这两枚 FilterChip（AvatarPalette.kt:115-135），画完才轮到内容；
    稿子原来把开关摆在图标网格和色板**下面**，等于让人先挑完图标、再往下翻才知道
    「原来还能切成昵称首字」—— 选完的东西跟着一起变，白挑。
    第三档「上传图片」是本稿加的（Kotlin 侧 avatar 还在 `MsgTypes.UNHANDLED` 里），
    这一处偏离连同三条出路写在 `m-set-avatar` 那一屏。 */
function avSeg(){
  return `<div class="seg" style="margin-bottom:12px">
    <button aria-pressed="${avMode==='icon'}" onclick="avSetMode('icon')">图标头像</button>
    <button aria-pressed="${avMode==='initial'}" onclick="avSetMode('initial')">昵称首字</button>
    <button aria-pressed="${avMode==='custom'}" onclick="avSetMode('custom')">上传图片</button>
  </div>`;
}
/** 当前档位的内容。三档各画各的 —— 不留空档位，也不把三档的说明叠在一起让人自己找。 */
function avModeBody(){
  if (avMode === 'custom')  return avUploader();
  if (avMode === 'initial') return avInitialNote();
  return avPicker();
}
/** 自定义头像的上传区。只在「自定义头像」档出现 —— 另两档没有「选哪张图」这回事。
    三条约束全部来自源码，不是拍脑袋：源图上限与单边上限见
    `protocol.ts:19-21`，固定输出 192×192 / 编码上限 32 KiB 见同文件 `:23-25`，
    内容寻址的 sha256 与 `<hash>.webp` 落盘见 `avatar-store.ts:24-26` / `:103-105`。 */
function avUploader(){
  if (avMode !== 'custom') return '';
  const pv = avCustom
    ? `<div class="avup-pv">${avPhotoSVG(52)}</div>
       <div class="avup-bd">
         <div class="t1">team-photo-1920.jpg</div>
         <div class="t2">源图 1920×1280 · 1.8 MB → 输出 192×192 webp</div>
       </div>`
    : `<div class="avup-bd"><div class="t1">还没选图</div>
         <div class="t2">点右边那颗「上传图片」挑一张本地图</div></div>`;
  return `<div class="avup">
    <div class="avup-pick">${pv}
      <div class="avup-acts">
        ${avCustom ? `<button class="btn sm" onclick="avOpenUpload()">${ic('up')} 换一张</button>
                      <button class="btn sm" onclick="avDropCustom()">${ic('trash')} 移除</button>`
                   : `<button class="btn sm pri" onclick="avOpenUpload()">${ic('up')} 上传图片</button>`}
      </div>
    </div>
    <div class="avup-rule">输出<b>固定 192×192 webp</b>、非动图、编码后 ≤ 32 KiB；
      源图 ≤ 20 MiB、单边 ≤ 8192。图片<b>只在本机按 sha256 存</b>，
      网络上只走一个 32 位的哈希。</div>
  </div>`;
}
/** 图标档的两个选择器。顺序照源码：**先底色、再动物图标**
    （AvatarPalette.kt:139-178 在 `:181-209` 之前）；两组标签都把「现在选中的是什么」
    写在后面（源码是 `底色（茶青）` / `动物图标（🐶）`），不用回头数第几个。 */
function avPicker(){
  return `<div class="avedit-pick">
    <div class="avedit-lb">底色<b>${AV_COLORS[avColor].name}</b></div>
    <div class="avedit-cs">
      ${AV_COLORS.map((c,i)=>`<button class="avedit-c" style="--c:${c.bg};--ink:${avInk(c.bg)}"
        aria-pressed="${avColor===i}" title="${c.name}"
        aria-label="头像底色：${c.name}" onclick="avPickColor(${i})"></button>`).join('')}
    </div>
    <div class="avedit-lb" style="margin-top:15px">动物图标<b>${AV_ANIMALS[avIcon]}</b>
      <span class="nb">${avIcon+1} / ${AV_N}</span></div>
    <div class="avedit-grid">
      ${AV_ANIMALS.map((e,i)=>`<button class="avedit-ch" style="--c:${avBg()}"
        aria-pressed="${avIcon===i}" aria-label="动物图标 ${i+1}"
        onclick="avPickIcon(${i})">${e}</button>`).join('')}
    </div>
    <div class="hint" style="margin:0">20 个图标 × 10 个底色 = 200 种，档案里只写一个数：
      底色 × 20 + 图标 = <span class="mono">${avEncode(avColor, avIcon)}</span>。</div>
  </div>`;
}
/** 首字档的自解释条。这一档原来什么都不画，整块留白 —— 三档里它看着最像坏了。
    底色不是随便挑的：昵称哈希决定，所以同一个人在哪台机器上都是同一个颜色。 */
function avInitialNote(){
  const ci = avColorIdx(-1, AV_NICK);
  const bg = AV_COLORS[ci].bg, ch = avInitial(AV_NICK);
  return `<div class="avmode">
    <div class="avmode-pv" style="background:${bg};color:${avInk(bg)}">${ch}</div>
    <div class="avmode-bd">
      <div class="t1">取昵称第一个字「${ch}」</div>
      <div class="t2">底色按昵称分配、<b>不可选</b>（现在是 <b>${AV_COLORS[ci].name}</b>）——
        同一个人换到哪台机器都是这个颜色。</div>
    </div>
  </div>`;
}

/* ---------- 小积木 ---------- */
const sw   = (on, dis) => `<button class="sw" aria-checked="${on}"${dis?' disabled':''}></button>`;
const srow = (title, sub, ctl, dis) =>
  `<div class="krow${dis?' dis':''}"${dis?' style="cursor:default"':''}>
     <div class="bd"><div class="t1">${title}</div>${sub?`<div class="t2">${sub}</div>`:''}</div>${ctl||''}</div>`;

/* 会话行的两套写法：移动端是 .row，桌面端左栏是 .li。内容一致，只有壳不同。

   **右列是源码那样的三样，不是两样**（`ConversationRow`，`ConversationsScreen.kt:358`
   那个 `Column(horizontalAlignment = End, verticalArrangement = spacedBy(8.dp))`）：
   时间 → 未读 → **待发**（`conv_pending_count`「%1$d 待发」，`:450-458`）。
   `.row .rt` 是 `display:grid;gap:8px`，正好一条对一条；三样都属于 `labelSmall` +
   `onSurfaceVariant`，所以时间与待发共用 `.tm`、未读是那颗实心徽标。
   待发原来漏了 —— 而「消息」那一屏的注解自己写着行里带"2 条排队"（见 `screenHomeRecent`），
   注解承诺、行里没画，这一轮补齐（`pendingCount` 本来就在 `CONVS` 上）。 */
function convRow(c){
  const g = c.isGroup ? groupOf(c.convId.slice(6)) : null;
  const p = c.isGroup ? null : peerOf(c.convId);
  const av = g
    ? `<div class="av" style="background:#4A7C59">群</div>`
    : `<div class="av" style="background:${p?p.c:'#6E6E6E'}">${p?p.ini:'?'}${
        p?`<span class="p" style="background:${p.isAgent?'var(--agent)':(p.online?'var(--online)':'var(--on-2)')}"></span>`:''}</div>`;
  return `<div class="row conv${c.unread?' unread':''}" onclick="go('${c.isGroup?'m-chat-group':'m-chat'}')">
    ${av}
    <div class="bd">
      <div class="t1"><span class="ell">${c.title}</span>
        ${c.isAgent?'<span class="tag agent">Agent</span>':''}</div>
      <div class="t2">${c.preview||'还没聊过，打个招呼'}</div>
      ${g?`<div class="tgroup">${memberOnlineCount(g)}/${g.members.length} 人在线</div>`:''}
    </div>
    <div class="rt"><span class="tm">${c.at}</span>
      ${c.unread?`<span class="tag unread">${c.unread}</span>`:''}
      ${c.pendingCount?`<span class="tm">${c.pendingCount} 待发</span>`:''}</div>
  </div>`;
}

/* ================= 消息页签的「工作区」段（设计稿 §3–§5） =================
   设计稿：`docs/plans/2026-10-13-relay-inbox-workspace-section-design.md`
   （用户 m00102 的诉求「关注最近的 peer，最近的工作区，点击操作就跟在工作区列表点击一样」
   → 采纳 B：两个分区，不是一个混排列表）。本段**不引入任何新的身份键**：取数键 =
   `(nodeId, agentId ?? agentKind, wsId)` —— 沿用父稿 §2.1，`agentKeyOf()` / `kindKeyOf()`
   就是那个 `agentId ?? agentKind`，`wssOfAgent()` / `unassignedOf()` 就是它的两个抽屉。

   一行 = 什么，取决于是**哪一层**数据到了（降级阶梯，设计稿 §3）：

     有 `wsId`                                   → 工作区行（标题 `wsTitle`；缺名字写
                                                  「未命名工作区」，不拿 path 末段冒充 ——
                                                  父稿 `:34` 的降级铁律）
     agent 一条工作区都没有、只有未归属会话       → **Agent 行**，副行明写「未上报工作区」
                                                  （今天的老端就长这样：`agentKind` 本来就在
                                                   wire 上，所以印它不算猜；`wsId` 才是真缺口）
     agent 有工作区、也有未归属会话               → 工作区行 + 一行「未归属会话 N」
                                                  （父稿 §2.5：未归属会话是一等状态，但**不造卡**）

   三条硬约束，都是本稿新增、父稿没写的：
     · **组头必须画**（一台设备一组）。一个节点上可以同时有两个 agent（夹具里
       `teahouse-mobile` 就是 `dsh-main` + `oc-main`），没有组头就分不清 `relay-tools`
       是哪个 agent 的；行内副行再带一次 agent 主名，两处一起才自证归属。
     · **红点 = 待审批条数**，不是未读消息。`AgentApprovalUi` 上**没有** `agentId/agentKind`
       （`RelayUiState.kt:405-414`），所以归属只能走 `peerId + sessionId` 二次 join 回会话；
       join 不上就只记节点级 —— 本段用 `pendingOf(sessionId)` 取，join 不上的审批在这里
       压根不出现在任何一行上，不猜、也不塞给"第一个 agent"。两种"红"不共用一颗红点，
       就是设计稿 §2 的第 2 条理由。
     · **点击 = 下钻**：工作区行 → 工作区详情、Agent 行 → Agent 详情、未归属会话行 →
       扁平会话列表（与工作区看板上那一行**同款落点**，不另发明一条路）。
       「打开聊天」从"整行的行为"降级成**行尾一颗按钮** —— 对 agent 发消息走的是
       `messages` 表，与工作区无关（父稿 §0.1 第 2 句），这条链路不能因为改点击而丢掉。

   排序：待审批在前 → 最近活动倒序（`ts` 是距今分钟数，见 `WORKSPACES` 夹具头注释）。
   **组与行用同一把尺子**：有待审批的那台设备整组先上，然后最近活动的先 —— 不是
   节点页那套「在线优先 → 名字」（那套在这里会让一台 0 个工作区的设备排在最上面）。 */
function inboxWsItems(){
  const out = [];
  const sumPend = ss => ss.reduce((n,s) => n + pendingOf(s.sessionId), 0);
  const minTs   = ss => ss.reduce((m,s) => Math.min(m, s.ts ?? 1e6), 1e6);
  for (const g of allNodes()){
    if (!g.agentCount) continue;          // 没声明 ag1 的设备没有工作区可言，整组不画
    const items = [];
    for (const a of g.agents){
      const wss = wssOfAgent(a.nodeId, a.key), un = unassignedOf(a.nodeId, a.key);
      for (const w of wss) items.push({
        kind:'ws', g, a, w, wsId:w.wsId, sessions:w.sessions, title:wsName(w),
        unnamed:!w.wsTitle, pending:wsPending(w), ts:w.ts ?? 1e6});
      if (wss.length && un.length) items.push({
        kind:'unassigned', g, a, wsId:'', sessions:un, title:'未归属会话',
        pending:sumPend(un), ts:minTs(un)});
      /* 一条工作区都没有的 agent：整段退化成**一行 Agent**（0 条会话时它也是一行 ——
         那时候它说的是"对端还没说话"，不是"它什么都没有"，与 `agentRowHTML` 同文案）。 */
      if (!wss.length) items.push({
        kind:'agent', g, a, wsId:'', sessions:un, title:a.key,
        pending:sumPend(un), ts:minTs(un)});
    }
    items.sort((x,y) => y.pending - x.pending || x.ts - y.ts);
    const pend = items.reduce((n,i) => n + i.pending, 0);
    const ts   = items.reduce((m,i) => Math.min(m, i.ts), 1e6);
    if (items.length) out.push({g, items, pend, ts});
  }
  /* 组也按同一把尺子：**有待审批的那台设备先**，然后最近活动的先 —— 否则一台
     0 个工作区的设备会因为节点页那套排序（在线优先 → 名字）压在两名工前面，
     而它恰好是最不需要先看的那一组。 */
  out.sort((x,y) => y.pend - x.pend || x.ts - y.ts);
  return out;
}
/* 摊平 + 全局排序。上限是**整段**的（不是"每组各自限几行"），所以必须先有全局次序，
   再按组收回去画 —— 否则"组头"就变成了"每台设备先占一行"的配额。 */
const inboxWsFlat = () =>
  inboxWsItems().reduce((a,g) => a.concat(g.items), [])
    .sort((x,y) => y.pending - x.pending || x.ts - y.ts);
const inboxWsCount = () =>
  inboxWsFlat().filter(i => i.kind === 'ws').length;      /* 只数工作区，不数未归属/Agent 行 */
const inboxWsPending = () =>
  inboxWsFlat().reduce((n,i) => n + i.pending, 0);        /* 整段所有行的待审批之和 */

/* 段落上限。这一屏是**最近流**，不是"全部、按结构"（后者是「消息·更多菜单」那一屏
   与工作区看板）。3 行是量出来的：会话那 5 行占到 622px，首屏只余一行多的位置 ——
   再往上加，最该看的待审批行就得靠滚动才看得见。 */
const INBOX_WS_LIMIT = 3;
function inboxWsPlan(limit = INBOX_WS_LIMIT){
  const all = inboxWsFlat(), show = all.slice(0, limit), rest = all.slice(limit);
  const secs = [];
  for (const u of show){
    let s = secs.find(x => x.g.k === u.g.k);
    if (!s){ s = {g:u.g, items:[]}; secs.push(s); }
    s.items.push(u);
  }
  return {secs, rest:rest.length,
          restPend:rest.reduce((n,i) => n + i.pending, 0)};
}

/* 组头。与看板同款 `.grphead`，但**不挂 onclick**：看板那个点进去是 Agent 详情，
   而这里是消息页签 —— 组头只是分组标签，要点的是下面那一行行。 */
function inboxGroupHead(g){
  /* 组头字段取 `nodeGroups()` **摊平在组上**的那一份（name/plat/online/never/lastSeen/
     agentCount），不取 `g.node`（那是 peer 记录，字段叫 nick/remark）—— 与看板组头同源。 */
  const dot = g.online ? 'var(--online)' : (g.never ? 'var(--error)' : 'var(--on-2)');
  const wsn = g.wss.length;   /* 与看板组头同一个数：这台设备上报过几个工作区 */
  return `<div class="grphead">
    <span class="av" style="width:14px;height:14px;background:${dot}"></span>
    <span class="ell">${g.name} · ${g.plat}</span>
    <span class="cnt">${g.agentCount} 个 Agent · ${wsn} 个工作区${
      g.online ? '' : ` · ${g.lastSeen}在线`}</span>
  </div>`;
}

/* 被上限挡掉的那些行。**这个数必须印出来**：把有待审批的行藏起来而不说，
   是"省空间"里最坏的一种。点它去工作区看板 —— 那才是"全部、按结构"的那一屏。 */
function inboxWsTail(plan){
  return `<div class="card"><div class="padc">
    <div class="krow" style="border-bottom:0"
         onclick="go('${deskNow() ? 'd-agents' : 'm-agents'}')">
      <div class="av" style="background:var(--surface-2);color:var(--on-2)">${ic('grid')}</div>
      <div class="bd">
        <div class="t1 title1"><span class="ell">还有 ${plan.rest} 行</span></div>
        <div class="t2">${plan.restPend ? `其中 ${plan.restPend} 项待审批 · ` : ''}去工作区看板看全部</div>
      </div>
      <div class="rt" style="flex:none;display:flex;align-items:center">${ic('chev')}</div>
    </div>
  </div></div>`;
}

/* 行模板与 `wsRowHTML`（Agent 详情里的工作区区）**同族**：`.krow` + 终端图标 + 标题 + 副行，
   落点也一样（`openWorkspace` / `openAgentOf` / `openUnassigned`）。差别只有一处：
   这里**不带 path 行、不带徽标**，行高向会话行（72px）看齐 —— 这一屏是摘要，
   完整那行（带类型徽标、来源标记、路径）在工作区看板与详情里。 */
function inboxWsRow(u){
  const n = u.sessions.length;
  /* 徽标**不能塞进 `.ell` 里** —— `.ell` 是省略号那一格，塞进去的标签会跟着标题一起
     被截成「D…」（`wsRowHTML` 正是把标题和标签并列摆的，这里照抄那个结构）。 */
  let icon = 'terminal', t1 = '', tags = '', t2 = '', t3 = '', hint = '';
  if (u.kind === 'ws'){
    t1 = wsName(u.w);
    /* **这一行的标题后面什么都不挂**（不是漏了，是量的结果）：
       这一行右侧要放三样东西 —— 名字、待批药丸、「打开聊天」—— 而手机上只有 393px。
       实测：挂上类型徽标（`kindsOfWs` 派生自 `agentKind`）之后最长的名字（`teahouse-mobile`，
       正是那条 2 项待批的行）被截成「teahouse-m…」，也就是**最该看清的那一行的名字先丢了**。
       徽标那份信息在副行开头就写着同一个标识（`dsh-main · 4 个会话`），
       而名字是这一层唯一不可猜的东西（父稿 R1/R2），所以宽度全让给名字。
       工作区级的 `source` 更不画：夹具头注释自己写着「工作区级的 source 与 path 协议里没有」，
       而且 5 条夹具里 4 条它的值与类型重复（会变成「teahouse-mobile DSH DSH」）。
       `kindsOfWs` 仍然保留 —— 工作区列表那一屏（`wsRowHTML`）在宽处照旧画它。 */
    tags = '';
    t2 = `${u.a.key} · ${n} 个会话`;
    /* **不带 path 行**：那 15px 在这一屏是纯装饰 —— 路径本来只用来认工作区，
       而下钻进去（工作区详情）第一行就是它；摘要行跟着会话行的高度走才不显胖（实测
       带 path + 两行解释时一行 116px，会话行是 72px）。 */
    if (u.unnamed) hint = '没收到工作区名（不拿路径顶替）';
  } else if (u.kind === 'unassigned'){
    icon = 'list';
    t1 = '未归属会话';
    tags = `<span class="tag muted">${n}</span>`;
    t2 = `${u.a.key} · 收到了会话，但没收到它属于哪个工作区`;
  } else {
    icon = 'bot';
    t1 = u.a.key;
    tags = '<span class="tag agent">Agent</span><span class="tag muted">未上报工作区</span>';
    t2 = n ? `${n} 个会话 · 对端还没宣告过工作区`
           : '尚未收到会话宣告';   /* 与 `agentRowHTML` / `agentDetailBody` 同文案 */
  }
  const click = u.kind === 'ws' ? `openWorkspace('${u.wsId}')`
              : u.kind === 'unassigned' ? `openUnassigned('${u.g.k}', 0, '${u.a.key}')`
              : `openAgentOf('${u.g.k}', '${u.a.key}')`;
  return `<div class="krow" onclick="${click}">
    <div class="av" style="background:var(--surface-2);color:var(--primary)">${ic(icon)}</div>
    <div class="bd">
      <div class="t1 title1"><span class="ell">${t1}</span>${tags}</div>
      <div class="t2">${t2}</div>
      ${t3 ? `<div class="t3 mono" title="${t3}">${t3}</div>` : ''}
      ${hint ? `<div class="hint">${hint}</div>` : ''}
    </div>
    <div class="rt" style="flex:none;display:flex;align-items:center;gap:8px">
      ${u.pending ? `<span class="pcount">${u.pending} 项待批</span>` : ''}
      <button class="ibtn plain" aria-label="打开聊天"
        title="打开聊天（对它发消息；走的是聊天那张表，与工作区无关）"
        onclick="event.stopPropagation();openChatAt('${u.g.k}','${u.wsId || ''}')">${
        ic('chat')}</button>
    </div>
  </div>`;
}

/* 混排流里的单行工作区卡片（对齐会话行 .row.conv 的样式与尺寸，不展开 session）。
   点击整行直接下钻到工作区详情。 */
function inboxWsFeedRow(u){
  const n = u.sessions ? u.sessions.length : 0;
  let icon = 'terminal', t1 = '', t2 = '', hint = '';
  if (u.kind === 'ws'){
    t1 = wsName(u.w);
    t2 = `${u.a.key} · ${n} 个会话`;
    if (u.unnamed) hint = '没收到工作区名';
  } else if (u.kind === 'unassigned'){
    icon = 'list';
    t1 = '未归属会话';
    t2 = `${u.a.key} · 收到了会话，但没收到它属于哪个工作区`;
  } else {
    icon = 'bot';
    t1 = u.a.key;
    t2 = n ? `${n} 个会话 · 对端还没宣告过工作区` : '尚未收到会话宣告';
  }
  const click = u.kind === 'ws' ? `openWorkspace('${u.wsId}')`
              : u.kind === 'unassigned' ? `openUnassigned('${u.g.k}', 0, '${u.a.key}')`
              : `openAgentOf('${u.g.k}', '${u.a.key}')`;
  const dot = u.g.online ? 'var(--online)' : (u.g.never ? 'var(--error)' : 'var(--on-2)');
  return `<div class="row conv ws" onclick="${click}">
    <div class="av" style="background:var(--surface-2);color:var(--primary)">
      ${ic(icon)}
      <span class="p" style="background:${dot}"></span>
    </div>
    <div class="bd">
      <div class="t1"><span class="ell">${t1}</span><span class="tag agent">${u.kind === 'ws' ? '工作区' : 'Agent'}</span></div>
      <div class="t2">${t2}</div>
      ${hint ? `<div class="hint">${hint}</div>` : ''}
    </div>
    <div class="rt">
      <span class="tm">${u.ts && u.ts < 1e5 ? `${u.ts}m前` : '刚刚'}</span>
      ${u.pending ? `<span class="tag pend">${u.pending} 待批</span>` : ''}
    </div>
  </div>`;
}

let homeFilter = 'all';
function setHomeFilter(id){
  homeFilter = id;
  if (id === 'unread') go('m-home-unread');
  else go('m-home-recent');
}

function homeFeed(filter = 'all'){
  const convItems = CONVS.map(c => ({
    kind: 'conv',
    ts: c.ts,
    pending: 0,
    data: c,
    match: {
      all: true,
      unread: c.unread > 0,
      workspace: false,
      group: c.isGroup,
      agent: !c.isGroup && c.isAgent,
      human: !c.isGroup && !c.isAgent,
    }
  }));
  const wsItems = inboxWsFlat().map(u => ({
    kind: 'ws',
    ts: u.ts,
    pending: u.pending,
    data: u,
    match: {
      all: true,
      unread: u.pending > 0,
      workspace: true,
      group: false,
      agent: false,
      human: false,
    }
  }));
  const all = [...convItems, ...wsItems];
  all.sort((a, b) => (b.pending > 0 ? 1 : 0) - (a.pending > 0 ? 1 : 0) || a.ts - b.ts);
  return all.filter(item => item.match[filter] ?? true);
}

/* 行尾那颗「打开聊天」。它**钉住**点的是哪个对端的工作区 —— 不钉的话聊天页会拿它默认
   那一个顶上去，标题与内容就对不上了（`chatWsPinned`，由 `screenChat` 读，与
   `openChatOf` 同一条机制）。节点上一个工作区都没有时（老端档）钉不住，
   只能落到聊天页自己的默认 —— 原型那一屏目前只有一个对端的桩，这条限制写在屏注释里。 */
function openChatAt(nodeId, wsId){
  const i = wsId ? WORKSPACES.findIndex(w => w.wsId === wsId)
                 : WORKSPACES.findIndex(w => w.agentNodeId === nodeId);
  chatWsPinned = null;
  if (i >= 0){ wsIdx = i; wsSessionIdx = 0; chatWsPinned = i; }
  go('m-chat');
}

/* 顶栏右上角的「更多」。这**不是**新发明的位置：桌面工具栏末尾就是这一颗
   （`DesktopChrome.kt:367-368` 的 `ToolbarOverflowMenu`，文案
   `desktop_toolbar_more` = 「更多」，装的是设置 / 诊断 / Agent 控制台 /
   复制节点 ID / 刷新节点 / 退出）。
   移动端一颗都没有，原因不在"忘了挪"：移动端页签首页**根本没有顶栏** ——
   单栏外壳 `CompactScaffold` 只挂导航件，标题行是 `ConversationsScreen` 自己画的
   一行光秃秃的 `Text`。
   （这个外壳原名 `AdaptiveScaffold`，已改名 —— 原因写在新文件的头注释里：
   `ui/components/CompactScaffold.kt:38-58` 说清了它原带的 `NavigationRail`
   宽屏分支**从来没被渲染过**，宽屏竖导其实是 `DesktopShell` 画的。）
   所以「标题栏右侧放更多」在手机上不是搬一个按钮，是先补一条顶栏。 */
const moreBtn = (to, cls) =>
  `<button class="ibtn${cls?' '+cls:''}" aria-label="更多"${to?` onclick="go('${to}')"`:''}>${ic('more')}</button>`;

/* ---------------- 头部动作收纳（`.hdmore`） ----------------
   手机与桌面共用**同一条规则**：一个头部里直出的动作不超过 `max` 个，其余收进「⋯」。

   为什么需要：`.topbar.chat` 那一行要塞「返回 + 头像 + 标题 + 两个标签 + 副标题」，
   实测 393px 下留给标题的只剩约 200px —— 再挂第三个按钮，先被省略号吃掉的一定是标题。
   桌面窄档同理：`dhead` 在 612px 上要放「列表 / 复制节点 ID / 在新窗口打开」三颗，
   实拍 `d19-chat-medium` 的标题已经被截成 `teahouse-…`、副标题截在「在线…」。
   一行里**唯一不可替代**的是标题，动作可以收 —— 所以让标题先占位，动作溢出到菜单。

   动作统一用对象描述（`{icon,label,to,title,dis,danger}`），头部直出的图标按钮与
   菜单里的一行**由同一份描述渲染**：于是"把某个动作挪进菜单"只改一个数字，
   不会出现"两处 HTML 各写一份、挪完忘了删旧的"。 */
/* `html` 用来保住那些**不是图标按钮**的动作（桌面 dhead 的「复制节点 ID」是文字按钮
   `.btn.sm`）——直出时用它，收进菜单时自动换成「图标 + 文字」一行。 */
const actInline = a => a.html || (
  `<button class="ibtn"${a.click?` onclick="${a.click}"`:(a.to?` onclick="go('${a.to}')"`:'')}${a.dis?' disabled':''}` +
  ` aria-label="${a.label}"${a.title?` title="${a.title}"`:''}>${ic(a.icon)}</button>`);
const actMenuItem = a =>
  `<div class="mi2${a.dis?' dis':''}${a.danger?' danger':''}"` +
  `${a.dis?'':(a.click?` onclick="${a.click}"`:(a.to?` onclick="go('${a.to}')"`:''))}>${ic(a.icon)} ${a.label}</div>`;
/* 传字符串 = 老调用点（现成 HTML，原样直出）；传数组 = 走收纳规则。 */
let actMax = 0;   /* > 0 时覆盖各处的直出上限。验证钩子 `?actmore=N` 用它把「收进菜单」
                     这一态拍成截图 —— 否则要等真的多出第 3 个动作才看得见。 */
function actsHTML(list, max){
  if (typeof list === 'string') return list;
  const lim = actMax > 0 ? actMax : max;
  const arr = list || [];
  const inline = arr.slice(0, lim).map(actInline).join('');
  const rest = arr.slice(lim);
  if (!rest.length) return inline;
  return inline + `<span class="hdmore">
    <button class="ibtn" aria-label="更多" aria-haspopup="menu" onclick="toggleMenu(this)">${ic('more')}</button>
    <div class="menu" role="menu">${rest.map(actMenuItem).join('')}</div>
  </span>`;
}
function closeMenus(){ document.querySelectorAll('.hdmore.on').forEach(x => x.classList.remove('on')); }
function toggleMenu(btn){
  const host = btn.closest('.hdmore');
  const wasOpen = host.classList.contains('on');
  closeMenus();
  if (!wasOpen) host.classList.add('on');
}
/* 点空白处收起。只挂一次。点在菜单里不算「空白」—— 菜单项自己会 go() 整屏重绘。 */
document.addEventListener('click', e => { if (!e.target.closest('.hdmore')) closeMenus(); });

/* 会话列表上方的筛选条。计数从真实数据算，不写死 —— 写死的数字会随数据漂移，
   而这一条上「未读 3」正是用户判断"要不要点进去"的依据。 */
function fchips(cur){
  return `<div class="fchips" role="tablist" aria-label="筛选会话">${CONV_FILTERS().map(f => `
    <button class="fchip" role="tab" aria-selected="${f.id===cur}" onclick="setHomeFilter('${f.id}')">${f.label}${
      f.cnt?`<span class="cn">${f.cnt}</span>`:''}</button>`).join('')}</div>`;
}

/* ============================ 屏目录 ============================
   form: mobile 走 .device 外壳（状态栏 + 底导/侧导），desktop 走 .win 外壳
   （菜单栏 + 标题栏 + 工具条 + 双栏 + 状态栏）。 */
const SCREENS = [
  // 「消息」这一屏画的是**提案**（一条「最近会话」），不是现状 —— 打开原型默认落地的
  // 就是它。现在的三段现状（群聊 / Agent 节点 / 同事）**整组删掉了**：它是现状不是提案，
  // 原型要人看清的是新方案长什么样，现状那三节在 `ConversationsScreen.kt:223/248/254`
  // 还留着理由 —— 那些理由全部搬进 `m-home-recent` 的注释里，看提案那一屏就能查到现状。

   移动端今天连顶栏都没有，要借的正是这个位置。 */
const dMore = open => `<span class="tbmore">
  <button class="ibtn" aria-label="更多" title="更多">${ic('more')}</button>
  ${open?`<div class="menu" style="top:calc(100% + 8px);right:0;min-width:206px">
    <div class="mi2" onclick="go('d-settings')">${ic('gear')} 设置</div>
    <div class="mi2">${ic('moon')} 切换到深色</div>
    <div class="mi2" onclick="go('d-agents')">${ic('terminal')} 工作区</div>
    <div class="thr"></div>
    <div class="mi2">${ic('copy')} 复制本机 ID</div>
    <div class="mi2">${ic('info')} 诊断包</div>
    <div class="mi2">${ic('refresh')} 刷新节点</div>
    <div class="mi2">${ic('folder')} 打开下载目录</div>
    <div class="thr"></div>
    <div class="mi2 danger">${ic('close')} 退出</div>

  </div>`:''}

/* 工具栏。左端只有一个可切换的「搜索」按钮（**窄档位才有**，Expanded 常驻搜索框，
   见 DesktopChrome.kt:322-330），右端依次是 导入文件 / 新窗口打开 / 新建会话
   （`:362-368`）。**没有视图切换 chips** —— 那一排已经删了，视图切换只在左侧竖导
   （DesktopShell.kt:479-481）。 */
function toolbar(view, query, o){
  const s = SIZEOF[curForm] || {};
  const tier = s.tier || 'expanded';
  const expanded = tier === 'expanded';
  const narrow = !expanded;
  return `<div class="toolbar">
    ${narrow?`<button class="btn sm${o.searching?' on':''}">${ic('search')} 搜索</button>`:''}
    ${expanded || o.searching?`<div class="search">${ic('search')}<input value="${query||''}" placeholder="搜索会话 / 文件 / 节点"${
      query?'':' readonly'}/>${query?`<button class="clr" aria-label="清除搜索">${ic('close')}</button>`:''}</div>`:''}

/* connected=false 用于空态屏：此时还没有任何节点，状态栏不能说"已连接 5 个" */
function dstatusbar(connected){

       <span style="opacity:.6">·</span> 正在等待设备`

    </span></div>`;
}
/* 竖导/底导的角标值。会话 = 未读总数，文件 = 「等你处置」的入向文件邀约数，
   节点不画 —— 照 DesktopNavigation.kt 的 desktopNavBadges（节点表自己带在线状态点，
   再凑一个数字就是画一个点不动的红点）。 */
const DVIEW_BADGE = {chat:3, files:1, nodes:0, agents:1};
/* `cnts` 是空态屏用来把当前视图的角标按实的值（通常是 0）：不加这个的话，
   竖导/底导会一边说「文件 6」一边说「还没有文件」。 */
const dviewBtn = (cls, v, view, cnts) => {
  const n = cnts && cnts[v.id] !== undefined ? cnts[v.id] : (DVIEW_BADGE[v.id] || 0);
  return `<button class="${cls}" ${v.id===view?'aria-current="true"':''} onclick="dnavTo('${v.id}')">${ic(v.icon)}<span>${v.label}</span>${
    n>0?`<span class="nb">${n}</span>`:''}</button>`;
};
/** Compact（<664px）的 60px 底导：三个视图平铺在窗口底部（DesktopNavigation.kt 的
    `CompactNavigationBar`）。它是这一档**唯一**的视图切换入口，再点一次当前页的
    「会话」还能从详情退回列表。 */
function dnav(view, cnts){
  return `<div class="dnav">${DVIEWS.map(v=>dviewBtn('ni', v, view, cnts)).join('')}</div>`;
}
/** 64px 竖导（DesktopNavigation.kt 的 `NavigationRail`）。**Expanded 和 Medium 都画** ——
    `when (sizeClass)` 的这两个分支共用同一个 Row（DesktopShell.kt:504-509），
    并且它是这两个档位**唯一**的视图切换器：工具栏里那一排视图 chips 已经删掉了，
    理由就写在同一处（`:501-503`）。 */
function drawer(view, cnts){
  return `<div class="drawer">${DVIEWS.map(v=>dviewBtn('ri', v, view, cnts)).join('')}</div>`;
}
/* 桌面端外壳。dwin() 靠全局 curForm 决定 compact/medium/expanded 与宿主 chrome，
   所以画廊里同时画好几档时，和 device() 一样要把"这一格的档位"钉住。
   `d-home-more` 例外：那颗「更多」只在 Tablet 宿主上存在
   （桌面宿主 `overflowItems = emptyList()`），所以这一屏无论选哪一档都钉到 tabhost，
   否则用户切到「桌面·宽」会看到一颗代码里根本不画的按钮。 */
const HOST_OF_SCREEN = {'d-home-more':'tabhost'};
function win(screenKey, sizeKey){
  const key = HOST_OF_SCREEN[screenKey] || sizeKey;
  const s = SIZEOF[key] || SIZEOF.expanded;
  const prevS = curScreen, prevF = curForm;
  curScreen = screenKey; curForm = key;
  const body = SCREENFN[screenKey] ? SCREENFN[screenKey]() : '';
  curScreen = prevS; curForm = prevF;
  /* 独立小窗（截图窗 / 屏幕协助窗）不套 .win 外壳 —— 它们本身就是独立 BrowserWindow，
     套进去就成了"窗中窗"。所以这里直接把窗体原样吐出去。 */
  if (body.includes('class="floatwin"')) return body;
  const needMenubar = screenKey !== 'd-tray' && s.chrome !== 'tablet';
  const set = s.tier === 'settings' ? ' winset' : '';
  return `<div class="deskwrap">${needMenubar?menubar():''}
    <div class="win${set}" data-tier="${s.tier||'expanded'}" style="width:${s.w}px;height:${s.h}px">${body}</div>
  </div>`;
}
/* compact 下左栏整屏隐藏，右栏自带「列表」按钮点回列表 */
/** 桌面侧栏的行，逐字段照 `DesktopConversationsPane.kt:565-653`：
      ① **没有 Agent 标签** —— 那边靠头像区分（`PeerAvatar(..., conv.isAgent, ...)`），
         Agent 标签只出现在会话头部（`KindBadge`，`:367`）；
      ② 群的人在线数**接在预览后面同一行**（`" · " + chat_group_online`），
         不是单独一行 —— 两行都会 `maxLines = 1` 省略；
      ③ 未读是实心药丸（primary 底）而不是一个点。
         **排队徽标（secondaryContainer 底那颗「排队 N」）删了** —— 它和气泡底下那排
         投递态是同一件事的两种画法，气泡侧已经全套不画，这里再画一次就是重复。
         积压这件事只在会话顶部说一次（见下）。
    行内这些差异都得照实画，否则"两端结构分叉"这句话就没有可信的对照物。 */
function liRow(c, sel){
  const g = c.isGroup ? groupOf(c.convId.slice(6)) : null;
  const p = c.isGroup ? null : peerOf(c.convId);
  const av = g
    ? `<div class="av" style="background:#4A7C59">群</div>`
    : `<div class="av" style="background:${p?p.c:'#6E6E6E'}">${p?p.ini:'?'}${
        p?`<span class="p" style="background:${p.isAgent?'var(--agent)':(p.online?'var(--online)':'var(--on-2)')}"></span>`:''}</div>`;
  return `<div class="li ${g?'group':''}" ${sel?'aria-selected="true"':''}>
    ${av}
    <div class="bd"><div class="t1"><span class="ell">${c.title}</span></div>
      <div class="t2">${c.preview||'还没聊过'}${g?` · ${memberOnlineCount(g)}/${g.members.length} 人在线`:''}</div></div>
    <div class="rt"><span class="tm">${c.at}</span>
      ${c.unread?`<span class="ub">${c.unread}</span>`:''}</div>
  </div>`;
}

/* ============================ 聊天原子（两壳共用） ============================ */
/* 投递态（strings.xml 的 chat_delivery_* / ChatScreen.delivery.stateIcon()）**整套不画**：
   已送达 / 已排队 / 发送失败 / 重发，四条全是这条消息在"飞的路上"的样子，
   而原型的活是让人看清楚方案长什么样 —— 一条正在飞的证据，看完了也就那么回事，
   却要把每条消息底下都垫一行小字，读起来全是"状态"没有"话"。
   留着的只有**会话级**那句（顶部「还有 N 条等对方上线，会自动补发」），
   它说的是"这个会话有积压"这个稳定事实，不是某一条正在飞。
   机制本身并不丢：三处文字仍然讲 —— 会话顶的横幅、ci-runner 那句「它自己排着，
   等上线会补发」、以及 `m-set-data` / `d-transferlog` 里的落盘与传输记录。 */
/* 文件态 = strings.xml 的 file_state_*。state 取值：
   offered-in / offered-out / active-in / active-out / completed-in / completed-out /
   failed / declined。 */
const FSTATE = {
  'offered-in':   {label:'对方发来的文件，等你接收', tone:'',  accept:true},
  'offered-out':  {label:'已发出，等对方接收',       tone:''},
  'active-in':    {label:'正在接收 %1$d%',           tone:'',  bar:true},
  'active-out':   {label:'正在发送 %1$d%',           tone:'',  bar:true},
  'completed-in': {label:'已接收',                   tone:'ok'},
  'completed-out':{label:'已送达',                   tone:'ok'},
  'failed':       {label:'传输失败：%1$s',           tone:'err'},
  'declined':     {label:'对方已拒绝',               tone:''},
};
function fileCard(f){
  const st = FSTATE[f.state] || {};
  const pct = f.pct || 0;
  const label = (st.label||'').replace('%1$d', pct).replace('%1$s', f.reason||'连接中断');
  const icon = f.state === 'completed-in' && f.purpose === 'image' ? 'image'
             : (f.audio ? 'speaker' : 'file');
  const acts = [];
  if (f.state === 'offered-in') acts.push(`<button class="btn sm pri">接收</button>`,
                                          `<button class="btn sm">拒绝</button>`);
  if (f.state === 'completed-in') {
    if (f.audio) acts.push(`<button class="btn sm">${ic('speaker')} 播放</button>`);
    else acts.push(`<button class="btn sm">${ic('external')} 打开</button>`,
                   `<button class="btn sm">分享</button>`);
    if (f.tableText) acts.push(`<button class="btn sm">看表格文字</button>`);
  }
  if (f.state === 'active-out') acts.push(`<button class="btn sm">取消</button>`);
  return `<div class="filecard">
    <div class="fi">${ic(icon)}</div>
    <div style="flex:1;min-width:0">
      <div class="fn">${f.name}</div>
      <div class="fs">${f.meta||f.size}</div>
      ${pct?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}
      ${label?`<div class="fs${st.tone==='err'?' err':(st.tone==='ok'?' ok':'')}"
        style="${st.tone==='err'?'color:var(--on-error-c)':(st.tone==='ok'?'color:var(--on-ok-c)':'')}">${label}</div>`:''}
      ${f.saved?`<div class="fs mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">已存到 ${f.saved}</div>`:''}
      ${acts.length?`<div class="frow">${acts.join('')}</div>`:''}
    </div></div>`;
}
/** 一条消息。m.notice → 系统提示行；m.file → 文件气泡；否则文字气泡。 */
function msg(m){
  // 分隔条文案 = time.ts:26-33：同一天 HH:mm、跨天 YYYY-MM-DD HH:mm，没有「今天」。
  if (m.day)  return `<div class="daysep">${m.day}</div>`;
  if (m.notice) return `<div class="notice">${NOTICE[m.notice]}</div>`;
  const bub = m.file
    ? `<div class="bub bf">${fileCard(m.file)}</div>`
    : `<div class="bub">${m.text}</div>`;
  return `<div class="msg ${m.mine?'me':''}">
    ${m.ini?`<div class="mav" style="background:${m.c}">${m.ini}</div>`:''}
    <div class="col">
      ${m.sender?`<div class="sender">${m.sender}</div>`:''}
      ${bub}
    </div></div>`;
}
const msgsOf = list => list.map(msg).join('');

/* ============================ 移动端屏 ============================ */
/** 会话列表（提案）。列表上方**一块都不留** —— 顶栏 → 列表，两层。
    这一屏删掉的两块都在源码里逐个查过，理由都不是审美：

    **① 那条同步条（「已连接 · 4 个节点在线 / 同步」）在源码里根本不存在。**
    `SyncBar` 只有两个家：`NodesScreen.kt:210`（`mDNS 广播中 · UDP … / TCP …`）
    与桌面那几处 pane；`ConversationsScreen` 从 `LargeTitleBar` 一路到列表
    （`:185-353`）从头到尾没有它。原来这一条是从节点页抄过来的，
    所以删它**不需要动任何源码**。代价写清楚：连接状态此后只在「节点」页那一条上
    （手机端），桌面本来就在状态栏里（`desktop_status_connected`，
    `DesktopStatusBar.kt:87-96`）。
    若哪天要它回到消息页，最省的位置是顶栏副标题 ——
    那行现在只有「5 个会话 · 3 条未读」这点密度。

    **② 列表上方那条会话搜索框（placeholder「搜索会话」）也删了。**
    它在源码里是列表上方一条常驻 `OutlinedTextField`
    （`ConversationsScreen.kt:242-250`），**一个 `query` 喂两处**：
    本列表的 `filtered`（`:159-172`）和 `onSearchMessages`（`:294-300`，
    命中在列表尾巴上接成「聊天记录」一段，`:336-351`）。
    删的是**框**，不是那个能力：手机端此后只剩**一条**搜索入口 ——
    顶栏那颗放大镜 → 全局搜索（`m-gsearch`，联系人 / 聊天记录 / 文件整个库，
    与桌面 `SearchPanel` 同一份数据、同一套上限）。
    那两条本来都在源码里、范围也不重叠，问题是它们**在窄屏上并排**：
    一条在顶栏、一条在列表上方，用户分不清哪条搜哪儿 —— 这才是上一版
    来回搬家的根因；正解不是把谁搬到谁的位置，是**只留一条**。
    代价写明：**列表级"就地筛标题与预览"没有了**，按内容找会话要进全局搜索
    （多一次跳转，但范围更大）；列表上方只剩 `fchips` 那排种类 / 未读。
    这是**源码侧要改的**一条 —— 原型画的是提案，落地要动

    原来跟着这条框的那一屏「消息·搜索态」也随框删了：没有框，
    就没有"框里有值"这一态可画。

    实测（393×852）：这一屏的列表区 666px、**第一行距顶 216px**、行高 72px、
    行距 83.6px —— 5 条会话的末行底部落在 622px，离可视底（772px）还余 150px，
    全部在首屏。那条框让出来的是 **46px**（框本体 36px + 它底下那条 10px 外边距），
    262 → 216。**别把回收算成 54px**：框与第一行之间那 8px 是 `.rows`
    自己的上边距，不随谁走 —— 这一条上一次就差点写错，实测才发现。 */
function screenHomeRecent(filter = 'all'){
  const pending = CONVS.reduce((n,c)=>n+c.pendingCount,0);

  return `${topbar('消息', `${CONVS.length} 个会话 · ${totalWs} 个工作区 · ${totalUnread} 条未读，按最近活动排`,
      `<button class="ibtn" aria-label="全局搜索" onclick="go('m-gsearch')">${ic('search')}</button>
       ${moreBtn('m-home-more')}`)}
  <div class="scroll"><div class="pad">
    ${pending?`<div class="banner info" style="margin:0 0 16px">有 ${pending} 条消息还在等对方上线，会自动补发。</div>`:''}
    ${fchips(filter)}
    <div class="rows">
      ${feed.map(item => item.kind === 'conv' ? convRow(item.data) : inboxWsFeedRow(item.data)).join('')}
    </div>
    <div class="annot" style="margin:12px 0 0">
      <b>【混排时间流】工作区与普通会话在同一个列表混排展示。</b>
      <br/>工作区展示为单行轻量卡片（与工作区列表一致，不展开内部 session），高度与视觉规范对齐会话行，点击整行直接下钻到工作区详情。
      <br/>按最近活动时间倒序排序，有待处理审批的工作区优先置顶高亮展示。
      <br/>列表顶部提供快速筛选胶囊（全部 / 未读 / 工作区 / 群聊 / Agent / 同事），点按即就地过滤，无需切换多层硬 Tab。
    </div>
  </div></div>`;

/* 顶栏「更多」展开态。判据：`Common.kt:176-177` 明确写过

   而它只管这一节」。所以建群**只有在列表不再分节之后**才该搬到顶栏 ——

   这正是用户那两条直觉的连结点：**不混排，就没法把建群挪到右上角**。 */
function screenHomeMore(){
  return `${screenHomeRecent('all')}
  <div class="menu" style="top:calc(var(--status) + 56px);right:12px;min-width:190px">
    <div class="mi2">${ic('group')} 建群</div>

/* 「按类型过滤」：未读轴（含待审批工作区） */
function screenHomeUnread(){
  const feed = homeFeed('unread');
  const unreadCount = CONVS.reduce((a,c)=>a+c.unread,0) + inboxWsPending();
  return `${topbar('消息', `${feed.length} 个项目需处理 · 共 ${unreadCount} 项`,
      `<button class="ibtn" aria-label="全局搜索" onclick="go('m-gsearch')">${ic('search')}</button>

/** 全局搜索（手机）：顶栏那颗放大镜点开的样子。

    （联系人 / 聊天记录 / 文件）今天只有桌面有 —— `DesktopGlobalSearchPanel`
    挂在会话侧栏顶部那条搜索框上（`DesktopConversationsPane.kt:627`），
    `global_search_*` 那套字符串在 mobile 侧**没有任何调用点**。
    手机端源码里唯一的搜索是列表上方那条常驻框，走的是**另一套**：一个 `query`

    这一屏是**本轮之后移动端唯一的搜索入口**：提案把列表上方那条框删了
    （见「消息」那一屏的注释），只剩"应用级"这一条 —— 顶栏放大镜。
    落到源码上就是把 `DesktopGlobalSearchPanel` 这套搬到手机、`conv_*`
    那套列表级搜索退场；`m-home-search`（消息·搜索态）那一屏随框一起删了。

    三段的形状、上限（20 / 10 组 / 20）、「没有筛选器」、「命中不高亮」
    全部照桌面 SearchPanel（出处见 `d-search` 那一屏的注释），数据也共用同一份
    （`SEARCH_HITS` / `GS_CHATS` / `GS_FILES`）。

    **桌面原型漏了「联系人」段标题**：`screenDSearch` 原来只有「聊天记录」与
    「文件」两个 `.spsec`，而源码 `global_search_section_contacts` =「联系人」
    是有的（那段注释自己也写着"分组标题只有三个词"）。这一屏照源码画全三个，
    桌面那一屏同批补上。

    空态只有两行字（`global_search_empty` + `global_search_empty_hint`），
    **三个分组都空时它直接替掉整段**，不是每个分组各给一句 —— 源码就是这么写的。 */
function screenGSearch(query, empty){

  <div class="scroll"><div class="pad">
    ${empty
      ? `<div class="spph"><b>没有找到「${query}」相关的内容</b>

      : `<div class="spsec">联系人</div>

         <div class="spsec">聊天记录</div>
         ${GS_CHATS.map(o=>gscChat(o,'m-chat')).join('')}
         <div class="spsec">文件</div>

    <div class="annot" style="margin:14px 0 0">
      <b>三段不是三页，是一页里的三块</b> —— 与桌面那一屏是同一份数据、同一套上限
      （联系人 ≤20 / 聊天记录 ≤10 组 / 文件 ≤20），分组标题也只有
      「联系人 / 聊天记录 / 文件」三个词，没有数量徽标、没有筛选器。
      <br/>顶栏那一行装的是输入框而不是标题，但顶栏高度只由 padding 与

      （实测 97px，比列表态那 105.8px 还矮 8.8px）。
      <br/><b>这是移动端唯一的搜索入口</b>：它搜全库（跨会话的消息体、文件、
      联系人），而提案已经删掉了列表上方那条只管<b>标题与预览</b>的框 ——
      两条并排在窄屏上分不清哪条搜哪儿，所以只留范围更大的这条。
      上一版把范围小的那条搬到顶栏，等于让一个列表筛子去干全库搜索的活。
      <br/>「聊天记录」段一行是**一个会话**（「与 老周 的聊天 · 7 条相关」），

      点进去在会话内搜（<code>m-histsearch</code>）那套里看。
      <br/>命中**不高亮**：代码里没有 <code>mark</code>，跳过去是把那一条消息整条

      <br/>空态只有两行字（标题 + 一句提示），三个分组都空时它替掉整段 ——

/* 会话标签条（SessionTabStrip，切「跟谁聊」）已按产品判断移除：Agent 场景下不需要它。

   对齐 dsh「一个 workspace 下挂多个会话」的心智。源码 SessionTabStrip.kt 仍在，

/* 聊天页头部（`ChatHeader`）= ChatScreen.kt:615 的原结构：
   返回 + 头像(40) + [标题 + Agent 标签/在线离线 或 群的「x/y 人在线」] + 动作，
   副标题只有一行且会省略号，内容是 host:port · TCP n · 能力：…。
   手机端**没有**"输入区上方那条路由状态条" —— 路由状态在输入框下面那行小字里。
   （这一处的引用原先写成 440-530，指到消息列表那段去了 —— 头部真正的 `@Composable`
   是第 585 行的 `ChatHeader`，`:634-639` 是那颗 40dp 头像，已改正。）

   标题**两边同源**：表头是 `peer.displayName`（ChatScreen.kt:665；群取
   `groupPeer(group)?.displayName` 也就是群名，见 `:253`），药丸走
   `state.convTitle(id)`（NavChrome.kt:31-41，`:36` 那一行）—— 而 `convTitle` 的顺序
   正是「群名 → 对端昵称 → id 前缀」（`RelayUiState.kt:890-893`），前两级与表头同一个值。
   注意 `NavChrome.kt:24-29` 那段 KDoc 特意警告过**不要**直接用 `peer(id)?.displayName`：
   药丸上的 `id` 是会话键（群是 `group:<id>`），直接查节点表会显示成 `group:3a`。
   本次把对端的 displayName 从「Agent 式命名」改成工作区名「teahouse-mobile」——
   理由与来源标记见 README §10.10。头部只留 `Agent` 类型标签（协议 cap `ag1` 的标记，
   用来把人和其他对端与 agent 节点区分开），**不画来源标签**：393px 一行里塞不下
   名字 + 来源 + 类型 + 在线 + 两个动作，塞进去的结果是名字先被省略号吃掉。
   来源（DSH/CI）画在 Agent 控制台的工作区卡上。 */

/* 头部**下面**那条「会话」一行条（这个文件里的 `sessionBarHTML`，样式是 `.swbar`）——
   这一屏的核心切换，也是本轮照用户那句「一句话就可以」压出来的形态：
   一个工作区同时跑多个会话（就像 dsh 一个 workspace 下挂多个会话），
   条上只有**会话名**（协议 `agent-session.alias`，缺省退到 `sessionId`）+ 行尾的状态小字，
   点它打开居中对话框切到正在看的那条 —— 与 Agent 控制台共用 `sessionPickerHTML`，
   桌面聊天窗（`d-chat`）挂的是同一个组件，只有内缩量不同。

   这一段**故意不钉任何 Kotlin 行号**：`sessionBarHTML` / `sessionPickerHTML` 是原型
   自己的函数，把它们写在行号旁边会让 check-refs 把它们当成 Kotlin 侧的锚点符号，
   报出一片假的「漂移」。Kotlin 侧的出处统一写在上一个块里。

   `solo = true` 那一份专门给这一行条加说明，解释为什么不再有会话标签条。 */

/* 会话输入区的图标排。**两端共用这一份清单** —— 同一条会话，输入区该有什么，
   不该由画面大小决定。

   它原先是被手抄的：手机端 m-chat / m-chat-group / m-sendfolder 各写一份内联的，
   桌面端再抄一份（旧名 dtools），而 m-folderin 与 m-screencard 干脆没画 ——
   于是同一个手机壳里长出了「有排」和「没排」两种输入区（2026-10-10 修）。
   收成一个函数，这种漂移就没有第二个地方可以发生。

   清单与禁用理由逐条见文档说明：
   表情 · PK（单聊带猜拳/骰子浮层）· 窗口震动 · 截图 · 图片 · 文件 · 文件夹，
   历史搜索靠 tsep 撑到最右。

   两端只有两处不同，都收成参数：

   - histTo：手机进 m-histsearch，桌面进 d-histsearch。**这一条曾经是 bug** ——
     手机那两颗写的是 d-histsearch，在手机壳里点过去会把一个桌面窗口塞进手机里。
   - group：群**整项不画**窗口震动（震动要落到一个具体窗口上，群里没有单一收件人），
     腾出的位置给那句「仅在线群成员可接收图片/文件」。这跟图片/文件正好反着：
     那三个是「有这事，现在送不出去」（置灰留位），震动是「这事在群里不成立」（不画）。

   排布不在这里决定：手机端它贴着容器顶边（.composer > .tools），桌面端在浮起
   卡片顶边往下（.cmp .tools 那两条覆盖规则）。

   还有一处**参数之外**的取舍要写明白：会话内历史搜索在源码手机端是开在**头部**的
   （`onSearchHistory` 那颗 IconButton，`ChatScreen.kt:775-784`），而原型头部只留
   两颗动作 —— 393px 一行里塞不下更多（理由见 screenChat 的头部注释），所以它落到了
   这一排的右端。**同一个屏上只能有一颗**：m-sendfolder 顶栏原先还挂着同款放大镜，
   已删（那是同一件事的两个入口）。跨端看，这一条是原型与实现的一处已知偏差。 */
function toolsRow(group, histTo){
  const hist = `<button class="ibtn" aria-label="历史搜索" aria-haspopup="true" onclick="go('${histTo}')">${ic('search')}</button>`;
  return group
    ? `<button class="ibtn" aria-label="表情" aria-haspopup="true">${ic('smile')}</button>
       <button class="ibtn" aria-label="PK（猜拳 / 骰子）" title="在线的对端才有得玩">${ic('pk')}</button>
       <button class="ibtn" aria-label="截图（Ctrl+Alt+A）">${ic('scissors')}</button>
       <button class="ibtn" aria-label="发送图片" title="仅在线群成员可接收图片">${ic('image')}</button>
       <button class="ibtn" aria-label="发文件">${ic('clip')}</button>
       <button class="ibtn" aria-label="发送文件夹">${ic('folder')}</button>
       <span class="shint">仅在线群成员可接收图片/文件</span><span class="tsep"></span>
       ${hist}`
    : `<button class="ibtn" aria-label="表情" aria-haspopup="true">${ic('smile')}</button>
       <span style="position:relative"><button class="ibtn" aria-label="PK（猜拳 / 骰子）" title="在线的对端才有得玩" aria-haspopup="menu">${ic('pk')}</button>
       <div class="pop"><button class="pbtn">${ic('pk')}猜拳</button><button class="pbtn">${ic('pk')}骰子</button></div></span>
       <button class="ibtn" aria-label="窗口震动" title="单聊才发得出震动">${ic('nudge')}</button>
       <button class="ibtn" aria-label="截图（Ctrl+Alt+A）">${ic('scissors')}</button>
       <button class="ibtn" aria-label="发送图片" title="仅在线成员可接收图片">${ic('image')}</button>
       <button class="ibtn" aria-label="发文件">${ic('clip')}</button>
       <button class="ibtn" aria-label="发送文件夹">${ic('folder')}</button>
       <span class="tsep"></span>
       ${hist}`;
}

function screenChat(solo, moreOpen){
  // 这一屏就是「本机 Agent 那个工作区」的私聊（节点的 displayName 就是它的工作区名 ——
  // 见 README §10.10）。默认落点是 teahouse-mobile；从工作区详情的「打开聊天」进来时，
  // 落点由 chatWsPinned 指定，页头也跟着换成那个工作区的主人 —— 否则会出现
  //「标题写着 teahouse-mobile、内容却是 relay-tools」这种假话。
  const wi = chatWsPinned !== null ? chatWsPinned
                                  : WORKSPACES.findIndex(x => x.name === PEERS[0].nick);
  if (wi >= 0) wsIdx = wi;
  if (wsSessionIdx >= WORKSPACES[wsIdx].sessions.length) wsSessionIdx = 0;
  const w = WORKSPACES[wsIdx];
  const p = peerOf(w.agentNodeId) || PEERS[0];
  return `${topbar(p.nick,
      `${p.host}:${p.port} · TCP 17879 · 能力：${p.cap}`,

/** 「一个节点」的统一行 —— 手机与桌面共用同一份。
    设计取向：**实用 > 复杂**，以简洁为基准。
    行里只放普通人要看的三样：头像 + 昵称 + IP；第一行右端是「在线 / 离线」两点
    （不区分"握过手又掉"和"从来没通"—— 那是清理时才关心的工程细节，只用灰点带过）。

    简化点：
    - 「来源」副标题（局域网 / 手动添加）—— 用户关心"谁、在不在"，不关心怎么进来的；
    - 行尾 ⋯ 菜单 —— 管理动作不进主列表。

    点行 = **进这个节点的详情页**（手机 `m-nodedetail` 整屏 / 桌面右栏），不再直冲会话 ——
    点节点先进详情（大头像 + 备注 + 设备信息 + 发消息），
    而不是直接开聊。详情页里才有「发消息」入口。
    列表里昵称优先显示「备注」（`p.remark || p.nick`）—— 重名时靠备注区分。

    实测（393×852，2026-10-13 模型修正后重测）：行高 **67px**，节点页内容 **731.5px**，
    8 个节点首屏全部可见；行尾那颗「打开聊天」按钮没有把行撑高（它比两行文字矮）。 */
/* 节点列表的一行 = **一个节点 = 一台设备**（协议 D6：`nodeId` 就是一台设备的节点身份）。
   一个节点上可以有**多个 agent**（`agentId ?? agentKind`），所以副行在 agent 数 >1 时
   改写成「N 个 Agent · 平台」，只有一个 agent（或一个都没有）时保持地址样式。
   归组只认 `nodeId` 与 agent 身份键 —— **绝不拿 hostName / 平台 / IP 猜同机**：
   同一台设备上可以有好几个 agent，而好几台设备也可能用着同一个主机名（夹具里
   `teahouse-mobile` 与 `小码的工位` 都叫 `relay-agent`，正是这条的反面教材）。

   「打开聊天」**留在这条节点行上**：它是 per-nodeId（= 每台设备）的动作，点它进的是与
   这台设备的会话；「这台设备上有谁」由详情页的 Agent 区回答，agent 行本身不给发消息、
   也不承载备注。按钮在行内要 `event.stopPropagation()`，否则会连行一起触发进详情。 */
function nodeRow(g, mob){
  const p = g.prim;
  const dot = g.online ? 'var(--online)' : (g.never ? 'var(--error)' : 'var(--on-2)');
  const state = g.never ? '没有回应' : (g.online ? '在线' : '离线');
  const name = g.name;
  const sub = g.agentCount > 1 ? `${g.agentCount} 个 Agent · ${g.plat}`
                               : `${p.host}:${p.port}`;
  const open = mob ? ` onclick="selNode='${p.nodeId}';go('m-nodedetail')"` : '';
  const chat = mob ? `<div class="rt"><button class="btn sm" ${
      g.never ? 'disabled aria-disabled="true"'
              : `onclick="event.stopPropagation();go('m-chat')"`}>${ic('chat')} 打开聊天</button></div>` : '';
  return `<div class="row"${open}>
    <div class="av" style="background:${p.c}">${p.ini}<span class="p" style="background:${dot}"></span></div>
    <div class="bd">
      <div class="t1 spread"><span class="ell">${name}</span>${
        g.agentCount?'<span class="tag agent">Agent</span>':''}<span class="st${
        g.never?' err':''}">${state}</span></div>
      <div class="t2 mono">${sub}</div>
    </div>
    ${chat}
  </div>`;
}
/* 节点详情页的正文（手机整屏 / 桌面右栏共用同一份）：
   大头像 + 在线药丸 + 「未分组」标签；「备注」可编辑（保存后列表优先显示备注）；
   「详细信息」给 最近 / IP / 主机 / 平台；底部一颗「发消息」。
   「没有回应」的死地址仍给详情（让用户看清楚它死了），但「发消息」禁用。 */
/* 「Agent」区里的一行 = 这台设备上的一个 Agent。身份键是 `nodeId`（R6），
   `agentKind` 只当徽标 —— 它是个开放的标签集合，不参与归组、不参与取名。
   一个还没宣告过任何会话的 Agent，第二行不写「0 个工作区 · 0 个会话」那种空账，
   写「尚未收到会话宣告」：那是"对端还没说话"，不是"它什么都没有"。 */
/* 「Agent」区里的一行 = **这个节点上的一个 agent**（协议 D6）。身份键 = `agentId ?? agentKind`，
   **主名就是身份键本身**；只有在 `agentId` 存在时才另给一枚 `agentKind` 类型徽标 ——
   没有 `agentId` 时主名已经回落到 `agentKind`，再印一枚同样的徽标是白印一遍。
   两个键都缺时主名是「未上报类型」（不猜，也不印 `ag1` / `tw1` 这类 wire 键）。
   一个还没宣告过任何会话的 agent，第二行不写「0 个工作区 · 0 个会话」那种空账，
   写「尚未收到会话宣告」：那是"对端还没说话"，不是"它什么都没有"。 */
function agentRowHTML(a){
  const p = peerOf(a.nodeId);
  const ss = sessionsOfAgent(a.nodeId, a.key);
  const last = ss.map(s=>s.updatedAt).filter(Boolean)[0];
  const meta = ss.length
    ? `${wssOfAgent(a.nodeId, a.key).length} 个工作区 · ${ss.length} 个会话${last?` · 最近活动 ${last}`:''}`
    : '尚未收到会话宣告';
  return `<div class="krow" onclick="openAgentOf('${a.nodeId}','${a.key}')">
    <span class="av" style="width:14px;height:14px;background:${
      p.online ? 'var(--online)' : (p.never ? 'var(--error)' : 'var(--on-2)')}"></span>
    <div class="bd">
      <div class="t1 title1"><span class="ell">${a.key}</span>${
        a.agentId && a.agentKind ? `<span class="tag sm">${a.agentKind}</span>` : ''}</div>
      <div class="t2">${meta}</div>
    </div>
    <div class="rt">${ic('chev')}</div>
  </div>`;
}
function nodeDetailBody(p){
  const name = p.remark || p.nick;
  const dot = p.online ? 'var(--online)' : (p.never ? 'var(--error)' : 'var(--on-2)');
  const state = p.never ? '没有回应' : (p.online ? '在线' : '离线');
  const ls = p.lastSeen === 0 ? '刚刚' : p.lastSeen;
  /* 这个节点上的 agent 清单（协议 D6：节点 = 设备，agent 键 = `agentId ?? agentKind`）。
     只有声明 `ag1` 的节点才画这一区：一个只会传文件的同事电脑没有 agent 可言。
     声明了 `ag1` 却一条帧都没有的节点会得到一个「未上报类型」的降级档 —— 那不是编的。 */
  const ags = agentsOfNode(p.nodeId);
  return `<div class="pad">
    <div class="ndhead">
      <div class="av xl" style="background:${p.c}">${p.ini}<span class="p" style="background:${dot}"></span></div>
      <div class="ndmeta">

          ags.length?'<span class="tag agent">Agent</span>':''}</div>

          '<span class="tag muted">未分组</span>'}</div>
      </div>
    </div>

    <div class="card"><div class="padc">
      <div class="grphead sm">备注</div>
      <div class="hint" style="margin:0 0 8px">仅自己可见，重名时好认</div>

      <button class="btn sm" style="margin-top:8px" onclick="saveRemark('${p.nodeId}')">${ic('save')} 保存备注</button>
    </div></div>

    <div class="card"><div class="padc">
      <div class="grphead sm">详细信息</div>
      <div class="kv"><span class="k">最近</span><span class="v">${ls}</span></div>
      <div class="kv"><span class="k">地址</span><span class="v mono">${p.host}:${p.port}</span></div>
      <div class="kv"><span class="k">能力</span><span class="v">${capWords(p.cap)}</span></div>
      <div class="kv"><span class="k">节点 ID</span><span class="v mono" title="${uuidOf(p.nodeId)}">${p.nodeId}</span></div>
    </div></div>

    ${ags.length ? `
    <div class="card"><div class="padc">
      <div class="grphead sm">Agent<span class="cnt">${ags.length}</span></div>
      ${ags.map(agentRowHTML).join('')}
    </div></div>` : ''}

    <button class="btn block pri" style="margin-top:14px" ${
      p.never?'disabled aria-disabled="true"':`onclick="go('m-chat')"`}>${ic('chat')} 发消息</button>
    ${p.never?`<div class="hint" style="text-align:center;margin-top:8px">这条地址从未连通过，先确认网络再发消息。</div>`:''}
  </div>`;
}
/* 手机端「节点详情」整屏。返回键回到节点列表。 */

/* 备注保存：写回 PEERS 数据并重绘，列表与详情即刻优先显示备注。原型里这是真生效的。 */

/** 节点列表的排序键：在线 → 离线 → 没有回应。同一档内按昵称排（稳定、可预期）。
    这是**列表内部**的顺序，不是分组 —— 不再画「局域网发现 / 已保存」那两个节标题，
    因为那两个词回答的是"它怎么进来的"，而用户在这一页要回答的是"谁现在能用"。
    `nodeRank(组)` 用的就是上面 `nodeGroups()` 造出来的那一份（`allNodes()`）。 */
/* 2026-10-12：节点页不再画「本机」卡（地址 / 发现方式 / 状态 / 节点 ID 都是开发层
   plumbing，普通用户在节点列表用不到；本机身份改由「我的二维码」入口承担）。 */
function screenNodes(){
  /* 这一屏列的**是节点 = 设备**（协议 D6）：节点键就是 `nodeId`，一台设备一行。

  const devs = allNodes();

  return `${topbar('节点', `${devs.length} 台设备 · ${online} 在线${

/** 添加节点：**底部弹层**，不是第二个页面（这就是「发现/加入看起来重复」的那个修法）。

      </div><div class="cardfoot"><button class="btn sm">扫不到？回节点页填地址</button>

/* Agent 控制台。与旧稿的差别：这里不是自造的事件流，而是

/* 会话切换浮层（对齐源码 AgentSessionPickerDialog）。sessions 只有 1 个时不渲染，
   因为那是个死控件；切工作区 (pickWorkspace) 与切会话 (pickSession) 都走
   go(curScreen) 整屏重绘，选中后浮层随屏重画自然消失。

   **一行一条，只有两样东西：会话名 + 右侧状态。**
   这是「看一个 workspace 下挂了哪些线程」的视角，不是详情页 —— 名字够定位、
   状态够判断要不要切过去，多一个字都是噪音。所以：
   - 会话标题 `title` 不进列表（协议里有这个字段，见 README §10.10；但它属于「详情」，
     留在数据里、以 `title=""` 悬停提示兜住，不进这一屏）；
   - 「N 条事件」也不进（那是控制台事件流的事，不是选线程要看的）；
   - 唯一的例外是 `announced === false`（只收到事件、没收到会话宣告）—— 那是**坏状态**，
     不是冗余信息，必须让用户看见，所以留一行红字。

   状态取色同源码 SessionStateLabel（见 STATE_TONE），勾在**行首**、只标当前项，
   但每行都占住勾位（见 `.pickrow .ck` 的注释 —— 这里偏离了源码，为了让名字左对齐）。 */
function sessionPickerHTML(w){
  if (w.sessions.length <= 1) return '';
  return `<div class="dialog pickz" id="aspick" onclick="closeSessionPicker()">
    <div class="dlg" onclick="event.stopPropagation()">
      <h2>切换会话</h2>
      <div class="dbody">
        ${w.sessions.map((ss,j)=>{
          const on = j === wsSessionIdx;
          const nm = ss.alias || ss.sessionId;
          return `<div class="pickwrap">
            <div class="pickrow" role="button" ${on?'aria-current="true"':''}
              title="${ss.title||nm}" onclick="pickSession(${j})">
              <span class="ck">${on?ic('check'):''}</span>
              <span class="al">${nm}</span>
              ${pcountHTML(pendingOf(ss.sessionId))}
              ${stateLabelHTML(ss.state)}
            </div>
            ${ss.announced === false?`<div class="ms">只收到事件，没收到会话宣告</div>`:''}
          </div>`;
        }).join('')}
      </div>
      <div class="acts"><button class="btn" onclick="closeSessionPicker()">关闭</button></div>
    </div>
