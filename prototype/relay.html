<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>捎话 Tidings · 合并原型（移动端 + 桌面端）</title>
<style>
/* ============================================================================
   捎话 Tidings · 合并原型（v5）
   ----------------------------------------------------------------------------
   一份文件同时承载「移动端」与「桌面端」两套外壳，共享 token、数据与组件原子。

   为什么要合：两份旧稿（index.html / desktop/index.html）各自抄了一份 token 与
   数据，而且已经漂移 —— 桌面稿停在 2026-10-06，移动稿走到了 10-07；而新增的
   群、撤回/戳一碰、文件气泡状态必须在两端同时成立，分成两份就必然只改一边。

   权威源（按优先级）：
     1. scaffold/composeApp/src/commonMain/composeResources/values/strings.xml
        —— 所有用户可见文案，逐字照抄，不自己造句
     2. scaffold 的 Compose 代码
        （Color.kt / SectionCard.kt / ChatScreen.kt / ConversationsScreen.kt /
         GroupCreateDialog.kt / RelayUiState.kt / DesktopPreferences.kt）
     3. design/design-spec.json（较旧，2026-10-04 已向代码收敛）

   两端字号/密度/圆角不同：组件只写一次，具体值走 CSS 变量，由 .device / .win
   各自给一份。改组件不用记得改两处。
   ============================================================================ */

/* ---------------------------------------------------------------- 1. tokens */
/* 色值权威源 = ui/theme/Color.kt 的 RelayLightColors / RelayDarkColors。
   标注「仅原型」= Compose 无对应 token，按原型视觉保留。
   --online/--queued/--error 在代码里是**填充色**；11–12px 小字必须用
   --on-ok-c/--on-queued-c/--on-error-c（onPrimaryContainer / onSecondaryContainer /
   onErrorContainer），否则对比度只有 1.6–3.4:1。 */
:root{
  --primary:#2D6A4F; --on-primary:#FFFFFF; --primary-c:#B7E4C7; --on-primary-c:#1B4332;
  --agent:#6B4EE6; --agent-c:#E6E0FB; --agent-t:#5333C9; /* 仅原型；--agent-t 给 10px 小字 */
  --bg:#FAFAF8; --surface:#FFFFFF; --surface-2:#F0EFE9; --surface-3:#E4E9E7; /* 仅原型 */
  --on:#1A1C1A; --on-2:#5C5F5C; --outline:#D4D4D0;
  --error:#E63946; --error-c:#FFDAD6; --on-error-c:#93000A;
  /* 计数徽标（.nav .dot / .ibtn .b）是**实心红底 + 白字**，10px 粗体。
     `--error` 直接当底色时白字只有 4.17:1 —— 差一点，所以另给一对：
     底色再深一档到 5.5:1，且深色主题下必须翻成「浅底 + 深字」（见下）。 */
  --badge:#C1341F; --on-badge:#FFFFFF;
  --online:#2E9E5B; --queued:#E9C46A; /* 仅原型：填充 / 圆点 */
  --queued-c:#F5E6D3; --on-queued-c:#5C3D1E; --on-ok-c:#1B4332;
  --bubble-mine:#B7E4C7; --bubble-peer:#F0EFE9;
  --window:#FFFFFF;        /* 系统窗口背景：edge-to-edge 正确时永远不可见 */
  --sysbar:#E9EBEA;        /* 旧实现漏画的系统栏颜色（仅对照模式可见） */
  --nav-bg:rgba(255,255,255,.92);
  --hair:rgba(0,0,0,.07);
  --shadow:0 1px 2px rgba(16,24,20,.05),0 8px 24px rgba(16,24,20,.06);
  --shadow-pop:0 2px 6px rgba(16,24,20,.10),0 14px 34px rgba(16,24,20,.18);
  --menubar-bg:#E4E7E6; /* 仅原型 */ --chrome-bg:#101413;
  --drop-bg:rgba(45,106,79,.07);
  --r-chip:999px; --r-sheet:28px;
  /* 移动端默认（桌面端在 .win 里覆盖） */
  --fs-body:14px; --fs-bub:14px; --r-card:16px; --r-bubble:12px; --r-ctl:12px;
  --padc:10px 14px 14px; --kv-k:118px; --fs-ctitle:12px; --fs-btn:14px;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace; /* 2026-10-15 补声明：此前被 var() 引用却从未定义 */
  --pad-row:11px 14px;   /* 卡片里「一行」的内边距（审批 / 队列 / 事件这类列表行） */
  --pad-btn:9px 14px; --fs-hint:11px; --msg-max:82%; --fs-row1:14px; --fs-row2:12px;
  --status:44px; --nav-h:60px; --inset-b:20px;
  --menubar:26px; --titlebar:40px; --toolbar:46px; --statusbar:26px; --side:300px;
}
html[data-theme="dark"]{
  --primary:#74C69D; --on-primary:#003826; --primary-c:#1B4332; --on-primary-c:#B7E4C7;
  --agent:#B9A6FF; --agent-c:#312A52;
  /* --agent-t 是**小字档**（10px 的「Agent」标签压在同色容器上）。浅色主题下它是"更深的紫"，
     深色主题下必须跟着翻成"更浅的紫" —— 漏了这一行，10px 标签在深色里只有 1.7:1。
     两档都不是白/黑，是因为要在 --agent-c 上过 4.5:1：浅色 6.1:1、深色 7.6:1。 */
  --agent-t:#C9BCFF;
  --bg:#121413; --surface:#1E201F; --surface-2:#2A2C2B; --surface-3:#2B3331;
  --on:#E8E8E6; --on-2:#ADB0AD; --outline:#3A3C3B;
  /* 深色下 --error 本身是浅粉（它当线条/圆点用），白字压上去只有 1.7:1 —— 徽标必须整对翻过来。 */
  --error:#FFB4AB; --error-c:#93000A; --on-error-c:#FFDAD6;
  --badge:#FFB4AB; --on-badge:#5C0011;
  --online:#6FD69A; --queued:#E3B75A; /* 仅原型 */
  --queued-c:#5C3D1E; --on-queued-c:#F5E6D3; --on-ok-c:#B7E4C7;
  --bubble-mine:#1B4332; --bubble-peer:#2A2C2B;
  --window:#000000; --sysbar:#111413; --nav-bg:rgba(30,32,31,.92);
  --menubar-bg:#1B211F; /* 仅原型 */
  --drop-bg:rgba(116,198,157,.09);
  --hair:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-pop:0 2px 6px rgba(0,0,0,.45),0 14px 34px rgba(0,0,0,.6);
}

/* ------------------------------------------------------- 2. 全局重置与排版 */
*{box-sizing:border-box;margin:0;padding:0}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
body{font:14px/1.5 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--window);color:var(--on);-webkit-font-smoothing:antialiased}
/* `color:inherit` 不是可选项：Chrome 的 UA 样式给 <button> 定的是 `color:buttontext`（黑），
   它**不继承**主题色。深色主题下凡是没显式写 color 的按钮（如 `.entry`「扫码连接手机」）
   就是黑字压深底，实测 1.28:1。同理 <select> 也吃 UA 默认色。
   （`input`/`textarea` 的正文色另有 UA 默认，但稿子里这两类都由 `.inp`/`.box textarea` 显式给色。） */
button,select{font:inherit;color:inherit}

/* ------------------------------------------------------------ 3. 原型控制条 */
#chrome{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px 16px;background:var(--chrome-bg);color:#E7ECEA;border-bottom:1px solid #26302D;font-size:12px}
#chrome b{font-size:14px;letter-spacing:.02em}
#chrome .sep{width:1px;height:18px;background:#2E3835}
#chrome .lbl{color:#8C9A96;font-size:11px;letter-spacing:.04em}
#stage{padding:24px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:24px}
body[data-bare="1"] #chrome{display:none}
/* bare 模式（截图/验收用）连设计批注一起隐藏：`.annot` 是给**读稿子的人**看的依据说明，
   真机界面上永远不会出现。之前它没被隐藏，验收帧里就混进了整段 rationale
   （d25-resume 右栏那一大块），并排签收时容易被误读成"界面缺了这块内容"。
   2026-10-15 审查 P2-9 的处置。 */
body[data-bare="1"] .annot{display:none}

/* ── 命中区 ≥44×44（2026-10-15 审查 P1-7）──────────────────────────────
   视觉尺寸**不变**，透明伪元素把可点范围扩到 iOS HIG 的 44pt（Android 是 48dp，
   桌面鼠标另有 24px 一档；取 44 是两平台都能接受的下限，落地时 Compose 侧
   用 MinimumInteractiveSize / touchTarget 抬到 48）。
   判据：`.clr` 18 / `.avedit-c` 24 / `.ibtn` 28·30·34 / `.ebtn` `.lamp` `.asi` 30 /
   `.capbtn` `.fi` `.fi2` 32 / `.more-btn` `.send` 38 / `.sw` 42×24·44×26 ——
   全部小于 44。`.send` 与 `.more-btn` 是最常按的两颗。
   规则：**视觉尺寸≠命中尺寸**，改交互件时只许动伪元素不许动本体。
   相邻件间距 <44 时热区会互相叠压，DOM 序靠后的盖在上面 —— 稿子层面可接受，
   真机落地按各端框架的 touch slop 处理。位置类（.clr/.lamp/.ibtn/.sw/.avedit-c）
   本体已 positioned，伪元素直接可用；静态类补 position:relative（不影响布局）。 */
.ebtn,.asi,.fi2,.capbtn,.fi,.more-btn,.send{position:relative}
.clr::before,.avedit-c::before,.ibtn::before,.ebtn::before,.lamp::before,.asi::before,
.fi2::before,.capbtn::before,.fi::before,.more-btn::before,.send::before,.sw::before{
  content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;min-width:100%;min-height:100%}
body[data-bare="1"] #stage{padding:0;gap:0;display:block}
body[data-bare="1"]{background:var(--bg)}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button.c{padding:5px 10px;border:1px solid #2E3835;background:transparent;color:#C6D0CD;border-radius:8px;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px}
button.c svg{width:13px;height:13px}
button.c[aria-pressed="true"]{background:#B7E4C7;border-color:#B7E4C7;color:#1B4332;font-weight:600}
.caption{font-size:12px;color:var(--on-2);text-align:center;max-width:660px;line-height:1.6}

/* ============================ 4. 共用原子 ============================ */
/* 卡片 */
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.card>h3{font-size:var(--fs-ctitle);font-weight:600;color:var(--primary);padding:12px 14px 0;
  display:flex;align-items:center;gap:6px;letter-spacing:0}
.win .card>h3{padding:11px 13px 0;letter-spacing:.04em}
.card>h3 svg{width:14px;height:14px}
.card>h3 .r{margin-left:auto;color:var(--on-2);font-weight:500;font-size:11px;letter-spacing:0}
.card>h3 .a{margin-left:auto;color:var(--primary);font-weight:600;font-size:11px;cursor:pointer;letter-spacing:0}
.card .padc{padding:var(--padc)}
/* 卡片底部的动作条：动作右对齐，不再让一个全宽绿块独占卡片底部 */
.cardfoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;
  border-top:1px solid var(--hair);background:var(--surface)}
.cardfoot .btn{min-width:0}
/* 卡内状态条 */

/* 分组标题 */
.grphead{display:flex;align-items:center;gap:8px;padding:14px 4px 6px;font-size:11px;
  color:var(--on-2);font-weight:600;letter-spacing:.04em}
.win .grphead{padding:12px 3px 5px;font-size:11px;letter-spacing:.06em}
.grphead .cnt{margin-left:auto;font-weight:500;opacity:.85;flex:none;white-space:nowrap}
.grphead .act{color:var(--primary);font-weight:600;cursor:pointer;letter-spacing:0}

/* 行（移动端**会话**行）。
   一行就是一张 Surface：代码里 `ConversationRow` 自己是一个 `Surface`
   （`surface` + `shapes.medium` + `tonalElevation = Card`，`ConversationsScreen.kt:358-366`），
   LazyColumn 用 `spacedBy(8.dp)` 把它们排开（`:328`）。所以这里没有"卡里连排的一叠行"、
   也没有那条分隔线 —— 行与行之间是 8px 空隙，各自带自己的圆角与投影。
   行内 `spacedBy(16.dp)`、左右 16 / 上下 12（`:330-332`）、头像 48dp（`:339`）。 */
.rows{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.row{display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--surface);
  border-radius:var(--r-card);box-shadow:var(--shadow);cursor:pointer}
/* 头像本身：`PeerAvatar` 默认是 40dp + CircleShape
   （`Common.kt:143-146` 是签名与默认值、`:167-170` 是 `.background(background, CircleShape)`），
   会话行显式传 48dp（`ConversationsScreen.kt:377`）。字号按代码的比例走
   （首字 = size × 0.42，见 `Common.kt:200`；动物是 × 0.47，`:190`）；agent / 群在代码里画的是图标，
   原型简化成一个字，不改这一条。 */
/* 头像的基础样式挂在 `.av` 上，不挂在 `.row .av` 上：`.krow`（列表项，不是 Surface）
   里也有头像（添加节点两行、Agent 那行），规则只认 `.row` 的话它们就是一个装着首字的
   普通块 —— 量出来是 12.5×21，在线点连 absolute 都不生效。
   `.li .av` / `.dhead .av` / `.hav` / `.pav` / `.mav` 特异性更高，各自照旧。 */
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;
  color:#fff;font-size:16px;font-weight:600;position:relative}
.row.conv .av{width:48px;height:48px;font-size:16px}
/* 在线点的白圈是一块 14dp 的 surface **垫在点下面**（`ConversationsScreen.kt:385-391`：
   `size(14.dp).background(surface, CircleShape)` 里再放 `StatusDot`），不是给点加边框 ——
   点直接压在彩色头像上，得有一圈底色把它从头像里裁出来。 */
.av .p{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;
  box-sizing:border-box;border:2px solid var(--surface)}
.row .bd{flex:1;min-width:0}
.row .t1{font-size:var(--fs-row1);font-weight:600;display:flex;align-items:center;gap:8px}
.row .t1 .ell,.krow .t1 .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t2{font-size:var(--fs-row2);color:var(--on-2);margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 全文检索命中的那一行，摘要**可以占两行** —— 照 `maxLines` 那个值
   （`ConversationsScreen.kt:516`）写的。会话行的预览是恒一行的，
   两者不能共用同一条规则，所以单独开一个 `.two`。 */
.row .t2.two{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .t3{font-size:11px;color:var(--on-2);opacity:.8;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 统一节点行：状态文字挂在**第一行右端**，第二行留给「地址 · 来源」。
   上一版状态单独占第三行（`.t3`），三行 93px；现在两行 72px。
   `.st` 用 margin-left:auto 顶到右端；`.t1.spread` 上的 `.ell` 收 `min-width:0`
   才能在窄屏真正截断（不收的话它按内容宽度撑着，会把 `.st` 挤出卡外）。 */
.row .t1 .st{margin-left:auto;flex:none;font-weight:400;font-size:11px;
  color:var(--on-2);display:inline-flex;align-items:center;gap:3px}
.row .t1 .st svg{width:11px;height:11px}
.row .t1 .st.err{color:var(--on-error-c)}
.row .t1.spread .ell{min-width:0;flex:1}
.row .rt{flex:none;text-align:right;display:grid;gap:8px;justify-items:end}
.row .tm{font-size:11px;color:var(--on-2)}
.row.unread .t1::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none}
.row.unread .t2{color:var(--on);font-weight:500}
/* 关不掉的行：整行不再是手型 */
.row.dis{cursor:default}
/* 群行：没有在线圆点，用一行「x/y 人在线」代替（在线是个数，不是一个布尔） */
.row .tgroup{font-size:11px;color:var(--on-2);margin-top:2px}
/* 带 `.ell` 的标题行必须是 flex：flex 子项会自动块化，省略号才生效。
   行内盒上的 `overflow:hidden` / `text-overflow:ellipsis` 一律无效，
   `.row .t1` 已经是 flex，`.krow` 里这一行要单配（探针就是在这里报出盒高 0 的）。 */
.t1.title1{display:flex;align-items:center;gap:8px;min-width:0}
/* 设置里的键值行不是 Surface，是列表项：保留分隔线，不要圆角与投影。 */
.krow{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);
  border-bottom:1px solid var(--hair)}
/* .bd 与 .row 同款：不收 min-width 就会被长标题撑开，把右侧 .rt 推出卡外（探针 clip-x）。 */
.krow .bd{flex:1;min-width:0}
/* t2/t3 与 .row 同款。原来 .krow 只配了 .t1（:168）和 .t1 .ell（:152），
   t2/t3 是**裸 div** —— 副标题退回正文的字号与颜色，和标题打架、三行糊成一片。
   探针只看几何不看字号，所以这个缺口一直没被抓住，是目检抓到的。 */
.krow .t2{font-size:var(--fs-row2);color:var(--on-2);margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.krow .t3{font-size:11px;color:var(--on-2);opacity:.85;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 会话切换：**一行**。它是**切换器**不是**信息卡** —— 会话的标题、运行时、更新时间在弹层里
   逐条给全（对齐源码 AgentSessionCard 的字段），没必要时时刻刻占三行。dsh 的 workspace 下
   切线程也是这个量级，所以两端都压成一行。 */
.xlbl{font-size:11px;font-weight:400;color:var(--on-2);flex:none}
.swbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;
  background:var(--surface);border-bottom:1px solid var(--hair)}
.swbar.on{cursor:pointer}
/* 桌面聊天窗里那一条：内缩量对齐 .dhead 的 18px（手机是 14px，跟着 .pad 走）。 */
.swbar.d{padding:9px 16px}
.swbar .nm{flex:1;min-width:0;font-size:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swbar .rt{flex:none;color:var(--on-2);display:grid;place-items:center}
.swbar .rt svg{width:16px;height:16px}
.krow:last-child{border-bottom:0}
.krow.dis{cursor:default}
.krow.dis .t1{color:var(--on-2)}

/* ===== 工作区看板与会话卡片（对齐 dsh Workspace / Session 看板心智） ===== */
.ws-block{margin-bottom:16px}
.ws-head{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px;font-size:12px;font-weight:600;color:var(--on)}
.ws-head .title{display:flex;align-items:center;gap:6px}
.ws-head .path{font-size:11px;font-weight:400;color:var(--on-2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.session-list{display:flex;flex-direction:column;gap:8px}
.session-card{background:var(--surface);border-radius:var(--r-card);border:1px solid var(--hair);padding:10px 12px;cursor:pointer;display:block;text-decoration:none;color:inherit;transition:background .15s}
.session-card:active{background:var(--surface-2)}
.session-card .head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.session-card .name{font-size:14px;font-weight:600;color:var(--on);display:flex;align-items:center;gap:6px;min-width:0}
.session-card .state{flex:none}
.session-card .summary{font-size:12px;color:var(--on-2);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-card .foot{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--on-2);margin-top:4px}
.session-card .foot .chev{display:flex;align-items:center;color:var(--on-2)}
.session-pending-bar{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:6px;font-size:11px;background:var(--queued-c);color:var(--on-queued-c);font-weight:600}
.session-warn-bar{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:6px;font-size:11px;background:var(--error-c);color:var(--on-error-c);margin-top:4px}
.session-expand-row{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 12px;font-size:12px;color:var(--primary);font-weight:600;background:var(--surface);border-radius:var(--r-card);border:1px dashed var(--outline);cursor:pointer;margin-top:4px}
.session-expand-row:active{background:var(--surface-2)}

/* ===== 共享文件柜（照桌面版 CabinetPane 的结构，三档权限见 cabinet.ts:27-31） ===== */
.cbx{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--outline);flex:none;
  display:grid;place-items:center;color:transparent}
.cbx.on{background:var(--primary);border-color:var(--primary);color:#fff}
.cbread{display:flex;align-items:center;gap:2px;padding:6px 14px;min-height:38px;
  border-bottom:1px solid var(--hair);font-size:14px;overflow-x:auto;scrollbar-width:none}
.cbread::-webkit-scrollbar{display:none}
.cbread .seg{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:8px;
  cursor:pointer;white-space:nowrap;color:var(--on-2)}
.cbread .seg:hover{background:var(--surface-2)}
.cbread .seg.cur{color:var(--on);font-weight:600;cursor:default}
.cbread .seg.cur:hover{background:none}
.cbread svg{width:12px;height:12px;opacity:.55}
.cbseg{display:inline-flex;gap:2px;background:var(--surface-2);border-radius:12px;padding:3px}
.cbchip{padding:5px 11px;border-radius:8px;font-size:12px;cursor:pointer;color:var(--on-2);
  white-space:nowrap}
.cbchip.on{background:var(--surface);color:var(--on);font-weight:600;--shadow:0 1px 2px rgba(16,24,20,.12)}
.cbfrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--hair);
  background:var(--surface);cursor:default}
.cbfrow:last-child{border-bottom:0}
.cbfrow .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbfrow .sz,.cbfrow .tm{font-size:11px;color:var(--on-2);flex:none;font-variant-numeric:tabular-nums}
.cbfrow .tm{display:none}
.cbfrow.dir .nm{font-weight:600}
.cbfrow.sel{background:var(--primary-c)}
.cbfrow.sel .nm{color:var(--on-primary-c)}
.cbfhead{display:flex;gap:10px;padding:6px 14px;border-bottom:1px solid var(--hair);font-size:11px;
  color:var(--on-2)}
.cbfhead span:nth-child(2){width:62px;text-align:right;flex:none}
.cbfhead span:nth-child(3){width:74px;text-align:right;flex:none}
.cbfpen{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--hair);
  font-size:14px;background:var(--surface)}
.cbfpen:last-child{border-bottom:0}
.cbfpen .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-size:11px;font-weight:600;color:#fff}
.cbfpen .who{flex:1;min-width:0}
.cbfpen .perm{font-size:11px;color:var(--on-primary-c)}
.cbfpen .ix{opacity:.45}
.cbfpen:hover .ix{opacity:1}
.cbhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--hair)}
.cbhead .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:var(--surface-2);color:var(--on-2)}
.cbhead h2{font-size:14px;font-weight:600}
.cbhead .cbmeta{margin-top:1px}
.cbfoot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--hair);
  background:var(--surface)}
.cbfhint{flex:1;min-width:0;font-size:11px;color:var(--on-2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.cbsegrow{display:flex;align-items:center;gap:8px;padding:2px 0}
/* 键值行 */
.kv{display:flex;gap:12px;padding:9px 14px;border-bottom:1px solid var(--hair);
  font-size:calc(var(--fs-body) - 1px);align-items:baseline}
.win .kv{padding:7px 13px;font-size:12px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--on-2);width:var(--kv-k);flex:none;font-size:calc(var(--fs-body) - 1.5px)}
.win .kv .k{font-size:12px}
.kv .v{flex:1;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.kv .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.kv .v b{font-weight:600}
.kv .v.path{word-break:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* 标签 */
.tag{font-size:11px;font-weight:600;padding:1.5px 6px;border-radius:var(--r-chip);flex:none;
  background:var(--surface-2);color:var(--on-2);line-height:1.6;white-space:nowrap}
.tag.agent{background:var(--agent-c);color:var(--agent-t)}
.tag.ok{background:var(--primary-c);color:var(--on-primary-c)}
.tag.q{background:var(--queued-c);color:var(--on-queued-c)}
.tag.err{background:var(--error-c);color:var(--on-error-c)}
.tag.unread{background:var(--primary);color:var(--on-primary);min-width:18px;text-align:center}
/* 待批徽标：实心红底 + 白字走 --badge/--on-badge 成对 token（:41-44 的设计决定：
   --error 当底色白字只有 4.17:1，深色下 --error 翻浅粉更不可读）。2026-10-14 曾把这里
   改成 background:var(--error);color:#fff —— 那是回归，见 docs/plans/2026-10-15-relay-prototype-review.md P0-1。 */
.tag.pend{background:var(--badge);color:var(--on-badge);min-width:18px;text-align:center;white-space:nowrap}

/* --- 节点详情页（大头像 + 在线药丸 + 备注 + 设备信息） --- */
.ndhead{display:flex;gap:14px;align-items:center;padding:6px 2px 14px}
.av.xl{width:72px;height:72px;font-size:24px}
.av.xl .p{width:18px;height:18px;border:2px solid var(--surface)}
.ndmeta{flex:1;min-width:0}
.ndmeta .t1{font-size:16px;font-weight:600}
.ndtags{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;line-height:1.7;
  background:var(--surface-2);color:var(--on-2);white-space:nowrap}
.pill.on{background:color-mix(in srgb, var(--online) 18%, transparent);color:var(--on-ok-c)}
.pill.err{background:var(--error-c);color:var(--on-error-c)}
.tag.muted{background:var(--surface-2);color:var(--on-2)}
.grphead.sm{padding:10px 0 4px;font-size:12px;opacity:.92}
.inp.area{resize:vertical;min-height:48px;line-height:1.5;font-family:inherit;padding:9px 11px}

/* 开关 */
.sw{width:44px;height:26px;border-radius:13px;background:var(--surface-3);border:0;flex:none;
  position:relative;cursor:pointer}
.win .sw{width:42px;height:24px;border-radius:12px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:.16s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.win .sw::after{width:18px;height:18px}
.sw[aria-checked="true"]{background:var(--primary)}
.sw[aria-checked="true"]::after{left:21px}
.sw[disabled]{opacity:.45;cursor:not-allowed}

/* 分段 */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;font-size:12px;padding:6px 4px;border-radius:8px;
  color:var(--on-2);cursor:pointer;white-space:nowrap}
.win .seg button{font-size:12px;padding:5px 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--on);font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* 表单 */
.field{margin-bottom:12px}
.field label{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--on-2);margin-bottom:5px}
.field label span{color:var(--on);font-weight:600}
.field label .fk{margin-left:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;font-weight:600;color:var(--on)}
.inp{width:100%;border:1px solid var(--outline);background:var(--surface);color:var(--on);
  font-size:var(--fs-body);padding:10px 12px;border-radius:var(--r-ctl);outline:none}
.win .inp{font-size:14px;padding:8px 11px}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-c)}
.inp::placeholder{color:var(--on-2);opacity:.7}
.inp.pw{letter-spacing:.18em}
.inp[disabled]{background:var(--surface-2);color:var(--on-2);cursor:not-allowed}
.hint{font-size:var(--fs-hint);color:var(--on-2);margin-top:5px;line-height:1.5}
.win .hint{margin-top:8px;line-height:1.55}
.hint.warn{color:var(--on-queued-c)}
.hint.err{color:var(--on-error-c)}
.hint.ok{color:var(--on-ok-c)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-ctl);
  border:1px solid var(--outline);background:var(--surface);color:var(--on);font-size:var(--fs-btn);
  font-weight:500;padding:var(--pad-btn);cursor:pointer;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:transparent;font-weight:600}
.btn.pri:disabled,.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.danger{color:var(--on-error-c);border-color:var(--error-c);background:var(--error-c)}
.btn.danger-o{color:var(--on-error-c);border-color:var(--error);background:transparent;font-weight:600}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:12px;gap:5px}
.win .btn.sm{padding:5px 9px;font-size:11px;border-radius:9px}
/* 描边按钮。审批的「拒绝」就是它（源码 `OutlinedButton`）。
   同一对里「批准」是实心 `.pri` —— 之前那颗漏了 `.pri`，两颗长得一模一样，
   而 README 里写着"实心"。 */
.btn.out{background:transparent;border-color:var(--hair);color:var(--on)}
/* 横幅 */
.banner{display:flex;gap:9px;padding:10px 12px;border-radius:var(--r-ctl);
  font-size:12px;line-height:1.45;align-items:flex-start}
.win .banner{padding:9px 11px;font-size:12px}
.banner svg{width:16px;height:16px;margin-top:1px}
.banner.warn{background:var(--queued-c);color:var(--on-queued-c)}
.banner.err{background:var(--error-c);color:var(--on-error-c)}
.banner.ok{background:var(--primary-c);color:var(--on-primary-c)}
.banner.info{background:var(--surface-2);color:var(--on-2)}
.banner .x{margin-left:auto;cursor:pointer;opacity:.6}
.banner b{font-weight:600}

/* 空态 */
.empty{padding:48px 24px;text-align:center;color:var(--on-2)}
.empty svg{width:36px;height:36px;opacity:.4;margin-bottom:10px}
.empty .et{font-size:14px;font-weight:700;color:var(--on);margin-bottom:6px}
.empty p{font-size:14px;line-height:1.6;max-width:330px;margin:0 auto}

/* 事件行 = 源码 `AgentEventRow`（AgentConsoleScreen.kt:510-548）：
   一行「时间 + `eventType`（**协议机器名**，主色）+ 游标 N」，下面是 `summary`（正文）
   与 `body`（次要）。**源码不按类型着色** —— 上一版给 info/tool/error 配的三色竖条
   是我自己加的语义，源码里没有这个信息，已去掉；补回来的是真在数据里的 `cursor`。 */
.evt{display:block;padding:9px 0;border-bottom:1px solid var(--hair);font-size:12px}
.evt:last-child{border-bottom:0}
.evt .hd{display:flex;align-items:center;gap:8px;min-width:0}
.evt .tm,.evt .cr,.evt .ty{font-size:11px;font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.evt .tm{color:var(--on-2);flex:none}
.evt .ty{color:var(--primary);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.evt .cr{color:var(--on-2);flex:none}
.evt .ttl{margin-top:2px;font-weight:500}
.evt .det{color:var(--on-2);margin-top:2px;line-height:1.5;word-break:break-word}

/* ---------- 审批与队列：整段**一张卡**，一行一条 ----------
   字段与卡面照源码 `AgentApprovalCards.kt:61-138`：`工具: {tool}`（titleSmall Bold，
   primary）+ 状态胶囊 / `summary`；按钮只在 `pending && !过期` 时画，顺序
   **`拒绝`(描边) → `批准`(实心)**。

   但**版面是刻意偏离源码的一处**，理由是可读性：源码每条是独立一张 Card（自己的阴影
   + 14dp 内边距 + 按钮另起一行），单条 112px、三条 336px —— 手机上「待处理审批」这一块
   自己就吃掉整屏，而那三条里真正要读的字只有两行。改成一张 `.lst` 卡 + 行间发丝线，
   按钮并到首行右端：单条 61px，且**按钮跨条目竖直对齐**，连点几下批准不会点飞。
   偏离逐条写在 README §12。 */
.lst{display:flex;flex-direction:column}
.lst > * + *{border-top:1px solid var(--hair)}
.appr{display:flex;align-items:flex-start;gap:10px;padding:var(--pad-row)}
.appr .bd{flex:1;min-width:0}
.appr .tl{font-size:14px;font-weight:700;color:var(--primary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 摘要那条**不能**叫 `.sm`：按钮的形态类也是 `sm`（`class="btn sm pri"`），
   `.appr .sm` 于是同时命中「批准」那颗按钮，同权重且更靠后 —— 把它的文字色
   从 `--on-primary`（白）改成了 `--on-2`（灰）。实拍就是「深绿底 + 灰字」。
   改名 `.note` + 收在 `.bd` 下面，杜绝同名。 */
.appr .bd .note{font-size:12px;color:var(--on-2);margin-top:3px;line-height:1.45;
  word-break:break-word}
/* 首行右端那一格：有待办时是两颗按钮，办完了换成状态胶囊 —— 两种形态**占同一格**，
   所以竖着扫下来这一列始终是一条直线。 */
.appr .rt{flex:none;display:flex;align-items:center;gap:6px;padding-top:1px}
.apst{flex:none;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.apst.ok{background:var(--primary-c);color:var(--on-primary-c)}
.apst.no{background:var(--error-c);color:var(--on-error-c)}

/* 队列行 = 源码 `AgentApprovalCards.kt:156-191`：`{op}: {taskId 前 12 位}` + 行尾排队时刻
   / `prompt`。上一版画的「谁排的」在数据里根本没有，已换成真正在字段里的 op 与 prompt。
   与审批同款：一张卡、行间发丝线。 */
.qk{display:flex;align-items:flex-start;gap:10px;padding:var(--pad-row)}
.qk .bd{flex:1;min-width:0}
.qk .tl{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.qk .tm{flex:none;font-size:11px;color:var(--on-2);font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding-top:1px}
.qk .pm{font-size:12px;color:var(--on-2);margin-top:3px;line-height:1.45;word-break:break-word}

/* 离线块 = 源码 `AgentConsoleScreen.kt:241`（errorContainer 的 Surface，两行字）。
   它是「我发的东西去哪了」的答案，所以排在**队列下面**、紧挨那些排队的任务，
   而不是当成一句顶部的状态标签。 */
.offline{padding:13px 14px;border-radius:12px;background:var(--error-c)}
.offline .ot{font-size:14px;font-weight:700;color:var(--on-error-c)}
.offline .om{font-size:12px;color:var(--on-error-c);opacity:.9;margin-top:4px;line-height:1.55}

/* 待办角标：会话条 / 选择器每一条 / 工作区 chip 共用同一份。 */
.pcount{flex:none;font-size:11px;font-weight:600;padding:1.5px 6px;border-radius:var(--r-chip);
  background:var(--error-c);color:var(--on-error-c)}

/* 芯片行 */
.chiprow{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 12px}
.chip{font-size:11px;padding:4px 10px;border-radius:var(--r-chip);background:var(--surface-2);
  color:var(--on-2);border:1px solid transparent}
.chip.on{background:var(--primary-c);color:var(--on-primary-c);font-weight:600}
.chip.off{background:var(--queued-c);color:var(--on-queued-c)}
/* 工作区 chip（Agent 控制台顶部那一条）：名字 + 来源标签。只加布局，不动别处复用的 .chip。 */
.chip.ws{display:inline-flex;align-items:center;gap:6px}
/* 会话列表上方的**筛选条**。刻意不复用上面那套 .chip：那一套是只读状态标签
   （不可点、允许换行），这一套是互斥的过滤条件，且窄屏要能横滑而不是换行
   —— 换行会把列表整体往下推一行，而它下面就是用户真正要看的东西。 */
.fchips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;
  scrollbar-width:none}
/* 这里原来有一条 `.inp + .fchips{margin-top:8px}`，模拟 OutlinedTextField 自带的那
   8dp 竖向 padding（ConversationsScreen.kt:234-236）—— 它服务的对象是**列表上方那条
   常驻搜索框**。搜索框搬进顶栏之后（§14），列表上方第一块就是筛选条，这条规则随之
   删掉；留着它反而会让人以为"列表里还有一条输入框"。 */
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:5px;cursor:pointer;
  font-size:12px;font-weight:500;padding:5px 11px;border-radius:var(--r-chip);
  background:var(--surface-2);color:var(--on-2);border:1px solid transparent}
.fchip .cn{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.fchip[aria-selected="true"]{background:var(--primary-c);color:var(--on-primary-c);font-weight:600}
.fchip[aria-selected="true"] .cn{opacity:.85}
/* 搜索态的结果按段分。文案逐字取 `conv_search_messages_section` =「聊天记录」
   （strings.xml:602）—— 会话命中在上、聊天记录命中在下，两段同一张卡片的壳
   （`.rows` 自带 margin-top:8px，所以这里不再补下边距）。 */
.sect{font-size:11px;font-weight:600;color:var(--on-2);margin:16px 0 0;letter-spacing:.02em}
/* 消息页签的分区标题（「工作区」那一段）。会话区没有这样一条 —— 它的标题就是
   它上面那排药丸（药丸只管会话区，见设计稿 §6.1 的推荐 A：`全部 5` 是 5 条会话，
   不是"屏上跟会话有关的东西"）。 */
.sechead{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  color:var(--on-2);letter-spacing:.02em;margin:18px 0 0}
.sechead .cnt{margin-left:auto;font-weight:500;opacity:.85}

/* ====================== 5. 移动端外壳 ====================== */
.device{position:relative;overflow:hidden;border-radius:30px;background:var(--bg);
  box-shadow:0 0 0 9px #1b201f,0 0 0 10px #2c3432,0 26px 60px rgba(0,0,0,.4);
  font-size:var(--fs-body)}
.device[data-insets="bad"]{border-radius:0;box-shadow:none}
body[data-bare="1"] .device{border-radius:0;box-shadow:none}
/* 状态栏是应用自己画的，背景 = 页面 surface，不再是系统窗口色 */
.status{position:absolute;inset:0 0 auto 0;height:var(--status);z-index:12;
  display:flex;align-items:center;justify-content:space-between;padding:6px 24px 0;
  font-size:14px;font-weight:600;letter-spacing:.01em;background:var(--surface)}
.device[data-insets="bad"] .status{background:var(--sysbar);color:var(--on-2)}
.status .r{display:flex;gap:5px;align-items:center}
.status .r svg{width:15px;height:15px;stroke-width:2}
.gesture{position:absolute;inset:auto 0 0 0;height:20px;z-index:12;background:var(--surface);
  display:flex;align-items:center;justify-content:center}
.device[data-insets="bad"] .gesture{height:48px;background:var(--sysbar);align-items:flex-end;padding-bottom:6px}
.gesture i{width:120px;height:4px;border-radius:2px;background:var(--on);opacity:.28}
.device[data-insets="bad"] .gesture i{display:none}
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.device[data-insets="bad"] .app{inset:0 0 48px 0}
.app.rail{flex-direction:row;padding-bottom:16px}
/* 整屏屏（聊天详情 / 群信息 / 长按菜单）底下没有导航栏，于是手势条那 20px 就直接压在
   内容上 —— 输入框下面那行「0 / 800 字节」会被它盖掉一半。留出这 20px，
   与 rail 用的是同一个值（safe-area 只该被消费一次，见 App.kt）。 */
.app.nonav{padding-bottom:16px}
.railnav{width:82px;flex:none;background:var(--surface);border-right:1px solid var(--hair);
  padding:calc(var(--status) + 10px) 8px 8px;display:flex;flex-direction:column;gap:4px;align-items:center}
.railnav .brand{width:38px;height:38px;border-radius:11px;background:var(--primary-c);color:var(--on-primary-c);
  display:grid;place-items:center;margin-bottom:12px}
.railnav .brand svg{width:20px;height:20px}
.railnav .ri{width:100%;border:0;background:none;color:var(--on-2);font-size:11px;cursor:pointer;
  padding:7px 0 6px;border-radius:12px;display:grid;gap:3px;justify-items:center;position:relative}
.railnav .ri svg{width:21px;height:21px}
.railnav .ri[aria-current="true"]{color:var(--primary);background:var(--primary-c);font-weight:600}
.railnav .dot{position:absolute;top:5px;right:16px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--badge);color:var(--on-badge);font-size:11px;font-weight:700;display:grid;place-items:center}
/* min-height:0 —— 关键：否则 .main 无法收缩到视口内，长对话会把输入区挤出可视区 */
.main{flex:1;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.topbar{flex:none;background:var(--surface);padding:calc(var(--status) + 4px) 16px 10px;
  border-bottom:1px solid var(--hair)}
.topbar .tbinner{display:flex;align-items:flex-end;gap:10px;min-height:38px}
/* 设置是"收成一列"的界面：宽屏下顶栏内容跟着卡片列一起居中。
   608 = 640（.pad.set 外框）− 2×16（它自己的 padding）—— 要对齐的是卡片**内容**左边缘。 */
.topbar.set .tbinner{max-width:608px;margin:0 auto}
.topbar .tt{flex:1;min-width:0}
/* 顶栏标题。标签必须放在省略号**外面** —— 塞进同一个 h1 里的话，
   长标题会把标签一起挤掉，屏幕上只剩一个「Ag…」。所以标题包一层 .ell 自己省略，
   标签 flex:none 始终完整。 */
.topbar h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15;
  display:flex;align-items:center;gap:8px;min-width:0}
.topbar h1 .ell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar h1 .tag{flex:none;font-size:11px;font-weight:600;letter-spacing:0}
/* 聊天页的头部比页签首页小一号：ChatScreen 用的是 titleSmall / labelSmall，
   页签首页（消息 / 节点 / 设置）才是大标题。 */
.topbar.chat{padding-left:12px;padding-right:12px;padding-bottom:8px}
.topbar.chat h1{font-size:14px;letter-spacing:0;gap:7px}
.topbar.chat h1 .tag{font-size:11px;padding:1px 6px}
.topbar.chat .sub{font-size:11px}
.topbar.chat .tbinner{min-height:40px;align-items:center;gap:8px}
/* 聊天页头部元素比别处小一号：393px 宽的一行里要放下
   返回 + 头像 + 标题 + 来源标签 + Agent 标签 + 在线 + 两个动作，不缩尺寸的话
   标题会被挤成只剩前几个字。 */
.topbar.chat .hav{width:36px;height:36px;border-radius:12px;font-size:14px}
.topbar.chat .ibtn{width:30px;height:30px}
.topbar.chat .ibtn svg{width:16px;height:16px}
/* 在线状态：一行「点 + 在线」。它跟 .tag 不一样 —— 没有底色、没有内边距，
   夹在标题和「Agent」标签后面时才不会把标题挤成「Rela…」。 */
.topbar .stat{display:inline-flex;align-items:center;gap:4px;font-size:11px;
  color:var(--on-2);flex:none;font-weight:500}
.topbar .stat i{width:6px;height:6px;border-radius:50%;background:var(--on-2)}
.topbar .stat.on i{background:var(--online)}
.topbar .sub{font-size:11px;color:var(--on-2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .acts{display:flex;gap:6px;align-items:center;padding-bottom:2px}
.topbar .ibtn.plain{align-self:flex-start;margin-top:-3px}
/* 聊天页顶栏的头像。会话页的顶栏没有它 —— 这也是"进了会话"最直观的信号。 */
.hav{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;
  color:#fff;font-size:14px;font-weight:700;position:relative;align-self:center}
.hav svg{width:20px;height:20px}
.hav .p{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;
  border:2px solid var(--surface)}
.topbar h1 .tag{margin-left:8px;vertical-align:3px}
.ibtn{width:34px;height:34px;border-radius:var(--r-ctl);border:0;background:var(--surface-2);color:var(--on);
  display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.ibtn svg{width:18px;height:18px}
.ibtn.plain{background:none}
.ibtn .b{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--badge);color:var(--on-badge);font-size:11px;font-weight:700;display:grid;place-items:center}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:14px 16px 16px}
.nav{flex:none;height:calc(var(--nav-h) + var(--inset-b));padding:6px 4px var(--inset-b);
  background:var(--nav-bg);backdrop-filter:blur(14px);border-top:1px solid var(--hair);
  display:flex;align-items:stretch}
.nav .ni{flex:1;border:0;background:none;color:var(--on-2);font-size:11px;cursor:pointer;
  display:grid;gap:2px;justify-items:center;align-content:start;padding-top:4px;border-radius:12px;position:relative}
.nav .ni svg{width:22px;height:22px}
.nav .ni[aria-current="true"]{color:var(--primary);font-weight:600}
.nav .dot{position:absolute;top:1px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--badge);color:var(--on-badge);font-size:11px;font-weight:700;display:grid;place-items:center}
/* .syncbar 一套 7 条规则已删（2026-10-15 审查 P1-5 的处置）。判据：CSS 有规则而
   `class="syncbar` 渲染 0 处 —— 消息页那条同步条在源码里不存在（见 :3338 删除决定①
   「`SyncBar` 只有两个家：`NodesScreen.kt:210` 与桌面 pane；`ConversationsScreen` 从
   `LargeTitleBar` 一路到列表从头到尾没有它」），桌面侧 2026-10-12 也已移除
   （见 :5988 「不再单独画 mDNS 同步条」）。原先挂在它身上的「右端常驻动作」提案
   （源码签名 `SyncBar(text, healthy, ledColor)` 没有尾部动作位）随 CSS 一并移除；
   要回到实现时按 `TopBars.kt` 的 SyncBar 再议。这类「CSS 有、没人渲染」的死状态
   对 check-render 隐形：它只查标记用的 class 在不在 CSS，反方向不查。 */
/* ====================== 6. 桌面端外壳 ====================== */
.win{background:var(--surface);border-radius:11px;overflow:hidden;position:relative;
  box-shadow:0 0 0 1px rgba(0,0,0,.26),0 26px 70px rgba(0,0,0,.42);
  display:flex;flex-direction:column;font-size:14px;
  --fs-body:14px; --fs-bub:14px; --r-card:12px; --r-bubble:12px;
  --padc:8px 13px 13px; --kv-k:104px; --fs-ctitle:11px; --fs-btn:12px;
  --pad-row:10px 13px;
  --pad-btn:7px 12px; --msg-max:62%; --fs-row1:14px; --fs-row2:12px}
body[data-bare="1"] .win{border-radius:0;box-shadow:none}
.deskwrap{display:flex;flex-direction:column;align-items:stretch}
/* macOS 系统菜单栏（mac 上由系统提供；Win/Linux 上同一份 Compose 菜单落在 .titlebar） */
.menubar{height:var(--menubar);display:flex;align-items:center;gap:1px;padding:0 13px;
  background:var(--menubar-bg);color:var(--on);font-size:12px;user-select:none;flex:none}
.menubar .mi{padding:1px 9px;border-radius:5px;white-space:nowrap}
.menubar .mi.on{background:var(--primary-c);color:var(--on-primary-c);font-weight:600}
.menubar .applogo{width:14px;height:14px;border-radius:4px;background:var(--primary);color:#fff;
  display:grid;place-items:center;margin:0 8px 0 1px}
.menubar .applogo svg{width:9px;height:9px;stroke-width:2.2}
.menubar .sp{flex:1}
.menubar .tr{display:flex;align-items:center;gap:13px;color:var(--on-2);font-size:12px}
.menubar .tr svg{width:14px;height:14px}
.titlebar{height:var(--titlebar);flex:none;display:flex;align-items:center;gap:12px;padding:0 13px;
  background:var(--surface);border-bottom:1px solid var(--hair)}
.traffic{display:flex;gap:8px;flex:none}
.traffic i{width:12px;height:12px;border-radius:50%;display:block}
.traffic .r{background:#FF5F57;border:1px solid #E0443E}
.traffic .y{background:#FEBC2E;border:1px solid #DEA123}
.traffic .g{background:#28C840;border:1px solid #1AAB29}
.wtitle{font-size:12px;font-weight:600;color:var(--on-2)}
/* 标题栏右侧那一格 = 当前视图名（primary 色，DesktopChrome.kt:259-264）；
   中间那格是随视图变的副标题（`:233-244`）。两者都在，且都只有一格。 */
.tsub{font-size:11px;color:var(--on-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tview{margin-left:auto;font-size:11px;font-weight:600;color:var(--primary);white-space:nowrap}
/* 工具条 */
.toolbar{height:var(--toolbar);flex:none;display:flex;align-items:center;gap:10px;padding:0 13px;
  background:var(--surface);border-bottom:1px solid var(--hair)}
.viewtabs{display:flex;gap:3px;background:var(--surface-2);border-radius:11px;padding:3px;flex:none}
.viewtabs button{border:0;background:none;font-size:12px;color:var(--on-2);cursor:pointer;
  padding:5px 12px;border-radius:9px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.viewtabs button svg{width:15px;height:15px}
.viewtabs .cnt{font-size:11px;padding:0 5px;border-radius:7px;background:var(--surface-3);
  color:var(--on-2);font-weight:600}
.viewtabs button[aria-pressed="true"]{background:var(--surface);color:var(--on);font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.12)}
.viewtabs button[aria-pressed="true"] .cnt{background:var(--primary-c);color:var(--on-primary-c)}
.search{position:relative;flex:1;max-width:280px;min-width:120px}
.search input{width:100%;border:1px solid var(--outline);background:var(--bg);color:var(--on);
  font-size:12px;padding:6px 10px 6px 29px;border-radius:9px;outline:none}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-c)}
.search>svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--on-2)}
.search .clr{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  border:0;border-radius:50%;background:var(--surface-3);color:var(--on-2);cursor:pointer;
  display:grid;place-items:center}
.search .clr svg{width:11px;height:11px;stroke-width:2.4}
/* 顶栏搜索态用的搜索框（`.search.fill`）：把 max-width 放开让输入框吃满整行。
   它顶掉的是**标题那一行**，而 `.topbar` 的高度由 `padding + tbinner 的 min-height:38px`
   决定、与里面装的是标题还是输入框无关 —— 所以进搜索**不额外占竖向空间**，
   这正是「列表上方那条常驻搜索框」省下来的那部分（见 §14）。 */
.search.fill{max-width:none;min-width:0}
.topbar .search.fill input{font-size:14px;padding:8px 32px 8px 32px}
/* 搜索态顶栏（`.topbar.gs`）：返回钮与输入框必须**同轴**。
   标题态那套是 `.ibtn.plain` 拿 align-self:flex-start + margin-top:-3px 去对 24px 大标题的
   视觉基线（见 `.topbar .ibtn.plain` 那条），换成 33px 高的输入框之后，同一套偏移就成了
   错位：实测同一根 38px 的行里，返回钮中线在 62px、输入框中线在 69.5px —— 差 **7.5px**，
   肉眼一眼就能看出那只「‹」浮在框的上半截。这里整行改回 center，并把那段偏移撤销。 */
.topbar.gs .tbinner{align-items:center}
.topbar.gs .ibtn.plain{align-self:center;margin-top:0}
.tb-acts{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
/* 工具栏末尾的「更多」。.ibtn 自带 position:relative，菜单直接锚在它下面
   —— 不需要另算工具栏高度。 */
.tbmore{position:relative;display:inline-flex;flex:none}
/* 头部右上角的「更多」收纳（`.hdmore`）—— 与工具栏那颗 `.tbmore` 用同一套菜单样式，
   区别只在**触发条件**：`.tbmore` 由终端形态决定（只有平板宿主画），`.hdmore` 由
   **动作条数**决定（规则见 JS 的 `actsHTML`）。默认收起，加 `.on` 才展开。 */
.hdmore{position:relative;display:inline-flex;flex:none}
.hdmore .menu{top:calc(100% + 6px);right:0;min-width:184px;display:none}
.hdmore.on .menu{display:block}
.hdmore .menu .mi2{font-size:12px;padding:8px 10px}
/* 双栏 */
.split{flex:1;min-height:0;display:flex}
.side{width:var(--side);flex:none;display:flex;flex-direction:column;min-height:0;
  background:var(--bg);border-right:1px solid var(--hair)}
/* 左栏里真正装条目的那一层。`.side` 是 flex 列、`.sidehead` 已经 flex:none，
   所以这层要自己吃掉剩余高度并让里面的 .sidelist 滚起来 —— 少这一条整栏会顶破窗口。 */
.sidebody{flex:1;min-height:0;display:flex;flex-direction:column}
.sidehead{flex:none;padding:11px 13px 6px;display:flex;align-items:center;gap:7px;font-size:11px;
  color:var(--on-2);font-weight:600;letter-spacing:.06em}
.sidehead .cnt{margin-left:auto;font-weight:500}
.sidehead .act{color:var(--primary);cursor:pointer;letter-spacing:0;font-size:11px}
.sidelist{flex:1;min-height:0;overflow-y:auto;padding:0 8px;display:flex;flex-direction:column;gap:1px}
.detail{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);
  position:relative}
/* 左栏条目 */
.li{display:flex;gap:10px;align-items:center;padding:7px 9px;border-radius:12px;cursor:pointer;min-height:52px}
.li:hover{background:var(--surface-2)}
.li[aria-selected="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(16,24,20,.05)}
.li .av{width:32px;height:32px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;
  font-size:12px;font-weight:600;position:relative}
.li .av .p{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;
  border:2px solid var(--bg)}
.li[aria-selected="true"] .av .p{border-color:var(--surface)}
.li .fi2{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--surface-3);color:var(--on-2)}
.li .fi2 svg{width:17px;height:17px}
.li .fi2.act{background:var(--primary-c);color:var(--on-primary-c)}
.li .bd{flex:1;min-width:0}
.li .t1{font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px}
.li .t1 .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t2{font-size:12px;color:var(--on-2);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t3{font-size:11px;color:var(--on-2);opacity:.85;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .rt{flex:none;display:grid;gap:3px;justify-items:end}
.li .tm{font-size:11px;color:var(--on-2);white-space:nowrap}
.li.unread .t2{color:var(--on);font-weight:500}
.li.unread .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);flex:none}
/* 右侧只剩未读那一枚（实心药丸，primary 底 + onPrimary 字）。
   会话行上的「排队 N」徽标（secondaryContainer，本 App 的 --queued-c）与气泡里的
   消息四态一起删了 —— 见 screenChat 的 annot。 */
.li .ub{font-size:11px;min-width:16px;text-align:center;padding:0 5px;border-radius:8px;
  background:var(--primary);color:var(--on-primary)}
/* （原 `.li.group .tgroup` 已删：桌面行把「x/y 人在线」接在预览同一行，
   照 DesktopConversationsPane.kt:610-620 的 buildString。） */
/* 右栏头 */
.dhead{flex:none;padding:11px 16px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:12px}
.dhead .av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;
  font-size:14px;font-weight:600;flex:none;position:relative}
.dhead .av .p{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;
  border:2px solid var(--surface)}
.dhead .tt{flex:1;min-width:0}
.dhead h2{font-size:16px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;
  white-space:nowrap;overflow:hidden}
.dhead h2 .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhead .sub{font-size:11px;color:var(--on-2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead .acts{display:flex;gap:7px;flex:none}
.dbody{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:13px}
/* 列式滚动容器的子项一律不许被压扁。不写这条会踩一个很隐蔽的 Flexbox 规则：
   `.card` 带 overflow:hidden，于是它自己的 `min-height:auto` 退化成 0
   （Flexbox §4.5：item 自身 overflow 非 visible 时自动最小尺寸为 0），
   内容一长过容器，卡片就被压扁、里头的行被 overflow:hidden 裁掉 ——
   现象是「Agent 会话卡只剩第一行」「节点卡的后几行不见了」。 */
.dbody>*,.msgs>*,.sidelist>*,.setbody>*,.sh-body>*{flex:none}
/* 状态栏 */
.statusbar{height:var(--statusbar);flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;
  font-size:11px;background:var(--surface-2);color:var(--on-2);border-top:1px solid var(--hair);
  white-space:nowrap;overflow:hidden}
.statusbar .led{width:7px;height:7px;border-radius:50%;background:var(--online);flex:none}
.statusbar b{color:var(--on);font-weight:600}
.statusbar .sbl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.statusbar .r{margin-left:auto;display:flex;align-items:center;gap:14px;flex:none}
.statusbar .r em{font-style:normal}
.statusbar .r span{cursor:pointer;display:flex;align-items:center;gap:5px}
.statusbar .r svg{width:13px;height:13px}
.win[data-tier="compact"] .statusbar .sbl{display:none}
.win[data-tier="compact"] .statusbar .r em,
.win[data-tier="medium"] .statusbar .r span:nth-child(2) em{display:none}
.win[data-tier="compact"] .statusbar{padding:0 10px;gap:6px}
.win[data-tier="compact"] .statusbar .r{gap:11px}
.onlyc{display:none}
.win[data-tier="compact"] .onlyc{display:inline-flex}
/* 中/窄档的 `dhead` 动作收纳已交给 `actsHTML`（直出 1 颗 + 「⋯」菜单），
   原先那条"硬藏最后一颗按钮"的 `.dhead .acts .btn:last-child{display:none}` 已删。 */
.win[data-tier="compact"] .dhead{gap:9px;padding:8px 10px}
/* Compact（<664px）的 60px 底导 / Medium（664–999px）的 64px 竖导。
   两者都是**壳**的一部分，不属于任何面板：横排的视图切换住在它们里面，所以**工具栏里
   那一排视图 chips 撤掉了**。工具栏本身只有 Compact 不画 —— `DesktopShell.kt:379`
   的条件是 `sizeClass != Compact`（Expanded 与 Medium 都画），原型同一处 `:4853`
   也是 `tier !== 'compact'`。竖导放得下三个图标带文字就竖着放，放不下（<664）才退化成底导。 */
.dnav{height:60px;flex:none;display:flex;border-top:1px solid var(--hair);background:var(--surface)}
.dnav .ni{flex:1;border:0;background:none;font-size:11px;color:var(--on-2);cursor:pointer;
  display:grid;gap:2px;justify-items:center;align-content:center;position:relative}
.dnav .ni svg{width:20px;height:20px}
.dnav .ni[aria-current="true"]{color:var(--primary);font-weight:600}
.drawer{width:64px;flex:none;background:var(--surface);border-right:1px solid var(--hair);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px}
.drawer .ri{width:100%;border:0;background:none;font-size:11px;color:var(--on-2);cursor:pointer;
  padding:8px 0 7px;border-radius:11px;display:grid;gap:3px;justify-items:center;position:relative}
.drawer .ri svg{width:20px;height:20px}
.drawer .ri[aria-current="true"]{background:var(--primary-c);color:var(--on-primary-c);font-weight:600}
/* 竖导/底导的角标。只给「会话」（未读总数）与「文件」（等你处置的入向邀约数）画，
   节点不画 —— 与 desktopNavBadges 同一条规则：数不出来的地方不硬凑一个红点。 */
.dnav .ni .nb,.drawer .ri .nb{position:absolute;top:4px;right:8px;min-width:15px;height:15px;
  border-radius:8px;background:var(--primary);color:var(--on-primary);font-size:11px;
  line-height:15px;text-align:center;padding:0 4px;font-weight:600;letter-spacing:0}
.dnav .ni .nb{top:5px;right:calc(50% - 21px)}
/* Medium 的侧栏收窄到 240px：560–999 这一段装不下 300px 侧栏 + 聊天区。 */
.win[data-tier="medium"] .side{width:240px}
/* 标题栏以下、底导以上那一段：左边竖导（Medium）右边内容列。 */
.dshella{flex:1;min-height:0;display:flex}
.dcol{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
/* 桌面空态 */
.emptyd{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:34px 40px;text-align:center}
.emptyd .big{font-size:16px;font-weight:700;letter-spacing:-.01em}
.emptyd .lede{font-size:12px;color:var(--on-2);margin-top:7px;line-height:1.65;max-width:460px}
.entrygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:720px;margin-top:16px}
.entry{display:flex;flex-direction:column;gap:9px;padding:14px;border-radius:var(--r-card);
  background:var(--surface);border:1px solid var(--hair);cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.entry:hover{border-color:var(--primary)}
.entry .ei{width:36px;height:36px;border-radius:11px;background:var(--primary-c);color:var(--on-primary-c);
  display:grid;place-items:center}
.entry .ei svg{width:19px;height:19px}
.entry b{font-size:14px;font-weight:600}
.entry p{font-size:11px;color:var(--on-2);line-height:1.5;margin-top:-3px}
.qrmock{width:132px;height:132px;margin:0 auto 12px;border:8px solid var(--surface);border-radius:12px;
  background:repeating-conic-gradient(var(--on) 0 25%,transparent 0 50%) 0 0/20px 20px;opacity:.88;
  box-shadow:var(--shadow)}
/* 扫码配对那一屏的取景框。原来 .scanwrap / .lamp / .qr / .scanhint 四个类
   只有 HTML 没有规则：框会塌成 0 高、 lamp 掉在文档流里、qr 是一块空白。 */
.scanwrap{position:relative;width:100%;max-width:200px;aspect-ratio:1/1;margin:0 auto 10px;
  border:2px dashed var(--outline);border-radius:16px;background:var(--surface-2);
  display:grid;place-items:center}
.scanwrap .lamp{position:absolute;right:9px;bottom:9px;width:30px;height:30px;border-radius:50%;
  border:0;background:var(--surface-3);color:var(--on-2);display:grid;place-items:center;
  cursor:pointer;box-shadow:var(--shadow)}
.scanwrap .lamp svg{width:16px;height:16px}
.scanwrap .lamp[aria-pressed="true"]{background:var(--queued-c);color:var(--on-queued-c)}
.scanwrap .qr{width:132px;height:132px;border-radius:12px;background:
  repeating-conic-gradient(var(--on) 0 25%,transparent 0 50%) 0 0/20px 20px;opacity:.88}
.scanhint{font-size:11px;color:var(--on-2);text-align:center;margin:0 0 14px}
.footline{font-size:11px;color:var(--on-2);margin-top:16px;line-height:1.6}
/* 拖放悬停 */
.droplayer{position:absolute;inset:0;z-index:30;background:var(--drop-bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.droplayer .box{border:2px dashed var(--primary);border-radius:12px;padding:24px 38px;background:var(--surface)}
.droplayer .box svg{width:30px;height:30px;color:var(--primary)}
.droplayer .box b{font-size:14px;font-weight:700;margin-top:8px;display:block}
.droplayer .box p{font-size:12px;color:var(--on-2);margin-top:5px}
/* 设置独立窗口 */
.winset .side{width:184px}
.winset .detail{background:var(--bg)}
.setbody{flex:1;min-height:0;overflow-y:auto;padding:16px 16px}
.setrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair)}
.setrow:last-child{border-bottom:0}
.setrow .tt{flex:1;min-width:0}
.setrow b{font-size:12px;font-weight:600}
.setrow p{font-size:11px;color:var(--on-2);margin-top:2px;line-height:1.45}
/* 托盘态 */
/* 先铺一层**不透明**底色再叠渐变：`background:radial-gradient(...)` 只写渐变会把
   background-color 留在 transparent，于是这块固定深色的"桌面"在浅色主题下
   被对比度探针当成了白底（.caption 上的 #B7E4C7 就被算成 1.41:1）。 */
.deskbg{position:absolute;inset:0;background-color:#0B1412;
  background-image:radial-gradient(1100px 620px at 26% 18%,#2C4E48,#122220 62%,#0B1412)}
.deskbg .caption{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:#B7E4C7;
  font-size:14px;text-align:center;line-height:1.75;background:rgba(9,17,15,.52);padding:14px 24px;
  border-radius:15px;backdrop-filter:blur(10px);max-width:470px;border:1px solid rgba(183,228,199,.14)}
.deskbg .caption b{display:block;font-size:14px;margin-bottom:6px}
.deskbg .caption kbd{background:rgba(183,228,199,.14);border-radius:5px;padding:1px 6px;font-size:11px}
.trayicon{position:absolute;right:13px;bottom:9px;display:flex;align-items:center;gap:6px;
  color:#E8E8E6;font-size:11px;background:rgba(255,255,255,.07);border-radius:8px;padding:4px 9px}
.trayicon .tdot{width:7px;height:7px;border-radius:50%;background:var(--online)}
.traymenu{position:absolute;right:9px;bottom:38px;width:250px;background:var(--surface);border-radius:11px;
  box-shadow:0 0 0 1px var(--hair),0 18px 48px rgba(0,0,0,.46);padding:5px}
.traymenu .ti{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:7px;font-size:12px;
  cursor:pointer;color:var(--on)}
.traymenu .ti:hover{background:var(--surface-2)}
.traymenu .ti svg{width:15px;height:15px;color:var(--on-2)}
.traymenu .ti .badge{margin-left:auto;background:var(--primary);color:var(--on-primary);font-size:11px;
  font-weight:700;padding:1px 6px;border-radius:8px}
.traymenu .ti.danger{color:var(--on-error-c)}
.traymenu .ti.danger svg{color:var(--on-error-c)}
.traymenu .thr{height:1px;background:var(--hair);margin:4px 6px}
.traymenu .thead{font-size:11px;color:var(--on-2);padding:6px 9px 5px;line-height:1.5}

/* ---- 全局搜索面板（桌面版左栏顶部那条搜索框命中后替换左栏内容） ----
   App.vue:610-616：SearchPanel 直接替换 <ConvList>，不是浮层、不是独立页面。
   所以这一屏的骨架是「左栏被搜索结果占满 + 标题栏的会话标题那一行换成搜索框」。 */
.spbox{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--hair);
  border-radius:var(--r-ctl);padding:0 10px;height:36px;margin-bottom:10px}
.spbox svg{width:16px;height:16px;color:var(--on-2);flex:none}
.spbox input{flex:1;border:0;background:transparent;color:var(--on);font-size:14px;outline:none}
.spsec{font-size:11px;color:var(--on-2);font-weight:600;letter-spacing:.06em;padding:9px 12px 5px}
.spitem{display:flex;gap:10px;align-items:center;padding:8px 12px;cursor:pointer;
  border-radius:12px;min-height:48px}
.spitem:hover{background:var(--surface-2)}
.spitem .spav{width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;
  color:#fff;font-size:12px;font-weight:600;background:var(--primary)}
.spitem .spav svg{width:16px;height:16px}
.spitem .bd{flex:1;min-width:0}
.spitem .t1{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600}
.spitem .t1 .off{font-weight:400;color:var(--on-2);font-size:11px}
.spitem .t2{font-size:11px;color:var(--on-2);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.spitem .sptime{font-size:11px;color:var(--on-2);flex:none}
.spph{font-size:12px;color:var(--on-2);text-align:center;margin-top:24px}
.spph b{color:var(--on);display:block;margin-bottom:4px;font-size:14px}

/* ---- 会话内历史搜索浮层（ChatPane.vue:1783-1931，不是全局搜索那一套） ----
   样式重排过两版。原来左栏是「关键词 / 类型 / 日期」三个各带一个框的散装块：
   ① 关键词那个框和顶部那条搜索框是**同一个 state**，同一个值开两个入口，
      看着像两个输入框、其实改哪个都是改这一个；
   ② 「日期」用 hint 小字写「10月 · 起止两点 / 全部日期」，底下再上下摞
      「清除」和「清空筛选」两颗按钮， IDE 味比搜索味重；
   ③ 结果区尾巴上挂着「搜索中...」—— 加载完的列表下面还吊一个中间态。
   现在：关键词整块删掉（顶部那条就是它），只剩类型 / 日期两档；
   结果画满 4 条，底部给一句终态「只返回最近 50 条」。
   日期筛选是**一整个月历**不是下拉（月份头有「上个月 / 下个月」）。
   **两端不是一个壳，不能共用一个。** 左右两栏是**桌面**的形态：
     桌面是 min(680px,100%) × min(500px,100%) 的居中 modal dialog
     （ChatPane.vue:2824-2836），外面 overlay 铺满 + 16% 黑遮罩（:2815-2823），
     里面 218px + 1fr 两栏（:2883）—— 两栏能成立是因为窗口宽 680 起；
     手机窄屏放不下 218px 那一条左栏，条件只能竖着摞在搜索框下面（.hsbody）。 */
.hsbd{position:absolute;inset:0;z-index:24;background:var(--surface);
  display:flex;flex-direction:column;animation:none}
.hs-f{flex:none;display:flex;align-items:center;gap:9px;padding:9px 12px;
  border-bottom:1px solid var(--hair)}
.hs-f .inp{flex:1;min-width:0}
.hs-f .btn.sm{flex:none;padding:6px 9px}
/* 手机：条件区从「左栏 + 右结果」改成一整条竖着滚下来 */
.hsbody{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 14px;
  display:flex;flex-direction:column;gap:11px}
.hsrow{flex:none;display:flex;align-items:center;gap:9px}
.hsrow>.hsl{flex:none;width:34px;font-size:12px;color:var(--on-2)}
.hsl{flex:none;font-size:12px;color:var(--on-2)}
/* 类型：桌面是 3 等分分段条、手机是自由排布的 chip。同一个 state，
   但分段条一 flex:1 就会把每颗按钮挤到 44px 以下，反而点不准。 */
.hskinds{display:flex;gap:5px;flex-wrap:wrap}
.hskinds button{flex:none;border:1px solid var(--outline);
  border-radius:8px;background:var(--surface);color:var(--on-2);padding:6px 10px;font-size:12px}
.hskinds button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);
  color:var(--on-primary);font-weight:600}
.hsdate{flex:1;min-width:0;font-size:12px;line-height:1.5;text-align:right}
.hsdate b{font-weight:600}
.hsclear{flex:none;background:transparent;color:var(--on-2);
  border:1px solid var(--outline);border-radius:8px;padding:5px 9px;font-size:11px}
.hsclear:hover{color:var(--on);border-color:var(--on-2)}
/* 手机那一行日期**整行可点**（.hsdatebtn），点开是 m-histdate 那个贴底对话框。
   月历不摊在条件区里：手机的条件区本来就窄，一整个月历（7 列 × 6 行）竖着摞在
   「类型 / 日期」下面，等于刚进搜索就占掉半屏，剩下的地方给不了几条结果。
   收敛成一个"当前值 + >"的入口，值仍然写在行上（现在筛的是哪一段一眼可见），
   展开这件事交给对话框。桌面那 218px 左栏是筛选面板本身，月历就摊在里面，
   两端不是同一件事。 */
/* 注意写法：.sheet / .scrim 各自的 z-index 定义在这条**之后**（.sheet 是 21、
   .scrim 是 20），同权重下后写的赢 —— 所以这里必须把两个类都写上，把 z-index
   顶到 34（.hsbd 那层是 24），否则整层对话框会被历史搜索那层压在底下、
   看着像压根没画。 */
.scrim.drpz, .sheet.drpz{z-index:34}
.hsdatebtn{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;
  gap:5px;background:var(--surface-2);border:1px solid var(--hair);border-radius:9px;
  padding:6px 9px;font-size:12px;color:var(--on-2);cursor:pointer}
.hsdatebtn b{color:var(--on);font-weight:600;font-size:12px}
.hsdatebtn .chev{width:15px;height:15px;opacity:.5}
.hsdatebtn .chev svg{width:15px;height:15px}
.hsdatebtn:hover{border-color:var(--outline)}
/* 日期对话框：贴底 sheet（原生 .sheet 的 z-index 是 21，压不住 .hsbd 那层 24）。 */
.drpz .drpfld{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 0 12px}
.drpz .drpf{display:flex;align-items:center;gap:8px;text-align:left;background:var(--surface-2);
  border:1px solid var(--hair);border-radius:11px;padding:9px 11px;color:var(--on)}
.drpz .drpf .drpk{font-size:11px;color:var(--on-2);display:block}
.drpz .drpf b{flex:1;font-size:14px;font-weight:600}
.drpz .drpf .chev{width:16px;height:16px;color:var(--on-2);opacity:.55}
.drpz .drpf .chev svg{width:16px;height:16px}
.drpq{display:flex;gap:7px;flex-wrap:wrap;padding:0 0 12px}
.drpq button{border:1px solid var(--outline);border-radius:999px;background:var(--surface);
  color:var(--on-2);padding:5px 11px;font-size:11px}
.drpq button[aria-pressed="true"]{background:var(--primary-c);border-color:var(--primary);
  color:var(--primary);font-weight:600}
.drpact{display:flex;gap:10px;padding:12px 16px 16px;border-top:1px solid var(--hair)}
.drpact .btn{flex:1;height:44px}
/* 月历（ChatPane.vue:1847-1877）：一整个月，7 列，四种日格 */
.hscal{flex:none;background:var(--surface-2);border:1px solid var(--hair);
  border-radius:12px;padding:9px 10px 10px}
.hscalh{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--on-2)}
.hscalh b{flex:1;text-align:center;color:var(--on);font-weight:600}
.hscalh button{width:26px;height:26px;border:0;background:transparent;color:var(--on-2);
  border-radius:7px;display:grid;place-items:center;font-size:14px;line-height:1}
.hscalh button:hover{background:var(--surface-3);color:var(--on)}
.hswk,.hsdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.hswk span{text-align:center;font-size:11px;color:var(--on-2);padding:3px 0}
.hsdays button{height:30px;border:0;background:transparent;color:var(--on);font-size:12px;
  border-radius:7px}
.hsdays button.out{color:var(--on-2);opacity:.4}
.hsdays button.today{box-shadow:inset 0 0 0 1.5px var(--primary);font-weight:600}
.hsdays button.in-range{background:var(--primary-c);color:var(--on-primary-c)}
.hsdays button.range-edge{background:var(--primary);color:var(--on-primary);font-weight:600}
/* 结果（两端共用） */
.hsrh{flex:none;padding:6px 2px 3px;font-size:12px;color:var(--on-2);
  display:flex;justify-content:space-between;gap:8px}
.hsrh b{color:var(--on);font-weight:600}
.hsres{flex:none;display:flex;flex-direction:column;gap:2px}
.hshit{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:12px;cursor:pointer}
.hshit:hover{background:var(--surface-2)}
.hshit .bd{flex:1;min-width:0}
.hshit .t1{font-size:14px;line-height:1.45}
.hshit .t2{font-size:11px;color:var(--on-2);margin-top:2px}
.hst{width:34px;height:34px;border-radius:12px;flex:none;background:var(--surface-3);color:var(--on-2);
  display:grid;place-items:center}
.hst svg{width:17px;height:17px}
.hst img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.hsfoot{flex:none;width:100%;grid-column:1/-1;text-align:center;font-size:11px;color:var(--on-2);
  padding:12px 0 10px;border-top:1px solid var(--hair);margin-top:6px}
/* 桌面：遮罩 + 居中 dialog。稿子是一屏一屏静态拼的，浮层只能贴在它所属那屏里，
   所以遮罩盖的是会话区（.detail）而不是整个窗口 —— 真机上 overlay 铺的是整个窗口
   （ChatPane.vue:2816 inset:0 挂在窗口根上），这一处是稿子的取舍不是实现的差别。 */
.hsovl{position:absolute;inset:0;z-index:20;display:grid;place-items:center;
  padding:16px;background:rgba(0,0,0,.16)}
.hsdlg{width:min(680px,100%);height:min(560px,100%);max-height:100%;
  display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--hair);border-radius:12px;overflow:hidden;
  box-shadow:0 18px 48px rgba(0,0,0,.22)}
.hsdh{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:13px 15px 12px;border-bottom:1px solid var(--hair)}
.hsdh .t{font-size:14px;font-weight:600}
.hsdh .s{font-size:12px;color:var(--on-2);margin-top:2px}
.hsdh .ibtn{flex:none}
.hsdbd{flex:1;min-height:0;display:grid;grid-template-columns:218px minmax(0,1fr)}
.hsside{flex:none;width:218px;background:var(--surface-2);
  border-right:1px solid var(--hair);display:flex;flex-direction:column;
  gap:9px;padding:10px;overflow-y:auto}
/* 218px 左栏要同时放下关键词 / 类型 / 日期 / 月历 / 清空筛选。
   dialog 默认给到 560 高度，避免月历与清空筛选挤出滚动区。 */
.hsside .hsdays button{height:24px}
.hsside .hscal{padding:7px 8px 8px}
.hsside .hsdate{text-align:left;flex:none}
.hsside .hsclear{align-self:flex-start}
.hsside .seg{background:none}
/* 桌面 dialog 的配套：左栏里三个条件该竖着摞，「清空筛选」沉到底 */
.hsdh .tw{display:flex;flex-direction:column;min-width:0}
.hsside .hsf{flex:none;display:flex;flex-direction:column;gap:6px}
.hsside .hsf>span{font-size:12px;color:var(--on-2)}
.hsside .hsf .inp{width:100%;height:34px}
.hsside .hsfld{flex:none;display:flex;flex-direction:column;gap:8px}
.hsside .hsfld>.hsl{margin-bottom:-3px}
.hsside>.btn{margin-top:auto;background:transparent;color:var(--on-2);
  border:1px dashed var(--outline);width:100%}
.hsside>.btn:hover{color:var(--on);border-color:var(--on-2)}
.hsdbd .hsres{flex:1;min-height:0;overflow-y:auto;padding:8px 10px 14px}

/* ---- 独立小窗（截图窗 / 屏幕协助窗都是独立 BrowserWindow，不带主窗口 chrome） ---- */
.floatwin{display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--hair);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow)}
.fwtop{flex:none;height:34px;display:flex;align-items:center;gap:7px;padding:0 11px;
  background:var(--surface-2);border-bottom:1px solid var(--hair);font-size:11px;color:var(--on-2)}
.fwtop svg{width:14px;height:14px}
.fwtop .lb{margin-left:auto}
.fwbody{flex:1;min-height:0;overflow:auto}
/* 截图悬浮条（CaptureApp.vue:539-630）。toolbar 贴顶时整体翻到下方，稿子里两条都画。
   **这块是固定深色的**（不跟主题走）。所以要把文字令牌就地翻成浅色系 ——
   否则内部的 `.annot b` / `.rvtgt` 会拿浅色主题的深色令牌压在这块深底上（实测 1.08:1 / 2.88:1）。
   浅色变体走 `.capt.lit`（d-sharescreen 的选屏同意页），用 `unset` 把令牌还回主题值。 */
.capt{width:100%;display:flex;flex-direction:column;background:#0f1412;color:#e8efec;position:relative;
  --surface:#1A211F;--surface-2:#222A28;--surface-3:#2A3331;
  --on:#E8EFEC;--on-2:#9FB3AB;--outline:rgba(232,239,236,.28);--hair:rgba(255,255,255,.10)}
.capt.lit{--surface:unset;--surface-2:unset;--surface-3:unset;
  --on:unset;--on-2:unset;--outline:unset;--hair:unset;
  background:var(--surface);color:var(--on)}
.capt .stage{display:grid;place-items:center;padding:16px;min-height:150px;color:rgba(232,239,236,.55);
  font-size:12px;background:repeating-linear-gradient(45deg,#151b19 0 10px,#111715 10px 20px)}
.captbar{display:flex;align-items:center;gap:4px;padding:7px 9px;background:#1a211f;
  border-radius:12px;margin:8px;width:max-content;max-width:calc(100% - 16px);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.captbar.top{position:absolute;top:8px;left:8px}
.captbar.below{position:absolute;bottom:8px;left:8px}
.captbar .dim{font-size:11px;color:#9fb3ab;flex:none;padding:0 8px;min-width:62px;text-align:center}
.capbtn{width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:#dfe8e4;
  display:grid;place-items:center;cursor:pointer;flex:none}
.capbtn svg{width:17px;height:17px}
.capbtn:hover{background:rgba(255,255,255,.1)}
.capbtn.on{background:var(--primary);color:var(--on-primary)}
.capbtn.pri{width:auto;padding:0 14px;background:var(--primary);color:var(--on-primary);
  font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.capbtn.pri:hover{background:var(--primary)}
.capbtn.cancel{width:auto;padding:0 14px;background:rgba(255,255,255,.14);color:#e8efec;font-size:12px}
.capdiv{width:1px;height:20px;background:rgba(255,255,255,.18);flex:none;margin:0 4px}
/* 选屏（remote-view-window.ts:255-259 desktopCapturer 枚举，缩略图 240×150） */
.rvsrc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rvopt label{display:block;position:relative;cursor:pointer}
.rvopt img{width:100%;aspect-ratio:8/5;object-fit:contain;background:#0f1412;border-radius:8px;
  border:1px solid var(--outline);display:block}
.rvopt span{display:block;font-size:11px;margin-top:3px;color:var(--on-2)}
.rvopt.selected img{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.rvopt input{position:absolute;opacity:0;pointer-events:none}
/* 屏幕协助观看窗的工具条（RemoteViewApp.vue:264-288） */
.rvbar{display:flex;align-items:center;gap:10px}
.rvsel{height:32px;border:1px solid var(--outline);border-radius:8px;background:var(--surface);
  color:var(--on);font-size:12px;padding:0 6px}
.rvseg{display:flex;border:1px solid var(--outline);border-radius:8px;overflow:hidden}
.rvseg button{border:0;background:var(--surface);color:var(--on-2);padding:0 11px;height:30px;
  font-size:12px;cursor:pointer}
.rvseg button.on{background:var(--primary);color:var(--on-primary);font-weight:600}
.rvtgt{margin-left:auto;font-size:11px;color:var(--on-2)}
.rvstop{margin-left:auto;border:0;border-radius:8px;background:var(--error-c);color:var(--on-error-c);
  height:30px;padding:0 13px;font-size:12px;font-weight:600;cursor:pointer;flex:none}
/* 聊天流里那条屏幕协助历史卡（ScreenHistoryCard.vue，宽度 260、viewer 用 --bubble-mine） */
.screencard{width:260px;max-width:100%;background:var(--surface);border:1px solid var(--hair);
  border-radius:12px;padding:9px 11px;display:flex;gap:9px;align-items:flex-start;margin-top:6px}
.screencard.active{background:var(--bubble-mine);border-color:transparent}
.screencard .si{width:20px;height:20px;border-radius:6px;flex:none;display:grid;place-items:center;
  background:var(--surface-3);color:var(--on-2)}
.screencard .si svg{width:14px;height:14px}
.screencard .st1{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.screencard .st1 .stt{font-weight:500;color:var(--primary);font-size:11px}
.screencard .st2{font-size:11px;color:var(--on-2);margin-top:2px}

/* ====================== 7. 聊天（两壳共用，尺寸走变量） ====================== */
.msgs{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 6px;display:flex;flex-direction:column;gap:10px}
.win .msgs{padding:14px 16px 6px;gap:9px}
.daysep{align-self:center;font-size:11px;color:var(--on-2);background:var(--surface-2);
  padding:3px 10px;border-radius:var(--r-chip);margin:4px 0}
/* 系统提示行（撤回 / 戳一碰 / 群成员变化）：居中小灰字，不画气泡、不带时间戳 */
.notice{align-self:center;font-size:11px;color:var(--on-2);background:var(--surface-2);
  padding:3px 10px;border-radius:var(--r-chip);margin:4px 0;display:flex;align-items:center;gap:5px}
.msg{display:flex;gap:8px;max-width:var(--msg-max)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .mav{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;
  color:#fff;font-size:11px;font-weight:700;margin-top:auto}
/* 群消息：气泡上方署名（会话键是 group:<id>，左右只分得出"是不是我发的"） */
.msg .col{min-width:0}
.msg .sender{font-size:11px;color:var(--on-2);margin:0 0 3px 3px}
.bub{background:var(--bubble-peer);border:1px solid var(--hair);padding:8px 12px;border-radius:var(--r-bubble);
  font-size:var(--fs-bub);line-height:1.5;white-space:pre-wrap;word-break:break-word;border-top-left-radius:6px}
/* 纯文件气泡：文件卡自带内边距，外面只留一圈。
   white-space 必须收回 normal —— .bub 那句话是给文字气泡保换行用的（pre-wrap），
   而文件卡的 HTML 是缩进排版的，pre-wrap 会把每处缩进都变成真实空白，
   一张本该 ~118px 高的卡会被撑到 400px。 */
.bub.bf{padding:5px;white-space:normal}
.bub.bf .filecard{margin-top:0;min-width:0}
.msg.me .bub{background:var(--bubble-mine);border-color:transparent;
  border-top-left-radius:var(--r-bubble);border-top-right-radius:6px}
/* 曾经这里有 .bub.q / .bub.err / .bub.recalled 三套「按投递态给气泡染色」和下面
   .st 那一行状态行。整套删了：气泡只装话，在不在路上是会话顶那句横幅的事。 */
.filecard{display:flex;gap:10px;align-items:center;padding:9px 10px;background:var(--surface);
  border:1px solid var(--hair);border-radius:12px;margin-top:6px;min-width:196px;white-space:normal}
.win .filecard{min-width:210px}
.filecard .fi{width:34px;height:34px;border-radius:9px;background:var(--primary-c);color:var(--on-primary-c);
  display:grid;place-items:center;flex:none;overflow:hidden}
.win .filecard .fi{width:32px;height:32px}
.filecard .fi svg{width:18px;height:18px}
/* 内联媒体预览（img1 未声明时图片仍走文件卡；这里画的是"收到了能看一眼"的那种） */
.filecard .fi img{width:100%;height:100%;object-fit:cover}
.filecard .fn{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filecard .fs{font-size:11px;color:var(--on-2);margin-top:1px}
.filecard .frow{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.bar{height:3px;border-radius:2px;background:var(--surface-3);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary)}
/* 表格图文切换（tbl1） */
/* 移动端输入区 */
.composer{flex:none;background:var(--surface);border-top:1px solid var(--hair);padding:8px 10px}
.composer .box{display:flex;gap:6px;align-items:flex-end}
.composer .cpill{flex:1;display:flex;align-items:center;background:var(--surface-2);border-radius:20px;padding:2px 6px 2px 12px;border:1px solid var(--outline)}
.composer .cpill textarea{flex:1;border:0;background:transparent;color:var(--on);font-size:var(--fs-body);padding:6px 0;resize:none;height:36px;outline:none;line-height:22px}
.composer .cpill .ebtn{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--on-2);display:grid;place-items:center;cursor:pointer;flex:none}
.composer .cpill .ebtn svg{width:18px;height:18px}
.composer .more-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--outline);background:var(--surface-2);color:var(--on-2);display:grid;place-items:center;cursor:pointer;flex:none}
.composer .more-btn svg{width:18px;height:18px}
.composer .more-btn:hover{background:var(--surface-3);color:var(--on)}
.composer.more-open .more-btn{background:var(--primary-c);color:var(--primary);border-color:var(--primary)}
.composer .send{width:38px;height:38px;border-radius:50%;border:0;background:var(--primary);
  color:var(--on-primary);display:grid;place-items:center;cursor:pointer;flex:none}
.composer .send svg{width:18px;height:18px}
.composer .send:disabled{opacity:.35}
.composer .hintline{font-size:11px;color:var(--on-2);margin-top:5px;display:flex;gap:10px;align-items:center}
.composer .more-panel{--more-h:170px;display:none;height:var(--more-h);overflow-y:auto;background:var(--surface-2);border-radius:16px;padding:12px;margin-top:8px} /* 高度固定=2行槽位（2×68+gap10+padding24）；条目与提示语都不许撑高它，见 README §21.4 */
.composer.more-open .more-panel{display:block}
/* .mhint 已废（2026-10-15 两轮纠正，最终落点=hintline 右槽）。第一轮我据「.shint 常驻」删它 —— **前提被实测推翻**：toolsRow 只被桌面调用（:5800），手机帧 div.tools=0、.shint 在手机从未渲染，面板那条是唯一落点，删=丢信息。第二轮：移进 hintline（群聊时替换品牌句「局域网直连 · 走 UDP 单播」，可执行约束优先）——常驻可见，且面板不再为它多占 25px，两态同高 170、网格两行全见。三态文案机（0 在线/群/单聊离线）见 screenChatGroup 批注。 */
.composer .more-panel .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.composer .more-panel .mitem{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;text-align:center}
.composer .more-panel .mico{width:50px;height:50px;border-radius:14px;background:var(--surface);display:grid;place-items:center;color:var(--on);box-shadow:var(--shadow)}
.composer .more-panel .mico svg{width:22px;height:22px}
.composer .more-panel .mlbl{font-size:11px;color:var(--on-2);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* 输入区能力排：
   表情 · PK · 窗口震动 · 截图 · 图片 · 文件 · 文件夹，历史搜索吊在最右侧。
   表情在左（最高频的一次点击），文件/文件夹这类「重」的靠中，
   中间靠 tsep 撑开，好让右边的搜索贴住容器。
   这一排**是行不是列**：桌面聊天栏有 380~520 px 可用，横排放得下 8 颗 28 dp 的钮
   （8×28+间距 ≈ 250），放不下时靠 flex-wrap 换行，而不是把图标缩成 12 dp。
   清单在 JS 侧**只有一份**（就是 toolsRow()，定义在第一个调用它的屏前面）——
   要加减项去那里改，别在这里数项数。 */
.tools{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin:0 0 7px}
.tools .ibtn{width:28px;height:28px;background:transparent;color:var(--on-2)}
.tools .ibtn svg{width:16px;height:16px}
.tools .ibtn:hover:not(:disabled){background:var(--surface-2);color:var(--on)}
.tools .ibtn:disabled{opacity:.32;cursor:not-allowed}
/* 同一排在桌面那张浮起卡片里要再收一档左右内边距（12px），
   好跟下面的输入框（.ctxt:3px 12px 0）和底栏（.cinbar:8px 12px 10px）左右对齐 ——
   .cmp 本身没有内边距，>.tools 直接贴着卡片的 1px 边框。 */
.cmp .tools{padding:0 12px 4px;margin:0}
/* 禁用不给/icon 不给提示，用户只会以为自己没按对 —— 把理由挂在 title/aria-label 上：
   「PK 只能和在线的人玩」「仅在线群成员可接收图片/文件」。 */
.tools .tsep{flex:1 1 auto}
.tools .shint{font-size:11px;color:var(--on-2);margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* PK / 表情的浮层。两个 popover 同高，PK 那个是竖向两项（猜拳 / 骰子）。 */
.pop{position:absolute;bottom:calc(100% - 2px);z-index:12;background:var(--surface);
  border:1px solid var(--outline);border-radius:var(--r-ctl);padding:4px;display:none;gap:2px;min-width:96px;
  box-shadow:0 6px 18px rgba(0,0,0,.16)}
/* 弹层只在该按钮 hover / 聚焦时出现 —— 之前漏了隐藏态，弹层一直摊开在聊天屏上 */
span:hover>.pop, span:focus-within>.pop{display:grid}
.pop .pbtn{border:0;background:transparent;color:var(--on);font-size:12px;display:flex;align-items:center;gap:8px;
  padding:7px 10px;border-radius:8px;cursor:pointer;width:100%;text-align:left}
.pop .pbtn:hover{background:var(--surface-2)}
.pop .pbtn:disabled{opacity:.35;cursor:not-allowed}
.pop .pbtn svg{width:17px;height:17px;color:var(--on-2)}
/* 会话标签条（SessionTabStrip）样式已移除：该控件按产品判断不再演示（见 screenChat 注释）。 */
/* 桌面输入区：结构（浮起卡片 + 顶部拖拽把手 + 工具行 + 底栏） */
.dcmp{flex:none;background:var(--bg);padding:0 16px 14px}
.cmp{position:relative;background:var(--surface);border:1px solid var(--hair);
  border-radius:var(--r-card);box-shadow:var(--shadow)}
.cmp .grip{height:9px;display:flex;align-items:center;justify-content:center;cursor:ns-resize}
.cmp .grip i{display:block;width:28px;height:3px;border-radius:2px;background:var(--outline)}
.emoji{position:absolute;left:12px;bottom:calc(100% - 4px);width:270px;z-index:12;
  background:var(--surface);border:1px solid var(--hair);border-radius:12px;
  box-shadow:var(--shadow-pop);padding:8px 8px 6px}
.emoji .egrid{display:grid;grid-template-columns:repeat(8,1fr);gap:1px}
.emoji .eb{display:block;height:30px;border:0;border-radius:7px;background:transparent;
  font-size:16px;line-height:30px;cursor:pointer}
.emoji .eb:hover{background:var(--surface-2)}
.emoji .ehint{margin:4px 2px 0;font-size:11px;color:var(--on-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.ctxt{width:100%;display:block;border:0;background:transparent;color:var(--on);font-size:14px;
  line-height:1.55;padding:3px 12px 0;resize:none;height:44px;outline:none}
.cinbar{display:flex;align-items:center;gap:10px;padding:8px 12px 10px}
.cinbar .meta{font-size:11px;color:var(--on-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.cinbar .meta b{font-weight:600;color:var(--on)}
.cinbar .keys{margin-left:auto;flex:none;display:flex;align-items:center;gap:10px;
  font-size:11px;color:var(--on-2)}
.cinbar .keys .k{background:var(--surface-2);border-radius:5px;padding:1px 5px;font-size:11px;margin-right:3px}
.csend{min-width:76px;height:32px;flex:none;padding:0 14px;border:0;border-radius:9px;
  background:var(--primary);color:var(--on-primary);font-size:12px;font-weight:600;cursor:pointer}
.csend.dim{opacity:.4;cursor:default}
.win[data-tier="medium"] .cinbar .keys,
.win[data-tier="compact"] .cinbar .keys{display:none}
.win[data-tier="compact"] .dcmp{padding:0 12px 12px}
.win[data-tier="compact"] .csend{min-width:60px;padding:0 12px}

/* ====================== 8. 设置页专用 ====================== */
.pad.set{max-width:640px;margin:0 auto}
/* 「编辑资料」这一屏的两张卡。源码里它本来就是两张：身份是独立的
   Surface(surfaceVariant)（SettingsScreen.kt:459-500），表单是 SectionCard（`:502-559`）。
   稿子原来把两张并成一张白卡，于是「我是谁」和「改什么」没有任何视觉差别。
   把身份卡翻成 --surface-2，只读的那张自然退到后面；它里面那个头像读的就是下面几个
   输入框的本地状态，所以它是「对端会看到的样子」的实时预览，不是装饰。 */
.idcard{background:var(--surface-2);border-radius:var(--r-card);padding:14px;margin-top:10px}
/* 在线圆点的描边原本写死 --surface（白），换个底色就会露白圈 —— 跟着卡走。 */
.idcard .phead .pav .p{border-color:var(--surface-2)}
/* 卡内的小标签要翻成 --surface：`.tag` 的默认底正是 --surface-2，压在同色卡上会消失。
   这也正是源码的写法 —— 那枚「节点 xxxx」用的是 surface，不是 surfaceVariant
   （SettingsScreen.kt:490）。 */
.tag.plain{background:var(--surface)}
/* 表单里的分组：一条发丝线 + 一个小节名。比再开一张卡轻，比什么都不加清楚。 */
.psep{display:flex;align-items:center;gap:10px;margin:16px 0 12px;
  font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--on-2)}
.psep::after{content:"";flex:1;height:1px;background:var(--hair)}
/* 公司 / 部门并排 —— 源码就是 Row + weight(1f) 各占一半（SettingsScreen.kt:525-543），
   稿子原来竖着排，白占两行。桌面那个 720×560 的设置窗里纵向每一像素都贵。 */
.frow{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
/* 满宽主按钮 —— 源码 Button(modifier = fillMaxWidth())（SettingsScreen.kt:552-558） */
.cardfoot.wide{padding:12px 14px}
.cardfoot.wide .btn{flex:1}
.phead{display:flex;gap:14px;align-items:center}
.phead .pav{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;
  color:#fff;font-weight:600;position:relative}
.phead .pav .p{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;
  background:var(--online);border:2.5px solid var(--surface)}
.phead .pb{flex:1;min-width:0}
