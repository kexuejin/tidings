}

/* 「会话」**一行**切换条（`.swbar`）—— 手机聊天屏、手机 Agent 控制台、桌面聊天窗、
   桌面 Agent 控制台，四处共用同一份，两端才逐字同款（README §10.9 的 A 类共享）。

   为什么是一行而不是信息卡：它是**切换器**。行上只有**会话名**（协议 `alias`，
   缺省退到 `sessionId`）与**行尾的状态**（`state`）—— 与选择器里的每一条同源同款，
   因为两者回答的是同一个问题「这个工作区在跑哪条会话、它是死是活」。
   标题（`title`）不在这行：它属于「详情」，留数据里、以 `title=""` 悬停提示兜住
   （见 README §10.10 第五）。名字长了由 `.swbar .nm` 走省略号，不换行、不撑高。
   这正好是 dsh「一个 workspace 下挂多个会话」的量级：一行一条线程。

   尾巴那颗是**向下**的 chevron（源码 `:430-437` `Icons.Filled.KeyboardArrowDown`），
   不是「进入下一层」的右箭头 —— 它点开的是**下方**弹出来的对话框。

   会话名前那个红色小角标（`.pcount`）是**这一轮加的产品层信息**：协议里
   `agent-approval` 本来就带 `sessionId`，源码却只按节点过滤
   （`AgentConsoleScreen.kt:232`），于是「哪条会话在等你」在界面上无处可寻。
   角标把它补上 —— 不用点进控制台就能知道该切到哪条。它只统计
   `status==pending && !过期`（`isPending`），所以是个会自己消失的数字。
   注意它是**提案**不是源码既有能力，见 README §11 第四节。

   `extra` 只用来加形式类：桌面端传 `'d'`（内缩量对齐 `.dhead` 的 18px）。 */
function sessionBarHTML(w, extra){
  const s = w.sessions[wsSessionIdx];
  const canSwitch = w.sessions.length > 1;
  return `<div class="swbar ${extra||''}${canSwitch?' on':''}" ${canSwitch?`role="button" onclick="openSessionPicker()"`:''}>
    <span class="xlbl">会话</span>
    <span class="nm"><b>${s.alias || s.sessionId}</b></span>
    ${pcountHTML(pendingOf(s.sessionId))}
    ${stateLabelHTML(s.state)}
    ${canSwitch?`<span class="rt" aria-label="切换会话">${ic('chevd')}</span>`:''}
  </div>`;
}

/* 工作区看板与会话详情（雷达看板 + 详情内全量会话切换抽屉） */
function activeSessionOf(w){
  const withPending = w.sessions.find(s => pendingOf(s.sessionId) > 0);
  if (withPending) return withPending;
  const busy = w.sessions.find(s => s.state === 'busy');
  if (busy) return busy;
  return w.sessions[0];
}

/* `foot` / `click` 是两个可选覆盖：Agent 详情那张扁平会话列表里，同一条会话卡要写
   「未归属会话」而不是「共 N 个会话」（N 是工作区的会话数，在扁平列表里没有意义），
   点它也要走 `openUnassigned` 而不是 `openSessionDetail`。默认两个参数都不用，行为不变。 */
function sessionCardHTML(w, s, wIdx, sIdx, foot, click){
  const pend = pendingOf(s.sessionId);
  const name = s.alias || s.sessionId;
  const latestEvt = s.events && s.events.length > 0 ? s.events[0] : null;
  const time = s.updatedAt || (latestEvt ? latestEvt.at : '');
  const desc = latestEvt ? `${latestEvt.eventType}: ${latestEvt.summary}` : (s.title || '无任务描述');

  return `<div class="session-card" onclick="${click || `openSessionDetail(${wIdx}, ${sIdx})`}" role="button">
    <div class="head">
      <div class="name">
        ${ic('terminal')}
        <span class="ell">${name}</span>
        ${s.agentKind ? `<span class="tag sm">${s.agentKind}</span>` : ''}
      </div>
      <div class="state">
        ${pend > 0 ? `<span class="session-pending-bar">⚠️ ${pend}项待审</span>` : stateLabelHTML(s.state)}
      </div>
    </div>
    <div class="summary">${desc}</div>
    ${s.announced === false ? `<div class="session-warn-bar">只收到事件，没收到会话宣告</div>` : ''}
    <div class="foot">
      <span>${foot || `共 ${w.sessions.length} 个会话 · 最新活动 ${time || '刚刚'}`}</span>
      <span class="chev">${ic('chev')}</span>
    </div>
  </div>`;
}

/** 一个"老端"agent 的退化卡（§3.1）：它宣告了会话、却没宣告任何工作区。

    上面直接写「未上报工作区」—— 点进去是它的 agent 详情。

    </div>
    <div class="session-list">
      <div class="hint" style="margin:0">对端没有上报工作区信息 —— 可能是老版本，
        也可能是它确实还没有工作区。会话宣告到了会直接列在它的详情页里。</div>
    </div>
  </div>`;
}
/* 工作区看板（§3.1 改）。**外层是节点（= 设备）、内层才是工作区** —— 同一个节点上跑着两个
   agent 时，「这台机器上有谁、各自在忙什么」比「一共几块工作区」更接近人真正想问的问题。
   分组只认 `nodeId`（协议 D6：节点键就是节点身份），一个节点 = 一行/一组。
   只有一个节点时不画组头 —— 一个只有一个分组的标题行只是噪音。
   「未归属会话」只写一行、不造卡：它是会话层面的漏网之鱼，不是工作区（§2.5）。 */
function screenAgents(){
  const groups = boardGroups();
  const totalWs = groups.reduce((n, g) => n + g.wss.length, 0);
  const totalSessions = WORKSPACES.reduce((n, w) => n + w.sessions.length, 0)
                      + PEERS.reduce((n, p) => n + (p.unassigned || []).length, 0);
  const totalAgents = groups.reduce((n, g) => n + g.agentCount, 0);
  const totalPending  = WORKSPACES.reduce((n, w) => n + wsPending(w), 0);
  const sub = `${groups.length} 台设备 · ${totalAgents} 个 Agent · ${totalWs} 个工作区 · ${totalSessions} 个会话${
    totalPending > 0 ? ` · ${totalPending} 项待审批` : ''}`;

  return `${topbar('工作区', sub, [{icon:'refresh', label:'刷新'}])}
  <div class="scroll"><div class="pad">
    ${totalPending > 0 ? `
    <div class="grphead" style="color:var(--on-queued-c)">待处理审批<span class="cnt">${totalPending} 项</span></div>
    ${WORKSPACES.map(w => apprSectionHTML(w)).join('')}
    ` : ''}

    ${groups.map(g => {
      const un = g.agents.reduce((n, a) => n + unassignedOf(a.nodeId, a.key).length, 0);
      const unOwner = g.agents.find(a => unassignedOf(a.nodeId, a.key).length) || g.prim;
      const cards = g.wss.map(w => {
        const wIdx = WORKSPACES.indexOf(w);
        const activeS = activeSessionOf(w);
        const activeIdx = w.sessions.indexOf(activeS);
        return `<div class="ws-block">
        <div class="ws-head" role="button" style="cursor:pointer"
          onclick="selWsIdx=${wIdx};go('m-workspacedetail')">
          <div class="title">
            <span class="av" style="width:12px;height:12px;background:${
              w.online ? 'var(--online)' : 'var(--error)'}"></span>
            <b>${wsName(w)}</b>
            ${kindsOfWs(w).map(k => `<span class="tag sm">${k}</span>`).join('')}
            ${w.source ? `<span class="tag">${w.source}</span>` : ''}
          </div>
          <span class="path" title="${w.wsPath || ''}">${w.wsPath || '—'}</span>
        </div>
        <div class="session-list">
          ${sessionCardHTML(w, activeS, wIdx, activeIdx >= 0 ? activeIdx : 0)}
        </div>
        ${w.online ? '' : offlineHTML(w)}
      </div>`;
      }).join('');
      const fb = g.agents.filter(a => !wssOfAgent(a.nodeId, a.key).length
                                   && sessionsOfAgent(a.nodeId, a.key).length)
                         .map(agentFallbackCardHTML).join('');
      return `
      ${groups.length > 1 ? `
      <div class="grphead" role="button" style="cursor:pointer" onclick="openAgent('${g.prim.nodeId}')">
        <span class="av" style="width:14px;height:14px;background:${
          g.online ? 'var(--online)' : (g.never ? 'var(--error)' : 'var(--on-2)')}"></span>
        <span class="ell">${g.name} · ${g.plat}</span>
        <span class="cnt">${g.agentCount} 个 Agent · ${g.wss.length} 个工作区${
          g.online ? '' : ` · 最后在线 ${g.lastSeen}`}</span>
      </div>` : ''}
      ${cards}${fb}
      ${un > 0 ? `<div class="krow" onclick="openUnassigned('${unOwner.nodeId}', 0)">
        <div class="av" style="background:var(--surface-2);color:var(--primary)">${ic('list')}</div>
        <div class="bd"><div class="t1">未归属会话 <span class="tag muted">${un}</span></div>
          <div class="t2">收到了会话，但没收到它属于哪个工作区</div></div>
        <div class="rt">${ic('chev')}</div></div>` : ''}
      ${!cards && !fb && !un ? `<div class="hint" style="margin:0 4px 10px">
        这台设备上有 agent，但还没有收到任何工作区宣告。</div>` : ''}`;
    }).join('')}
  </div></div>`;
}

function screenSessionDetail(){
  /* 走 `currentWs()` 而不是直接 `WORKSPACES[wsIdx]`：未归属会话也要能进这一屏看它的

  const w = currentWs();

    </div>
    ${w.sessions.length > 1 ? `
    <div class="swbar on" role="button" onclick="openSessionPicker()" style="border-top:1px solid var(--hair)">
      <span class="xlbl">切换会话</span>
      <span class="nm"><b>${name}</b></span>
      ${pcountHTML(pendingOf(s.sessionId))}

    </div>

    ${apprs.length > 0 ? `
    <div class="grphead">会话审批<span class="cnt">${apprs.length} 项</span></div>

    <div class="grphead">事件流<span class="cnt">${s.events.length} 条事件</span></div>
    <div class="card"><div class="padc">
      ${s.events.map(eventRowHTML).join('')}
    </div></div>

    <div class="grphead">追加交互指令</div>
    <div class="card"><div class="padc">
      <div class="field" style="margin-bottom:8px">
        <input class="inp" placeholder="向此工作区会话追加 Prompt 指令…" />
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="hint">通过 ams1 能力通道双向交互</div>
        <button class="btn sm pri">${ic('send')} 发送</button>

}

/* ==================== Agent 详情 / 工作区详情（§3.1 的第 3、4 层）====================
   链路是：节点（设备）→ 节点详情（设备身份 + **Agent 清单**）→ Agent 详情（身份 +
   工作区 + 未归属会话 + 跨工作区会话）→ 工作区详情（身份 + 会话 + 事件流）→ 会话详情。
   每层只回答上一层没回答的问题：设备页答"哪台机器上有谁"，Agent 页答"这个 Agent 在忙什么"，
   工作区页答"这个工作区里发生了什么"。

   两条身份规则在这里落地，写错就会变成"看着对、其实在猜"：
     · **节点就是设备**（协议 D6）：`nodeId` 既是一台设备的节点身份，也是归属层级的第一层。
       `deviceId`（D5）整条撤回，本页不再有「设备」这一层。
     · **Agent 的身份键 = `agentId ?? agentKind`**（协议 D6）：有 `agentId` 就用它当主名、
       另给一枚 `agentKind` 类型徽标；只有 `agentKind` 就用它当主名；两者都缺 ⇒
       「未上报类型」。昵称可重名、可修改，所以**不拿昵称当身份**；`ag1` / `tw1` 这类
       wire 键也永不当产品名（R2）。
     · 缺 `wsTitle` 时显示「未命名工作区」并说明，**不拿 `wsId` 冒充名字**（R1）；
       缺 `wsPath` 显示「—」（R5）。

   `selAgent`（nodeId）+ `selAgentKey`（agent 身份键，空串 = 取该节点的第一个 agent）
   + `selWsIdx` 是屏间共享的选中态，与 `wsIdx` / `selNode` 同一套做法。 */
let selAgent = NID.agent;
let selAgentKey = '';
let selWsIdx = 0;
/* `?solo=<nodeId>` 验证钩子：把工作区看板收到**一个节点**（节点 = 设备，协议 D6）。
   默认夹具是 8 个节点，「只有一个节点时不画分组头」那条分支否则永远跑不到。 */
let wsBoardSolo = '';
/* 当前会话挂在哪个工作区。正常是 `WORKSPACES[wsIdx]`；从「未归属会话」点进来时是它的
   **渲染壳** —— 未归属会话不能塞进 `WORKSPACES`，那会让工作区看板与桌面左栏凭空多出
   一张工作区卡（§2.5：未归属会话 ≠ 空工作区，两者是两回事）。
   `wsShellKey` 记住这份壳收的是**哪一个 agent** 的未归属会话：键是 `agentId ?? agentKind`，
   空串 = 这个节点上所有 agent 的（看板上那一行的计数就是这么来的）。 */
let wsShellNode = '', wsShellKey = '';
const wsName = w => w.wsTitle || '未命名工作区';
const kindsOfWs = w => [...new Set([w.agentKind, ...w.sessions.map(s => s.agentKind)].filter(Boolean))];
function unassignedShell(p, key){
  const list = key ? unassignedOf(p.nodeId, key) : (p.unassigned || []);
  return {name:'未归属会话', wsTitle:'未归属会话', source:'—', path:'—', wsPath:'—',
          online:p.online, lastSeen:p.lastSeen === 0 ? '刚刚' : p.lastSeen,
          sessions:list, agentNodeId:p.nodeId, unassigned:true};
}
const currentWs = () => (wsShellNode ? unassignedShell(peerOf(wsShellNode), wsShellKey)
                                     : WORKSPACES[wsIdx]);
/* 当前看的 agent：`selAgentKey` 命中的那一个；空串（或键已失效）取该节点的第一个。
   一个既没声明 `ag1`、也没有任何 agent 帧的节点仍然给一个「未上报类型」的占位，
   屏函数不必各自兜空。 */
function currentAgent(){
  const ags = agentsOfNode(selAgent);
  return ags.find(a => a.key === selAgentKey) || ags[0] ||
         {nodeId:selAgent, key:UNKNOWN_KIND, agentId:'', agentKind:''};
}
/* `nodeDetailBody` / `agentDetailBody` 这两个渲染件**手机和桌面两个宿主都用**（桌面是把
   它们塞进右栏 `.dbody`）。行里的落点得跟着宿主走：`stage()` 按 `formOf(curScreen)` 选外壳，
   在桌面上点一行却 `go('m-…')` 会把整个桌面外壳换成手机外壳。 */
const deskNow = () => formOf(curScreen) === 'desktop';
function openAgentOf(nodeId, key){
  selAgent = nodeId; selAgentKey = key || '';
  wsShellNode = ''; wsShellKey = '';
  go(deskNow() ? 'd-agentdetail' : 'm-agentdetail');
}
function openAgent(id){ openAgentOf(id, ''); }
function openWorkspace(wsId){
  const i = WORKSPACES.findIndex(w => w.wsId === wsId);
  if (i >= 0) selWsIdx = i;
  wsShellNode = ''; wsShellKey = '';
  go(deskNow() ? 'd-workspacedetail' : 'm-workspacedetail');
}
function openUnassigned(nodeId, j, key){
  wsShellNode = nodeId; wsShellKey = key || '';
  wsSessionIdx = j;
  go(deskNow() ? 'd-agents' : 'm-session-detail');
}
/** 工作区看板画哪几个节点：**只在有 agent 的节点上画** —— 一台纯传文件的同事电脑没有
    工作区可言，给它一个空分组头只会让人以为漏了数据。 */
function boardGroups(){
  const gs = allNodes().filter(g => g.agentCount > 0);
  return wsBoardSolo ? gs.filter(g => g.node.nodeId === wsBoardSolo) : gs;
}
/** 一条工作区（Agent 详情里的「工作区」区一行）。类型徽标派生自它**会话**的 `agentKind`，
    来源标记是产品层的 `source` —— 缺值就不画，不拿 `wsId` 或路径去凑（R1/R2）。 */
function wsRowHTML(w){
  const ss = w.sessions;
  const last = ss.map(s => s.updatedAt).filter(Boolean)[0] || '—';
  return `<div class="krow" onclick="selWsIdx=${WORKSPACES.indexOf(w)};go('${deskNow() ? 'd-workspacedetail' : 'm-workspacedetail'}')">
    <div class="av" style="background:var(--surface-2);color:var(--primary)">${ic('terminal')}</div>
    <div class="bd">
      <div class="t1 title1"><span class="ell">${wsName(w)}</span>${
        kindsOfWs(w).map(k => `<span class="tag sm">${k}</span>`).join('')}${
        w.source ? `<span class="tag muted">${w.source}</span>` : ''}</div>
      <div class="t2">${ss.length} 个会话 · 最近活动 ${last}</div>
      <div class="t3 mono">${w.wsPath || '—'}</div>
    </div>
    <div class="rt">${ic('chev')}</div>
  </div>`;
}
/** 离线块（Agent 版）。文案与 `offlineHTML` 同源 —— 它回答的是「我发出去的东西去哪了」。
    没上报过最后在线时间就写「—」，不编一个时间（老端那一档）。 */
function agentOfflineHTML(p){
  const ls = p.lastSeen === 0 ? '刚刚' : (p.lastSeen || '—');
  return `<div class="offline">
    <div class="ot">Agent 离线</div>
    <div class="om">它上次在线是 ${ls}。消息会排队，等它回来自动补发。</div>
  </div>`;
}
/** Agent 详情正文（手机整屏 / 桌面右栏共用一份，和 `nodeDetailBody` 同一套分工）。
    这一屏画的是**一个 agent**：身份键 = `agentId ?? agentKind`（协议 D6），所以正文接收的
    是 agent 对象而不是 peer —— 同一个节点上的两个 agent 走的是同一个 peer。 */
function agentDetailBody(a){
  const p = peerOf(a.nodeId);
  const wss = wssOfAgent(a.nodeId, a.key), un = unassignedOf(a.nodeId, a.key),
        ss = sessionsOfAgent(a.nodeId, a.key);
  const dot = p.online ? 'var(--online)' : (p.never ? 'var(--error)' : 'var(--on-2)');
  const state = p.never ? '没有回应' : (p.online ? '在线' : '离线');
  /* 老端降级条：只上报了类型（或连类型都没有）的 agent，身份退化成 `agentKind`。 */
  const legacy = !a.agentId;
  return `<div class="pad">
    <div class="ndhead">
      <div class="av xl" style="background:${p.c}">${p.ini}<span class="p" style="background:${dot}"></span></div>
      <div class="ndmeta">
        <div class="t1 spread"><span class="ell">${a.key}</span>${
          a.agentId && a.agentKind ? `<span class="tag sm">${a.agentKind}</span>` : ''}</div>
        <div class="ndtags"><span class="pill${p.online?' on':''}${p.never?' err':''}">${state}</span>
          <span class="tag muted">${p.remark || p.nick}</span></div>
      </div>
    </div>

    ${legacy ? `<div class="banner">${ic('info')}
        <div><b>这个 agent 没有上报 agentId，身份退化为类型。</b>主名只能用
          「${a.agentKind || UNKNOWN_KIND}」—— 同一节点上跑着两个同类型的 agent 时，
          这里就分不出谁是谁了。</div></div>` : ''}

    <div class="card"><div class="padc">
      <div class="kv" style="padding-top:0"><span class="k">地址</span>
        <span class="v mono">${p.host}:${p.port} · ${p.hostName}</span></div>
      <div class="kv"><span class="k">能力</span><span class="v">${capWords(p.cap)}</span></div>
      <div class="kv"><span class="k">节点 ID</span>
        <span class="v mono" title="${uuidOf(p.nodeId)}">${p.nodeId}</span></div>
    </div></div>

    <div class="grphead">工作区<span class="cnt">${wss.length}</span></div>
    ${wss.length ? `<div class="card"><div class="padc">
      ${wss.map(wsRowHTML).join('')}
    </div></div>`
    : `<div class="banner">${ic('info')}
        <div><b>对端未上报工作区信息。</b>这个 agent 连上了，但还没有宣告任何工作区 ——
          它可能是老版本，也可能确实没在跑工作区。没有数据就不画空骨架。</div></div>`}
    ${un.length ? `<div class="krow" onclick="openUnassigned('${p.nodeId}', 0, '${a.key}')">
      <div class="av" style="background:var(--surface-2);color:var(--primary)">${ic('list')}</div>
      <div class="bd">
        <div class="t1">未归属会话 <span class="tag muted">${un.length}</span></div>
        <div class="t2">收到了会话，但没收到它属于哪个工作区</div>
      </div>
      <div class="rt">${ic('chev')}</div></div>` : ''}

    ${p.online ? '' : agentOfflineHTML(p)}

    <div class="grphead">会话<span class="cnt">${ss.length}</span></div>
    ${ss.length ? `<div class="session-list">
      ${wss.flatMap(w => w.sessions.map((s, si) =>
        sessionCardHTML(w, s, WORKSPACES.indexOf(w), si,
          `工作区 ${wsName(w)} · 最近活动 ${s.updatedAt || '刚刚'}`))).join('')}
      ${un.map((s, si) => sessionCardHTML(unassignedShell(p, a.key), s, -1, si,
        `未归属会话 · 最近活动 ${s.updatedAt || '刚刚'}`,
        `openUnassigned('${p.nodeId}', ${si}, '${a.key}')`)).join('')}
    </div>`
    : `<div class="card"><div class="padc"><div class="hint" style="margin:0">
        尚未收到会话宣告</div></div></div>`}
  </div>`;
}
function screenAgentDetail(){
  const a = currentAgent();
  const p = peerOf(a.nodeId);
  const state = p.never ? '没有回应' : (p.online ? '在线' : '离线');
  return `${topbar(a.key, `${p.remark || p.nick} · ${a.agentKind || UNKNOWN_KIND} · ${state}`,
      [{icon:'refresh', label:'刷新'}], 'm-nodedetail',

        p.online ? 'var(--online)' : (p.never ? 'var(--error)' : 'var(--on-2)')}"></span>`),
      a.agentId && a.agentKind ? `<span class="tag sm">${a.agentKind}</span>` : '')}
  <div class="scroll">${agentDetailBody(a)}</div>`;
}
/** 工作区详情正文（手机整屏 / 桌面右栏共用）。 */
function workspaceDetailBody(w){
  const kinds = kindsOfWs(w);
  const dot = w.online ? 'var(--online)' : 'var(--error)';
  /* 事件流按 `cursor` 倒序 —— 但 `cursor` 只在**同一条会话内**单调递增，跨会话排它没有
     意义。所以这一屏画的是**当前活跃会话**的事件流，并在区头上点名是哪一条。 */
  const act = activeSessionOf(w);

  return `<div class="pad">

    <div class="card" style="margin-top:${w.wsTitle ? '0' : '10px'}"><div class="padc">
      <div class="krow dis" style="padding:0">
        <div class="av" style="background:var(--surface-2);color:var(--primary)">${ic('terminal')}<span class="p"
          style="background:${dot}"></span></div>
        <div class="bd">
          <div class="t1 title1"><span class="ell">${wsName(w)}</span>${
            kinds.map(k => `<span class="tag sm">${k}</span>`).join('')}${
            w.source ? `<span class="tag muted">${w.source}</span>` : ''}</div>
          <div class="t2 mono" title="${w.wsPath || ''}">${w.wsPath || '—'}</div>
          <div class="t3">${w.sessions.length} 个会话</div>

    <div class="session-list">
      ${w.sessions.map((s, si) => sessionCardHTML(w, s, selWsIdx, si)).join('')}
    </div>

    <div class="grphead">事件流<span class="cnt">${evts.length} 条 · ${act.alias || act.sessionId}</span></div>
    <div class="card"><div class="padc">
      ${evts.map(eventRowHTML).join('')}

    <button class="btn block pri" style="margin-top:14px"
      onclick="openChatOf('${w.wsId}')">${ic('chat')} 打开聊天</button>

}

/** 工作区看板·空态：**一台设备都没上报 Agent/工作区**时。写法和 `screenNodesEmpty` 同款

    </div>
    <div class="card">
      ${steps.map(([i,t,d],n)=>`
        <div class="avstep">
          <div class="asn">${n+1}</div>

      <div class="padc" style="padding-top:0">

          选了图才谈得上裁，裁完才谈得上编码，编码完才有哈希可写进档案。
          第 3 步和第 4 步之间那道线是同步边界 —— 越过它，对端按需拉取。</div>

          局域网里谁都看不过来的那些图，不进任何人的带宽。
          32 KiB 这个上限也是为了这个：让 base64 信封稳稳低于一个 TCP 控制帧（64 KiB）。</div>

/* ============================ P2P 文件传输 · 文件夹 ============================
   最容易画错的三条先摆出来，稿子按这三条画：
     1. 文件夹在会话里是**一条**，不是折叠树。子文件只在主进程 walkDir 里被递归压成一个整包
        （files.ts:1824-1847），渲染层 FileCard 只有一行图标 + 名称 + meta。
     2. 显示名规则（files.ts:598）是「只选了一个就叫 basename，选了多个才叫
        「<首个名字> 等 <N> 个文件」」—— 单发一个目录时不带「等 N 个文件」。
     3. 断点续传**只有入站侧**（files.ts:836-840 的 retryable 强制 direction === 'in'），
        出站失败没有「继续」，只能重发。
   进度条只在 status === 'accepted' 时渲染（FileCard.vue:87），速度写在 meta 行文本里，
   没有剩余时间（代码里没有 ETA）。 */
const TSTAT = {
  offering:  {t:'等待',   tone:''},
  accepted:  {t:'传输中', tone:''},
  done:      {t:'完成',   tone:'ok'},
  declined:  {t:'已拒收', tone:''},
  canceled:  {t:'已取消', tone:''},
  failed:    {t:'失败',   tone:'err'},
  expiredOut:{t:'发送已到期', tone:'err'},
  expiredIn: {t:'文件已过期', tone:'err'},
};
const FOLDERS = [
  {id:'fd1', root:'需求文档', n:18, cnt:'18 项', sz:'12.4 MB', dir:'out', who:'老周',
   st:'accepted', pct:62, spd:'1.2 MB/s'},
  {id:'fd2', root:'图纸', n:23, cnt:'23 项', sz:'31.8 MB', dir:'in', who:'Lin',
   st:'done', pct:100, spd:'2.4 MB/s'},
  {id:'fd3', root:'release', n:9, cnt:'9 项', sz:'640 MB', dir:'in', who:'Huang',
   st:'failed', pct:41, keep:'8.2 MB'},
];
/* 传输显示名规则（files.ts:598）。many = 一次选了多个路径。 */
const tname = (root, n, many) => many ? `${root} 等 ${n} 个文件` : root;
/** 文件夹 / 多文件传输在消息气泡里的那张卡。状态标签与 meta 都照 FileCard.vue 的取法。 */
function folderCard(f, many){
  const s = TSTAT[f.st];
  const label = f.st === 'accepted' ? (f.dir==='in' ? '传输中' : '发送中')
              : (f.st === 'done'    ? (f.dir==='in' ? '已完成' : '发送成功')
              : (f.st === 'failed'  ? '传输失败' : s.t));
  const meta = f.st === 'accepted'
    ? `${f.pct}% · ${f.sz} / ${f.sz} · ${f.spd}`
    : `${f.cnt} · ${f.sz} · ${f.will || ''}`;
  const ops = f.st === 'done'
    ? `<div class="frow"><button class="btn sm">${ic('external')} 打开</button>
        <button class="btn sm">分享</button></div>`
    : (f.st === 'failed'
      ? `<div class="frow"><button class="btn sm pri">继续</button>
          <button class="btn sm">重新下载</button></div>` : '');
  return `<div class="filecard">
    <div class="fi">${ic('folder')}</div>
    <div style="flex:1;min-width:0">
      <div class="fn">${tname(f.root, f.n, many)}</div>
      <div class="fs">${meta}</div>
      ${f.st==='accepted' ? `<div class="bar"><i style="width:${f.pct}%"></i></div>` : ''}
      <div class="fs" style="color:${
        f.st==='failed'?'var(--on-error-c)':(f.st==='done'?'var(--on-ok-c)':'')}">${label}</div>
      ${ops}
    </div></div>`;
}

/* 桌面侧栏：节点 → 工作区 → 会话（§3.2 改：外层按**节点**分组，协议 D6 起节点就是设备）。

   会话行仍然进会话详情台。分组键就是 `nodeId` —— 没有 `deviceId` 这一层。 */
function sideWorkspaces(selW, selS){
  const total = WORKSPACES.reduce((n, w) => n + w.sessions.length, 0)
              + PEERS.reduce((n, p) => n + (p.unassigned || []).length, 0);
  return `<div class="sidebody">
    <div class="sidehead">工作区与会话<span class="cnt">${total}</span></div>
    <div class="sidelist">
      ${boardGroups().map(g => {

        const unOwner = g.agents.find(a => unassignedOf(a.nodeId, a.key).length) || g.prim;
        return `
        <div class="grphead" role="button" style="cursor:pointer"
             onclick="openAgentD('${g.prim.nodeId}')">
          <span class="av" style="width:12px;height:12px;background:${
            g.online ? 'var(--online)' : (g.never ? 'var(--error)' : 'var(--on-2)')}"></span>
          <span class="ell">${g.name} · ${g.plat}</span>
          <span class="cnt">${g.agentCount} 个 Agent · ${g.wss.length} 个工作区${
            g.online ? '' : ` · 最后在线 ${g.lastSeen}`}</span>
        </div>
        ${g.wss.map(w => {
          const wi = WORKSPACES.indexOf(w);
          return `
          <div class="li" ${wi === selW ? 'aria-selected="true"' : ''}
               onclick="openWsD('${w.wsId}')">
            <div class="fi2" style="font-size:14px;color:var(--agent)">${ic('terminal')}</div>
            <div class="bd">
              <div class="t1"><span class="ell">${wsName(w)}</span>${
                kindsOfWs(w).map(k => `<span class="tag sm">${k}</span>`).join('')}</div>
              <div class="t2" title="${w.wsPath || ''}">${w.sessions.length} 个会话 · ${w.wsPath || '—'}</div>
            </div>
          </div>
          ${w.sessions.map((s, si) => {
            const sel = (wi === selW && si === selS);
            const pCnt = pendingOf(s.sessionId);
            return `<div class="li" ${sel ? 'aria-selected="true"' : ''} onclick="pickWorkspaceSession(${wi}, ${si})">
              <div class="fi2" style="font-size:14px;color:var(--agent)">${ic('terminal')}</div>
              <div class="bd">
                <div class="t1"><span class="ell">${s.alias || s.sessionId}</span>${pcountHTML(pCnt)}</div>
                <div class="t2">${s.title || (s.events && s.events[0] ? s.events[0].summary : '')}</div>
                <div class="t3">${stateLabelHTML(s.state)} · ${s.updatedAt || ''}</div>
              </div>
            </div>`;
          }).join('')}`;
        }).join('')}
        ${un > 0 ? `<div class="li" onclick="openUnassignedD('${unOwner.nodeId}', 0)">
          <div class="fi2" style="font-size:14px;color:var(--primary)">${ic('list')}</div>
          <div class="bd"><div class="t1"><span class="ell">未归属会话</span>

            <div class="t2">收到了会话，但没收到它属于哪个工作区</div></div>
        </div>` : ''}`;
      }).join('')}
    </div>
  </div>`;
}

function openAgentD(id){ selAgent = id; selAgentKey = ''; wsShellNode = ''; wsShellKey = ''; go('d-agentdetail'); }

/* ============================ 控制条与渲染 ============================ */
const $ = s => document.querySelector(s);

const Q = new URLSearchParams(location.search);
if (Q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
if (Q.get('font') === 'large') { fontLg = true; document.body.classList.add('font-lg'); }
if (Q.get('insets') === 'bad') insetsBad = true;

  if (Number.isInteger(a) && Number.isInteger(b)) { avMode='icon'; avIcon=a; avColor=b; }
}

if (Q.get('screen') && SCREENFN[Q.get('screen')]) curScreen = Q.get('screen');
else curScreen = SCREENS.find(s => s.form === SIZEOF[curForm].form).id;

/* ============================ 控制条与渲染 ============================
   形态（form）决定外壳与画布尺寸，屏（screen）决定内容。两者必须一致：
   屏按钮只列当前形态的屏，免得出现"手机壳里装着桌面窗口"这种读不出来的状态。
   点屏时若形态不匹配，自动把形态挪到该屏那一侧的第一档。 */
function formOf(screenId){
  const s = SCREENS.find(x => x.id === screenId);
  return s ? s.form : (SIZEOF[curForm] ? SIZEOF[curForm].form : 'mobile');
}
function firstScreenOf(form){ return (SCREENS.find(s => s.form === form) || {}).id; }
/** 形态切到该侧时，把落点定在"语义最接近的一屏"：消息/会话 → 首页，其余保持同标签页。 */
function setForm(id){
  if (!SIZEOF[id]) return;
  const to = SIZEOF[id].form;
  const from = formOf(curScreen);
  curForm = id;
  if (to !== from) {
    const tab = (SCREENS.find(s => s.id === curScreen) || {}).tab;
    const hit = tab && SCREENS.find(s => s.form === to && s.tab === tab);
    curScreen = hit ? hit.id : firstScreenOf(to);
  }
  gallery = false;
  render();
}
/** 屏内跳转（设置 → 更多设置、群信息 → 返回），等价于点控制条的屏按钮。 */
function go(id){
  if (!SCREENFN[id]) return;
  curScreen = id;
  const to = formOf(id);
  if (SIZEOF[curForm].form !== to) {
    const like = FORMS.find(f => f.form === to && f.tier !== 'settings');
    if (like) curForm = like.id;
  }
  gallery = false;
  render();
}
/* Agent 控制台：切工作区（顶部 chip）与切会话（卡片上的箭头）都用 go(curScreen) 整屏重绘，
   这样桌面端停留在 d-agents、手机端停留在 m-agents，不会跨形态跳。
   「工作区」是这一层的产品名（对齐 dsh 的 workspace）；协议里它就是 cap `ag1` 的 agent 节点。 */
function openSessionPicker(){ const el=document.getElementById('aspick'); if(el) el.classList.add('on'); }
function closeSessionPicker(){ const el=document.getElementById('aspick'); if(el) el.classList.remove('on'); }
/* 跳去某条会话时要把「这条会话挂在哪个工作区」复位：从「未归属会话」进去过一次之后，
   `wsShellNode` 还挂着的话，下一次点正常工作区里的会话会画成未归属那一屏。 */
function pickWorkspace(i){ wsIdx=i; wsSessionIdx=0; chatWsPinned=i; wsShellNode=''; go(curScreen); }
function pickSession(j){ wsSessionIdx=j; closeSessionPicker(); go(curScreen); }
function openSessionDetail(wIdx, sIdx){ wsIdx=wIdx; wsSessionIdx=sIdx; wsShellNode=''; wsShellKey=''; go(deskNow() ? 'd-agents' : 'm-session-detail'); }
function pickWorkspaceSession(wIdx, sIdx){ wsIdx=wIdx; wsSessionIdx=sIdx; wsShellNode=''; go(curScreen); }
function toggleInsets(){ insetsBad = !insetsBad; render(); }

/* 换屏会整体重绘，所以重绘前把各滚动容器的位置记下来，重绘后按同一个选择器+序号还原。
   消息区例外：它的语义就是"停在最新一条"，永远贴底，不还原。
   桌面端有 5 个滚动容器（会话列表 / 正文 / 侧栏 / 设置正文 / 弹层正文），
   只记一个 .scroll 是不够的 —— 设置页改个开关就会把左栏弹回顶部。 */
const SCROLLERS = ['.device .scroll', '.win .msgs', '.win .dbody', '.win .side',
                   '.win .sidelist', '.win .setbody', '.win .sh-body', '.win .dlg .dbody'];
let scrollMemo = new Map();
function grabScroll(){
  scrollMemo = new Map();
  SCROLLERS.forEach(sel => document.querySelectorAll(sel).forEach((el, i) => {
    if (el.scrollTop) scrollMemo.set(sel + '#' + i, el.scrollTop);
  }));
}
function putScroll(){
  SCROLLERS.forEach(sel => document.querySelectorAll(sel).forEach((el, i) => {
    if (el.classList.contains('msgs') || el.querySelector('.msgs')) { el.scrollTop = el.scrollHeight; return; }
    el.scrollTop = scrollMemo.get(sel + '#' + i) || 0;
  }));
}
function stage(){
  if (gallery) return buildGallery();
  grabScroll();
  const desk = formOf(curScreen) === 'desktop';
  try {
    $('#stage').innerHTML = desk ? win(curScreen, curForm) : device(curScreen, curForm);
  } catch (e) {
    // 一屏写崩了不该让整份原型变成白页（截图里根本看不出是报错还是空态）。
    // 把异常直接画进 #stage，谁截图都一眼看得见。
    $('#stage').innerHTML = `<pre style="margin:24px;padding:16px;border-radius:12px;
      background:#101413;color:#FF9A9A;font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap">屏 ${curScreen} 渲染失败：${e && e.message}
${(e && e.stack ? e.stack.split('\n').slice(0, 5).join('\n') : '')}</pre>`;
  }
  putScroll();
}

const GALLERY = [

  ['m-gsearch','phone'], ['m-gsearch-empty','phone'],
  ['m-chat','phone'], ['m-chat-solo','phone'], ['m-chat-group','phone'],
  ['m-groupcreate','phone'], ['m-msgmenu','phone'],
  ['m-groupinfo','phone'], ['m-nodes','phone'], ['m-addnode','phone'],
  ['m-addnode-fill','phone'], ['m-nodes-empty','phone'], ['m-myqr','phone'],
  ['m-agents','phone'],
  ['m-settings','phone'], ['m-set-profile','phone'], ['m-set-avatar','phone'],
  ['m-set-conn','phone'],
  ['m-set-notify','phone'], ['m-set-appear','phone'], ['m-set-caps','phone'],
  ['m-set-data','phone'], ['m-set-diag','phone'], ['m-insets','phone'],
  ['m-home-recent','tablet'],
  ['m-chat','tabland'], ['m-nodes','full'],
  ['d-chat','expanded'], ['d-chat-group','expanded'], ['d-groupcreate','expanded'],
  ['d-files','expanded'], ['d-nodes','expanded'], ['d-agents','expanded'],
  ['d-empty','expanded'], ['d-nosel','expanded'], ['d-filesempty','expanded'],
  ['d-nomatch','expanded'], ['d-tray','expanded'], ['d-drop','expanded'],
  ['d-emoji','expanded'],
  ['d-settings','settings'], ['d-settings-data','settings'],
  ['d-settings-desk','settings'], ['d-settings-ime','settings'],
  ['d-chat','compact'], ['d-chat','medium'],
  // 平板宿主：没有菜单栏，只有工具栏 —— 那颗「更多」只在这里出现
  ['d-home-more','tabhost'], ['d-chat','tabhost'],
];
function buildGallery(){
  const cell = ([s, z]) => {
    const sc = SCREENS.find(x => x.id === s) || {};
    const f = SIZEOF[z] || {};
    let inner;
    try {
      inner = f.form === 'desktop' ? win(s, z) : device(s, z);
    } catch (e) {
      // 一格崩了不该带走整张画廊
      inner = `<pre style="margin:12px;padding:12px;border-radius:10px;background:#101413;
        color:#FF9A9A;font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap">${s} · ${z}
${e && e.message}</pre>`;
    }
    return `<div class="gcell"><div class="lbl">${sc.label || s} · ${f.short || f.label || z}</div>${inner}</div>`;
  };
  $('#stage').innerHTML = `<div class="gallery">${GALLERY.map(cell).join('')}</div>`;
}

function press(el, on){ el.setAttribute('aria-pressed', on ? 'true' : 'false'); }
function sync(){
  // 屏按钮跟着形态走，所以每次都要重建；形态按钮只有 9 个，重建也无所谓。
  const form = SIZEOF[curForm].form;
  $('#cForm').innerHTML = FORMS.map((f, i) =>
    `${i && FORMS[i-1].form !== f.form ? '<span class="sep"></span>' : ''}${
      `<button class="c" data-k="${f.id}">${f.short || f.label}</button>`}`).join('');
  const list = SCREENS.filter(s => s.form === form);
  $('#cScreen').innerHTML = list.map(s => `<button class="c" data-k="${s.id}">${s.label}</button>`).join('');
  [...$('#cForm').children].forEach(b => b.dataset.k && press(b, b.dataset.k === curForm));
  [...$('#cScreen').children].forEach(b => press(b, b.dataset.k === curScreen));
  press($('#cLight'),   document.documentElement.dataset.theme !== 'dark');
  press($('#cDark'),    document.documentElement.dataset.theme === 'dark');
  press($('#cFont'),    fontLg);
  press($('#cGallery'), gallery);
  document.body.classList.toggle('font-lg', fontLg);
}
function render(){ sync(); stage(); }

/* 控制条 */
$('#cForm').onclick = e => { const b = e.target.closest('[data-k]'); if (b) setForm(b.dataset.k); };
$('#cScreen').onclick = e => { const b = e.target.closest('[data-k]'); if (b) go(b.dataset.k); };
$('#cLight').onclick = () => { document.documentElement.dataset.theme = 'light'; render(); };
$('#cDark').onclick  = () => { document.documentElement.dataset.theme = 'dark'; render(); };
$('#cFont').onclick  = () => { fontLg = !fontLg; render(); };
$('#cGallery').onclick = () => { gallery = !gallery; render(); };

/* 主题还能被 <html data-theme> 直接改（比如浏览器里手改属性），跟着重绘。 */
new MutationObserver(render).observe(document.documentElement,
  {attributes:true, attributeFilter:['data-theme']});
/* 验证钩子：
   ?ws=<下标>     直接落到第 N 个工作区（拍「离线工作区」那一档用 —— `ci-runner` 是离线的，
                  `!online` 那条源码分支才有地方可看）；
   ?sessionpick=1 让会话切换浮层默认展开（截图 / 回归用）；
   ?actmore=N     把头部直出动作的上限压到 N，逼出「⋯」收纳那一态 ——
                  不这样就得等真的多出第 3 个动作才看得见它。同样要在首次 render() 之前生效。
   ?agent=<nodeId> 直接落到某台设备上那个 agent 的详情 —— agent 详情是多实例屏，
                  「身份键退化为 agentKind」与「对端未上报工作区」这两档只能这样拍到；
   ?akey=<agentKey> 配合 `?agent=` 选这个节点上的**哪一个** agent（键 = `agentId ?? agentKind`）：
                  一个节点上可以挂多个 agent（协议 D6），不指定就取第一个；
   ?wsd=<下标>     直接落到第 N 个工作区详情（「未命名工作区」那一档用它拍）；
   ?solo=<nodeId>  把工作区看板收到**一个节点**，逼出「只有一个节点时不画分组头」那条
                  分支 —— 默认夹具是 8 个节点，它否则永远跑不到。
   ?node=<nodeId>  直接落到某个节点的详情 —— 节点详情里那张「Agent」区（§3.1）只在
                  该设备声明了 `ag1` 时才画，默认选中的「老周」不是 Agent，拍不到。
   `ws` / `actmore` / `agent` / `akey` / `wsd` / `solo` / `node` 必须在首次 `render()` **之前**生效，
   否则会先画一遍再跳。 */
const wsQ = Q.get('ws');
if (wsQ !== null && WORKSPACES[Number(wsQ)]) { wsIdx = Number(wsQ); wsSessionIdx = 0; }
const agentQ = Q.get('agent');
if (agentQ && PEERS.some(p => p.nodeId === agentQ)) selAgent = agentQ;
const akeyQ = Q.get('akey');
/* 只在这个键真的存在时才认 —— 键失效就退回该节点的第一个 agent，不画一个不存在的身份。 */
if (akeyQ && PEERS.some(p => p.nodeId === selAgent)
    && agentsOfNode(selAgent).some(a => a.key === akeyQ)) selAgentKey = akeyQ;
const wsdQ = Q.get('wsd');
if (wsdQ !== null && WORKSPACES[Number(wsdQ)]) selWsIdx = Number(wsdQ);
const soloQ = Q.get('solo');
if (soloQ && PEERS.some(p => p.nodeId === soloQ)) wsBoardSolo = soloQ;
const nodeQ = Q.get('node');
if (nodeQ && PEERS.some(p => p.nodeId === nodeQ)) selNode = nodeQ;
const amQ = Q.get('actmore');
if (amQ) actMax = Math.max(1, parseInt(amQ, 10) || 1);
render();
if (Q.get('sessionpick') === '1') openSessionPicker();
/* 钩子开着时把菜单也展开，截图里才看得到菜单内容。 */
if (amQ) document.querySelectorAll('.hdmore').forEach(x => x.classList.add('on'));
</script>
</body>
</html>
