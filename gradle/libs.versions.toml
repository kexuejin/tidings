[versions]
luciola = "0.4.6"
agp = "9.4.1"
android-compileSdk = "36"
android-buildToolsVersion = "36.1.0"
android-minSdk = "24"
kotlin = "2.4.0"
compose-multiplatform = "1.11.1"
# 官方自适应布局（Compose Multiplatform 版），稳定版 1.2.0。
# 不用 1.3.0-rc01：它要求 Compose 1.10.0 与 window-core 1.5.0，本仓库暂不升级。
compose-material3-adaptive = "1.2.0"
# Compose Preview Screenshot Testing: renders the @PreviewTest composables on the
# host JVM. No device, no emulator. See compose-preview-screenshot-tests.
screenshot = "0.0.1-alpha16"

androidx-core = "1.17.0"
androidx-activity = "1.12.0"
# CameraX for QR scanning (P4)
camerax = "1.4.1"
# ML Kit barcode scanning for QR detection
mlkit-barcode = "17.3.0"
# --- Tidings core (agent + IM protocol) ---
# 所有依赖只用公开 Maven 坐标，不引入任何私有仓库构件。
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
ktor = "3.3.1"
sqldelight = "2.0.2"
# 聊天消息的富文本渲染（agent 回复本来就是 Markdown）。见 feature/chat/MarkdownMessage.kt。
#
# **为什么钉 0.41.0 而不是最新**：从 0.42.0 起这个库的 AAR 声明 `minCompileSdk=37`，
# 而本仓库 compileSdk 是 36 —— 装上红在 `:androidApp:checkDebugAarMetadata`（不是编译错，
# 是 AAR 元数据检查），本机 SDK 也还没有 android-37 可装。0.41.0 是最后一个 `minCompileSdk=36` 的版本。
#
# 升级条件（两条一起满足再动这个号）：
#   ① compileSdk 升到 37；
#   ② Compose 那条线也对齐 —— 0.44.0 起上游的 android 运行面会声明 compose.foundation:1.12.x，
#      而本仓库没有 resolutionStrategy/force 钉版本，会静默把 Compose 栈抬到 1.12（编译面却停在 1.11）。
markdown-renderer = "0.41.0"

[libraries]
luciola = { module = "io.github.kexuejin:luciola-jvm", version.ref = "luciola" }
luciola-android = { module = "io.github.kexuejin:luciola-android", version.ref = "luciola" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
screenshot-validation-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "screenshot" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
# BackHandler 在 common 里可用，但它**不随 compose.ui 的 platform 变体传递**：
# ui 的 metadataApiElements 声明了 ui-backhandler，published 的 desktop/android
# 变体却是空的，所以只写 compose.ui 时 commonMain 编译通过、平台目标报
# `Unresolved reference 'backhandler'`。必须显式声明。
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }
# --- 官方自适应布局（material3-adaptive）---
# 三个模块对应官方文档的三层：
#   adaptive           —— 自适应计算的骨架 + WindowSizeClass 桥接
#   adaptive-layout    —— ListDetailPaneScaffold / ThreePanePaneScaffold 等容器
#   adaptive-navigation—— ListDetailPaneScaffold / SinglePaneScaffold 的导航包装
# 与 backhandler 同理：commonMain 直接用这些 @Composable 时必须显式声明。
compose-material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "compose-material3-adaptive" }
compose-material3-adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "compose-material3-adaptive" }
compose-material3-adaptive-navigation = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation", version.ref = "compose-material3-adaptive" }
# --- Tidings core ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
# CameraX + ML Kit for QR scanning
camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
mlkit-barcode = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode" }
# --- SQLDelight ---
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
# --- 富文本 ---
# -m3 才有按 Material3 主题取色的 markdownColor()/markdownTypography()；
# base 模块只给渲染器与 AST。
markdown-renderer = { module = "com.mikepenz:multiplatform-markdown-renderer", version.ref = "markdown-renderer" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
